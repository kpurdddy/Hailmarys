<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hail Marys G2.4.0</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.4}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#555}

.game-container{max-width:750px;margin:0 auto;padding:0 4px;position:relative}

/* Scoreboard */
.scoreboard{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,0.9);padding:8px 16px;z-index:100;border-bottom:1px solid #333;font-size:14px;flex-wrap:wrap}
.scoreboard .score-block{display:flex;align-items:center;gap:8px;font-weight:bold}
.scoreboard .divider{color:#555}
.scoreboard .game-info{font-size:12px;color:#aaa}
.scoreboard .down-info{color:#f5a623;font-weight:bold}
.scoreboard .timeout-dots{display:flex;gap:3px}
.scoreboard .timeout-dot{width:8px;height:8px;border-radius:50%;background:#555}
.scoreboard .timeout-dot.active{background:#f5a623}

/* Field */
.field-viewport{width:100%;max-width:min(100%, 55vh);height:calc(100vh - 120px);min-height:400px;max-height:700px;overflow:hidden;position:relative;border:2px solid #333;border-radius:4px;margin-top:52px;margin-left:auto;margin-right:auto}
.field-viewport.overlay-active{height:calc(100vh - 60px);max-height:900px}
.field-container{position:relative;will-change:transform;transition:transform 0.4s ease}
.field-container.instant-cam{transition:none}

/* End zones */
.endzone{position:absolute;width:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.15);overflow:hidden}
.endzone-opponent{background:#6a1a1a;background-image:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(0,0,0,0.1) 10px,rgba(0,0,0,0.1) 20px)}
.endzone-own{background:#1a2a5a;background-image:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(0,0,0,0.1) 10px,rgba(0,0,0,0.1) 20px)}

/* Turf */
.field-turf{position:absolute;width:100%}
.yard-band{position:absolute;width:100%}
.yard-band.even{background:#42B554}
.yard-band.odd{background:#4CC95C}

/* Yard lines */
.yard-line{position:absolute;width:100%;height:1px;background:rgba(255,255,255,0.08)}
.yard-line.five{height:1px;background:rgba(255,255,255,0.20)}
.yard-line.ten{height:2px;background:rgba(255,255,255,0.35)}
.yard-number{position:absolute;font-family:'Courier New',monospace;font-size:14px;font-weight:bold;color:rgba(255,255,255,0.18);pointer-events:none;user-select:none}

/* LOS and first down */
.line-of-scrimmage{position:absolute;width:100%;height:3px;background:rgba(0,180,255,0.7);z-index:5;pointer-events:none}
.first-down-marker{position:absolute;width:100%;height:2px;background:rgba(255,255,0,0.7);z-index:5;pointer-events:none;box-shadow:0 0 8px rgba(255,255,0,0.5),0 0 16px rgba(255,255,0,0.3)}

/* Player tokens - shared */
.token{position:absolute;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff;z-index:10;cursor:default;user-select:none;transition:left 0.4s ease,top 0.4s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))}
.token.instant{transition:none}
.token.moving-fast{transition:left 0.2s ease,top 0.2s ease}

/* Offense tokens */
.token-qb{width:30px;height:30px;background:#1e56a0;border-radius:4px;animation:qbGlow 2s ease-in-out infinite}
.token-qb .label{transform:rotate(-45deg)}
.token-rb{width:28px;height:22px;background:#1e56a0;border-radius:11px}
.token-wr{width:26px;height:26px;background:#1e56a0;border-radius:50%}
.token-te{width:28px;height:28px;background:#1e56a0;border-radius:6px}
.token-ol{width:22px;height:22px;background:#2a5a90}
.token-ol.integrity-good{background:#2a7a40}
.token-ol.integrity-warn{background:#8a6a20}
.token-ol.integrity-bad{background:#8a2020}

/* Defense tokens */
.token-dl{width:28px;height:28px;background:#7a1a1a;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.token-lb{width:28px;height:28px;background:#b82020;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.token-cb{width:26px;height:26px;background:#b82020;border-radius:50%}
.token-s{width:26px;height:26px;background:#b82020;border-radius:50%}

/* Ball carrier highlight */
.ball-carrier{border:3px solid #fbbf24;box-shadow:0 0 10px rgba(251,191,36,0.5)}

/* Ball */
.ball{position:absolute;width:14px;height:14px;background:#8B4513;border-radius:50%;z-index:15;pointer-events:none}
.ball::after{content:'';position:absolute;top:50%;left:3px;right:3px;height:2px;background:rgba(255,255,255,0.6);transform:translateY(-50%);border-radius:1px}
.ball.flying{z-index:20;transition:none}

/* HUD */
.hud{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);padding:10px;z-index:15}
.hud-compact{padding:6px 10px;font-size:13px;display:flex;align-items:center;justify-content:space-between}

/* Buttons */
.btn{padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;border:none;color:#fff;transition:background 0.2s,transform 0.1s}
.btn:hover{transform:scale(1.03)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#3b82f6}
.btn-primary:hover{background:#2563eb}
.btn-danger{background:#dc2626}
.btn-success{background:#16a34a}

/* Category buttons */
.category-btn{padding:14px 22px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:15px;border:2px solid transparent;color:#fff;transition:all 0.2s;flex:1;text-align:center}
.category-btn.run{background:rgba(249,115,22,0.2);border-color:#f97316;color:#f97316}
.category-btn.run:hover,.category-btn.run.active{background:#f97316;color:#fff}
.category-btn.pass{background:rgba(59,130,246,0.2);border-color:#3b82f6;color:#3b82f6}
.category-btn.pass:hover,.category-btn.pass.active{background:#3b82f6;color:#fff}
.category-btn.trick{background:rgba(168,85,247,0.2);border-color:#a855f7;color:#a855f7}
.category-btn.trick:hover,.category-btn.trick.active{background:#a855f7;color:#fff}
.category-row{display:flex;gap:8px;margin-bottom:10px}

/* Play cards */
.play-card{background:#1a1a2e;border-left:4px solid #555;padding:12px;margin:6px 0;border-radius:8px;cursor:pointer;transition:background 0.2s,border-color 0.2s}
.play-card:hover{background:#252540}
.play-card.type-run{border-left-color:#f97316}
.play-card.type-pass{border-left-color:#3b82f6}
.play-card.type-trick{border-left-color:#a855f7}
.play-card .play-name{font-weight:bold;font-size:14px;margin-bottom:2px}
.play-card .play-tooltip{font-size:11px;color:#aaa}
.play-card .matchup-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold;margin-left:8px}
.matchup-good{background:rgba(34,197,94,0.2);color:#22c55e}
.matchup-ok{background:rgba(234,179,8,0.2);color:#eab308}
.matchup-bad{background:rgba(239,68,68,0.2);color:#ef4444}

/* Decision panel */
.decision-panel{padding:12px}
.decision-panel .targets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.throw-target{background:#1a1a2e;border:2px solid #333;border-radius:8px;padding:10px;cursor:pointer;transition:all 0.2s;text-align:center}
.throw-target:hover{background:#252540;transform:scale(1.02)}
.throw-target.open-wide{border-color:#22c55e}
.throw-target.open-moderate{border-color:#eab308}
.throw-target.open-tight{border-color:#ef4444}
.throw-target.best-throw{box-shadow:0 0 12px rgba(59,130,246,0.5)}
.throw-target .tgt-name{font-weight:bold;font-size:13px}
.throw-target .tgt-detail{font-size:11px;color:#aaa;margin-top:2px}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap}

/* Pocket integrity bars */
.pocket-bar-container{display:flex;align-items:center;gap:6px;margin:4px 0}
.pocket-bar-bg{flex:1;height:12px;background:#333;border-radius:6px;overflow:hidden}
.pocket-bar-fill{height:12px;border-radius:6px;transition:width 0.3s ease;background:linear-gradient(90deg,#ef4444,#eab308,#22c55e)}
.pocket-label{font-size:11px;color:#aaa;min-width:50px}

/* Contact */
.contact-screen{border:3px solid red !important;animation:contactPulse 0.5s ease-in-out}

/* Result bar */
.result-bar{padding:12px;border-radius:8px;font-size:18px;font-weight:bold;text-align:center;margin:8px 0}
.result-bar.positive{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#22c55e}
.result-bar.negative{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444}
.result-bar.neutral{background:rgba(234,179,8,0.15);border:1px solid #eab308;color:#eab308}

/* Overlay screens */
.overlay-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;padding:20px}
.overlay-card{background:#111;border-radius:16px;padding:30px;max-width:500px;width:100%;text-align:center}
.td-text{font-size:48px;font-weight:900;color:gold;animation:tdBounce 0.6s ease,tdGlow 2s ease-in-out infinite}
.firework{position:absolute;width:6px;height:6px;border-radius:50%;animation:fw 1s ease-out forwards}

/* Commentary */
.commentary-panel{position:absolute;top:8px;left:8px;right:8px;z-index:25;background:rgba(10,10,30,0.95);border-top:3px solid #f5a623;border-radius:8px;padding:12px}
.commentary-panel .dan-line{font-style:normal;color:#e0e0e0;margin-bottom:6px}
.commentary-panel .kiki-line{color:#a0c4ff;font-size:13px}

/* Coach advice */
.coach-advice{border-left:4px solid #f5a623;padding:8px 12px;background:rgba(20,20,40,0.9);font-style:italic;margin:6px 0;border-radius:0 6px 6px 0;font-size:13px}
.coach-advice.joey{border-left-color:#ef4444}
.coach-advice.jim{border-left-color:#3b82f6}

/* Practice overlay */
.practice-overlay{background:rgba(0,0,20,0.92);border:2px solid #3b82f6;border-radius:12px;padding:20px;max-width:420px;width:90%;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:210}
.practice-overlay h3{color:#3b82f6;margin-bottom:8px}
.practice-overlay p{font-size:13px;color:#ccc;line-height:1.5}

/* Ghost routes */
.ghost-route{stroke-width:3;fill:none;opacity:0.8}
.ghost-route.decoy{opacity:0.5;stroke-dasharray:6 4}
svg.route-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8}
.route-arrow{fill:rgba(255,255,255,0.5)}

/* Defensive posture */
.posture-btn{padding:20px;border-radius:12px;cursor:pointer;font-weight:bold;font-size:16px;border:2px solid #555;background:#1a1a2e;color:#fff;transition:all 0.2s;text-align:center;flex:1}
.posture-btn:hover{background:#252540;transform:scale(1.02)}
.posture-btn.selected{border-color:#3b82f6;background:rgba(59,130,246,0.15)}
.posture-row{display:flex;gap:10px;margin:10px 0}

/* Two-player defense */
.two-player-defense{transform:rotate(180deg)}

/* Alert notification */
.alert-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);border:1px solid #f5a623;padding:10px 20px;border-radius:8px;font-size:14px;z-index:150;animation:alertFade 3s ease forwards;pointer-events:none}

/* Play selection grid */
.play-grid{max-height:200px;overflow-y:auto;padding-right:4px}
.audible-badge{background:rgba(168,85,247,0.3);color:#a855f7;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px}

/* Menu / mode select */
.menu-screen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 20px}
.menu-title{font-size:36px;font-weight:900;background:linear-gradient(135deg,#f5a623,#e8792b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.mode-card{background:#1a1a2e;border:2px solid #333;border-radius:12px;padding:20px;width:100%;max-width:400px;cursor:pointer;transition:all 0.2s;text-align:center}
.mode-card:hover{border-color:#3b82f6;background:#252540}
.mode-card h3{margin-bottom:4px}
.mode-card p{font-size:12px;color:#888}

/* Misc */
.fade-in{animation:alertFade 0.5s ease}
.text-gold{color:#f5a623}
.text-sm{font-size:12px}
.text-xs{font-size:10px}
.text-muted{color:#888}
.mt-2{margin-top:8px}
.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}
.flex{display:flex}
.flex-col{flex-direction:column}
.gap-2{gap:8px}
.gap-4{gap:16px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.w-full{width:100%}
.text-center{text-align:center}
.font-bold{font-weight:bold}

/* Overlay panel */
.overlay-panel{position:absolute;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(0deg,rgba(10,10,20,0.97) 0%,rgba(10,10,20,0.95) 55%,rgba(10,10,20,0.8) 78%,rgba(10,10,20,0.4) 92%,transparent 100%);padding:10px 8px 10px;max-height:50%;overflow-y:auto}
.overlay-panel .throw-target{padding:4px 6px}
.overlay-panel .tgt-name{font-size:11px}
.overlay-panel .tgt-detail{font-size:8px}
.overlay-panel button{padding:6px 3px;font-size:10px}
.overlay-panel .action-buttons button{font-size:9px;padding:5px 2px}
.overlay-panel > div{padding:6px 8px}
@media (max-width:600px){
.overlay-panel .throw-target{padding:3px 4px}
.overlay-panel .tgt-name{font-size:10px}
.overlay-panel .tgt-detail{font-size:7px}
.overlay-panel button{padding:5px 2px;font-size:9px}
}

/* Animations */
@keyframes ballFly{
  0%{transform:translate(var(--sx),var(--sy)) scale(1)}
  50%{transform:translate(var(--mx),var(--my)) scale(1.4)}
  100%{transform:translate(var(--ex),var(--ey)) scale(1)}
}
@keyframes pulse{
  0%,100%{opacity:0.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}
@keyframes fw{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}
@keyframes tdFlash{
  0%{background:rgba(255,215,0,0.4)}
  100%{background:rgba(0,0,0,0.85)}
}
@keyframes scoreCountPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{
  0%,100%{opacity:0.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}
@keyframes tickPop{
  0%,100%{opacity:0.2;transform:scale(0.6)}
  50%{opacity:1;transform:scale(1.2)}
}
.tick-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fbbf24;animation:tickPop 1.5s ease-in-out infinite}
.overlay-screen.td-flash{animation:tdFlash 0.35s ease-out forwards}
@keyframes tdBounce{
  0%{transform:scale(0)}
  50%{transform:scale(1.4)}
  100%{transform:scale(1)}
}
@keyframes tdGlow{
  0%,100%{text-shadow:0 0 20px gold}
  50%{text-shadow:0 0 40px gold,0 0 80px orange}
}
@keyframes contactPulse{
  0%,100%{box-shadow:0 0 10px rgba(255,0,0,0.3)}
  50%{box-shadow:0 0 25px rgba(255,0,0,0.7)}
}
@keyframes qbGlow{
  0%,100%{box-shadow:0 0 8px rgba(74,158,255,0.3)}
  50%{box-shadow:0 0 16px rgba(74,158,255,0.6)}
}
@keyframes alertFade{
  0%{opacity:0;transform:scale(0.8)}
  15%{opacity:1;transform:scale(1)}
  85%{opacity:1}
  100%{opacity:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ============================================================
// FORMATIONS
// ============================================================
const FI = {
  QB:{x:50,y:-3}, RB:{x:50,y:-7}, W1:{x:8,y:0}, W2:{x:92,y:0}, TE:{x:66,y:0},
  OL:[{x:38,y:0},{x:43,y:0},{x:50,y:0},{x:57,y:0},{x:62,y:0}]
};
const FSG = {
  QB:{x:50,y:-5}, RB:{x:42,y:-5}, W1:{x:6,y:0}, W2:{x:94,y:0}, TE:{x:68,y:0},
  OL:[{x:38,y:0},{x:43,y:0},{x:50,y:0},{x:57,y:0},{x:62,y:0}]
};
const FSP = {
  QB:{x:50,y:-5}, RB:{x:43,y:-5}, W1:{x:5,y:0}, W2:{x:95,y:0}, TE:{x:78,y:0},
  OL:[{x:38,y:0},{x:43,y:0},{x:50,y:0},{x:57,y:0},{x:62,y:0}]
};

// ============================================================
// ROUTE GENERATION
// ============================================================
function buildRoute(type, startX, startY) {
  const dir = startX < 50 ? 1 : -1;
  switch (type) {
    case 'go':
      return [{x:0,y:5},{x:0,y:12},{x:0,y:21},{x:0,y:30},{x:0,y:40},{x:0,y:50}];
    case 'slant':
      return [{x:dir*2,y:3},{x:dir*6,y:7},{x:dir*10,y:11},{x:dir*14,y:15},{x:dir*18,y:19},{x:dir*22,y:23}];
    case 'post':
      return [{x:0,y:4},{x:0,y:8},{x:0,y:12},{x:dir*5,y:18},{x:dir*10,y:26},{x:dir*14,y:34}];
    case 'out':
      return [{x:0,y:3},{x:0,y:7},{x:0,y:10},{x:-dir*5,y:11},{x:-dir*11,y:12},{x:-dir*16,y:13}];
    case 'curl':
      return [{x:0,y:3},{x:0,y:6},{x:0,y:9},{x:0,y:11},{x:0,y:10},{x:0,y:8}];
    case 'flat':
      return [{x:-dir*3,y:1},{x:-dir*7,y:2},{x:-dir*12,y:2},{x:-dir*16,y:3},{x:-dir*20,y:3},{x:-dir*24,y:4}];
    case 'seam':
      return [{x:dir*1,y:5},{x:dir*2,y:11},{x:dir*2,y:18},{x:dir*2,y:26},{x:dir*2,y:34},{x:dir*2,y:42}];
    case 'wheel':
      return [{x:-dir*4,y:0},{x:-dir*8,y:1},{x:-dir*10,y:5},{x:-dir*10,y:12},{x:-dir*10,y:20},{x:-dir*10,y:30}];
    case 'check':
      return [{x:-dir*2,y:1},{x:-dir*4,y:2},{x:-dir*5,y:3},{x:-dir*5,y:3},{x:-dir*5,y:3},{x:-dir*5,y:3}];
    case 'block':
      return [{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0}];
    case 'dive':
      return [{x:0,y:2},{x:0,y:4},{x:0,y:6},{x:0,y:8},{x:0,y:10},{x:0,y:12}];
    case 'sweep-left':
      return [{x:-4,y:1},{x:-9,y:2},{x:-14,y:4},{x:-18,y:6},{x:-20,y:9},{x:-22,y:13}];
    case 'sweep-right':
      return [{x:4,y:1},{x:9,y:2},{x:14,y:4},{x:18,y:6},{x:20,y:9},{x:22,y:13}];
    case 'counter-right':
      return [{x:-3,y:1},{x:-5,y:2},{x:2,y:4},{x:8,y:7},{x:13,y:10},{x:16,y:14}];
    case 'counter-left':
      return [{x:3,y:1},{x:5,y:2},{x:-2,y:4},{x:-8,y:7},{x:-13,y:10},{x:-16,y:14}];
    case 'toss-right':
      return [{x:6,y:0},{x:12,y:1},{x:18,y:3},{x:22,y:6},{x:24,y:10},{x:26,y:14}];
    case 'toss-left':
      return [{x:-6,y:0},{x:-12,y:1},{x:-18,y:3},{x:-22,y:6},{x:-24,y:10},{x:-26,y:14}];
    case 'screen':
      return [{x:0,y:0},{x:0,y:-1},{x:-dir*4,y:-1},{x:-dir*10,y:0},{x:-dir*15,y:2},{x:-dir*19,y:5}];
    case 'flee':
      return [{x:0,y:2},{x:0,y:4},{x:0,y:2},{x:0,y:0},{x:0,y:-1},{x:0,y:-2}];
    case 'statue':

// DEFENSE WEIGHTS (CPU defense selection)
// ============================================================
const DEFENSE_WEIGHTS = {
  base: {base43:30, nickel:22, blitz:15, cover2:22, goalline:0}
};

function getAdjustedDefenseWeights(yardLine, down, yardsToGo, scoreDiff) {
  const w = {...DEFENSE_WEIGHTS.base};
  // Goal line adjustments
  if (yardLine >= 95) {
    w.goalline += 40;
    w.base43 -= 10;
    w.cover2 -= 10;
  } else if (yardLine >= 85) {
    w.goalline += 15;
  }
  // Passing situations
  if (down >= 3 && yardsToGo >= 7) {
    w.nickel += 15;
    w.cover2 += 10;
    w.blitz += 10;
    w.base43 -= 10;
    w.goalline -= 5;
  }
  // Short yardage
  if (yardsToGo <= 2 && down >= 3) {
    w.goalline += 20;
    w.blitz += 10;
    w.nickel -= 10;
    w.cover2 -= 10;
  }
  // Trailing -- more blitz
  if (scoreDiff < -7) {
    w.blitz += 10;
    w.cover2 -= 5;
  }
  // Leading big -- more conservative
  if (scoreDiff > 10) {
    w.cover2 += 15;
    w.blitz -= 10;
  }
  // Clamp minimums
  for (const k of Object.keys(w)) {
    if (w[k] < 0) w[k] = 0;
  }
  return w;
}

// SOUND ENGINE

const SoundEngine = {
  ctx: null,
  muted: false,

  _ensureCtx: function() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Force unlock for strict browsers (Safari/iOS)
      var osc = this.ctx.createOscillator();
      var gain = this.ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(0);
      osc.stop(0.01);
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    return this.ctx;
  },

  setMuted(val) {
    this.muted = !!val;
  },

  tick() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.001), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 4000;
    src.connect(hp).connect(ctx.destination);
    src.start();
  },

  snap() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 150;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.05);
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.03), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
    const nSrc = ctx.createBufferSource();
    nSrc.buffer = buf;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.4, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    nSrc.connect(nGain).connect(ctx.destination);
    nSrc.start(now);
  },

  tackle() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 60;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.04), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const nSrc = ctx.createBufferSource();
    nSrc.buffer = buf;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.5, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    nSrc.connect(nGain).connect(ctx.destination);
    nSrc.start(now);
  },

  crowd() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const now = ctx.currentTime;
    const dur = 0.5;
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.4, now + dur * 0.35);
    gain.gain.linearRampToValueAtTime(0.001, now + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800;
    bp.Q.value = 0.5;
    src.connect(bp).connect(gain).connect(ctx.destination);
    src.start(now);
    src.stop(now + dur);
  },

  whistle() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2600, now);
    osc.frequency.linearRampToValueAtTime(2000, now + 0.4);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.setValueAtTime(0.25, now + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  },

  sackBuzz() {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.3);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  play(name) {
    if (typeof this[name] === 'function') {
      this[name]();
    }
  }
};

// PURE GAME LOGIC FUNCTIONS
// ============================================================

function getMatchupRating(playId, defenseId) {
  const row = MATCHUP_MATRIX[playId];
  if (!row || row[defenseId] === undefined) return 0;
  return row[defenseId];
}

function getMatchupLabel(rating) {
  switch (rating) {
    case -2: return 'BAD';
    case -1: return 'RISKY';
    case 0:  return 'OK';
    case 1:  return 'GOOD';
    case 2:  return 'GREAT';
    default: return 'OK';
  }
}

function selectDefense(ballPos, down, distance) {
  const weights = {
    base43: DEFENSE_WEIGHTS.base.base43,
    nickel: DEFENSE_WEIGHTS.base.nickel,
    blitz: DEFENSE_WEIGHTS.base.blitz,
    cover2: DEFENSE_WEIGHTS.base.cover2,
    goalline: DEFENSE_WEIGHTS.base.goalline
  };

  // Near goal line
  if (ballPos >= 95 && distance <= 3) {
    weights.goalline = 50;
  }
  // Red zone
  if (ballPos >= 90) {
    weights.goalline += 20;
  }
  // Short yardage
  if (distance <= 2) {
    weights.base43 += 10;
    weights.blitz += 8;
  }
  // Long yardage
  if (distance >= 8) {
    weights.nickel += 10;
    weights.cover2 += 10;
  }
  // 3rd and long
  if (down >= 3 && distance >= 5) {
    weights.nickel += 8;
    weights.cover2 += 8;
    weights.blitz += 5;
  }

  // Clamp negatives
  const keys = Object.keys(weights);
  for (const k of keys) {
    if (weights[k] < 0) weights[k] = 0;
  }

  // Weighted random selection
  const total = keys.reduce((sum, k) => sum + weights[k], 0);
  let roll = Math.random() * total;
  for (const k of keys) {
    roll -= weights[k];
    if (roll <= 0) return k;
  }
  return 'base43';
}

function rollHoldTimes(difficulty, defenseId) {
  const params = DIFFICULTY_PARAMS[difficulty];
  const minHold = params.holdTimeMin;
  const maxHold = params.holdTimeMax;
  const matchups = [];

  for (let i = 0; i < 5; i++) {
    let holdTime = minHold + Math.random() * (maxHold - minHold);
    holdTime = Math.round(holdTime * 10) / 10;
    matchups.push({ holdTime, integrity: 100, phasesExpired: 0 });
  }

  if (defenseId === 'blitz') {
    // All hold times reduced by 1 (min 1)
    for (let i = 0; i < matchups.length; i++) {
      matchups[i].holdTime = Math.max(1, matchups[i].holdTime - 1);
    }
    // Add 2 LB rushers
    matchups.push({ holdTime: 1 + Math.random() * 1, integrity: 100, phasesExpired: 0 });
    matchups.push({ holdTime: 1 + Math.random() * 1, integrity: 100, phasesExpired: 0 });
  }

  if (defenseId === 'goalline') {
    // Interior DT hold times (indices 1, 2) reduced by 1 (min 1)
    matchups[1].holdTime = Math.max(1, matchups[1].holdTime - 1);
    matchups[2].holdTime = Math.max(1, matchups[2].holdTime - 1);
  }

  return matchups;
}

function updateMatchupIntegrity(matchup, currentPhase) {
  if (currentPhase <= matchup.holdTime) {
    matchup.integrity = 100;
    matchup.phasesExpired = 0;
  } else {
    const expired = currentPhase - matchup.holdTime;
    matchup.phasesExpired = expired;
    const rawIntegrity = 100 - (30 * expired) - (10 * expired * expired / 2);
    matchup.integrity = Math.max(0, Math.min(100, rawIntegrity));
  }
  return matchup;
}

function getPocketPercent(matchups, currentPhase) {
  for (let i = 0; i < matchups.length; i++) {
    updateMatchupIntegrity(matchups[i], currentPhase);
  }

  // Use only the first 5 matchups for pocket calculation (OL-DL)
  const coreMatchups = matchups.slice(0, 5);

  const leftRaw = (coreMatchups[0].integrity + coreMatchups[1].integrity + coreMatchups[2].integrity * 0.5) / 2.5;
  const rightRaw = (coreMatchups[3].integrity + coreMatchups[4].integrity + coreMatchups[2].integrity * 0.5) / 2.5;

  let overallSum = 0;
  for (let i = 0; i < coreMatchups.length; i++) {
    overallSum += coreMatchups[i].integrity;
  }
  const overall = overallSum / coreMatchups.length;

  return {
    overall: Math.round(overall),
    left: Math.round(leftRaw),
    right: Math.round(rightRaw)
  };
}

function getPocketWarning(pocketPct, matchups) {
  const overall = pocketPct.overall;

  if (overall >= 60) {
    return { level: 'green', direction: null, text: null };
  }

  const weakSide = pocketPct.left < pocketPct.right ? 'left' : 'right';

  if (overall >= 30) {
    return { level: 'yellow', direction: null, text: 'PRESSURE BUILDING' };
  }

  if (overall >= 15) {
    return { level: 'red', direction: weakSide, text: 'POCKET COLLAPSING' };
  }

  // Below 15 - check if any matchup is at 0
  const anyZero = matchups.some(m => m.integrity === 0);
  if (anyZero) {
    return { level: 'critical', direction: weakSide, text: 'THROW OR TUCK!' };
  }

  return { level: 'red', direction: weakSide, text: 'POCKET COLLAPSING' };
}

function getScrambleLane(leftPct, rightPct) {
  if (leftPct < 40 && rightPct > 60) return 'right';
  if (rightPct < 40 && leftPct > 60) return 'left';
  return null;
}

function calculateReceiverOpenness(receiverPos, allDefenders, difficulty) {
  const xScale = 0.53; // 53.3 yards / 100 percent
  let minDist = Infinity;

  for (let i = 0; i < allDefenders.length; i++) {
    const def = allDefenders[i];
    const dx = (receiverPos.x - def.x) * xScale;
    const dy = receiverPos.y - def.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) minDist = dist;
  }

  var params = DIFFICULTY_PARAMS[difficulty];
  var bonus = (params && params.opennessBonus) ? params.opennessBonus : 0;
  minDist += bonus;

  var isEasy = difficulty === 'practice' || difficulty === 'preseason';
  var wideOpenDist = isEasy ? 4 : 5;
  var openDist = isEasy ? 2.5 : 3;
  var contestedDist = isEasy ? 1.0 : 1.5;

  let level, label, color;
  if (minDist >= wideOpenDist) {
    level = 3; label = 'Wide Open'; color = '#22c55e';
  } else if (minDist >= openDist) {
    level = 2; label = 'Open'; color = '#84cc16';
  } else if (minDist >= contestedDist) {
    level = 1; label = 'Contested'; color = '#fbbf24';
  } else {
    level = 0; label = 'Covered'; color = '#ef4444';
  }

  return { distance: minDist, level, label, color };
}

function calculateThrowResult(receiverKey, opennessLevel, pocketPercent, phase, difficulty) {
  const params = DIFFICULTY_PARAMS[difficulty];
  const pocketPressure = 100 - pocketPercent;
  const receiverSkill = PLAYER_ATTRS[receiverKey] ? PLAYER_ATTRS[receiverKey].skill : 5;

  // Base completion
  let pressurePenalty = pocketPressure / 250;
  pressurePenalty *= params.pressurePenaltyMult;

  let completionPct = 0.40 + (opennessLevel * 0.15) + (receiverSkill * 0.02) - pressurePenalty;

  // Cap at 0.95 before difficulty bonus
  completionPct = Math.min(0.95, completionPct);

  // Add difficulty bonus and cap
  completionPct += params.completionBonus / 100;
  completionPct = Math.min(params.completionCap / 100, completionPct);

  // INT chance
  let intChance;
  if (opennessLevel === 0) {
    intChance = 0.10 + phase * 0.02;
  } else if (opennessLevel === 1) {
    intChance = 0.04;
  } else {
    intChance = 0.01;
  }
  intChance *= params.intMultiplier;

  // Roll
  const roll = Math.random();
  if (roll < intChance) {
    return { result: 'interception', details: { completionPct, intChance } };
  }
  if (roll < intChance + (1 - completionPct)) {
    // Incomplete - check for drop
    if (opennessLevel >= 2 && Math.random() < 0.15) {
      return { result: 'drop', details: { completionPct, intChance } };
    }
    return { result: 'incomplete', details: { completionPct, intChance } };
  }
  return { result: 'complete', details: { completionPct, intChance } };
}

function resolveContact(moveType, carrierKey, tacklesBroken, difficulty) {
  const attrs = PLAYER_ATTRS[carrierKey] || { skill: 5, str: 5, spd: 6 };
  const params = DIFFICULTY_PARAMS[difficulty];

  // Dive forward always ends the play safely (tackle, not break)
  if (moveType === 'DiveForward') {
    return { result: 'tackle', yards: 1 + Math.floor(Math.random() * 3), fumble: false, breakChance: 0, fumbleChance: 0 };
  }

  // Calculate break chance base
  let breakBase;
  let fumbleBase;
  switch (moveType) {
    case 'Spin':
      breakBase = attrs.skill / 22 + 0.05;
      fumbleBase = 0.08;
      break;
    case 'Juke':
      breakBase = attrs.skill / 20 + 0.05;
      fumbleBase = 0.05;
      break;
    case 'StiffArm':
      breakBase = attrs.str / 20 + 0.05;
      fumbleBase = 0.06;
      break;
    default:
      breakBase = 0.20;
      fumbleBase = 0.05;
      break;
  }

  // QB penalty: QBs are worse runners than RBs/WRs
  if (carrierKey === 'QB') {
    breakBase = Math.max(0.10, breakBase - 0.15);
    fumbleBase = fumbleBase + 0.03;
  }

  // Degrade by tackles already broken (multiplicative)
  const degradeMultipliers = [1.0, 0.4, 0.05];
  const degradeIdx = Math.min(tacklesBroken, 2);
  const breakChance = Math.max(0.02, breakBase * degradeMultipliers[degradeIdx]);

  // Fumble chance
  const escalationIdx = Math.min(tacklesBroken, 3);
  const fumbleChance = fumbleBase * CONTACT_ESCALATION[escalationIdx] * params.fumbleMultiplier;

  // Roll
  const roll = Math.random();
  if (roll < fumbleChance) {
    return { result: 'fumble', yards: 0, fumble: true, breakChance: breakChance, fumbleChance: fumbleChance };
  }
  if (roll < fumbleChance + (1 - breakChance)) {
    // Tackled
    const tackleYards = Math.floor(Math.random() * 2); // 0 or 1
    return { result: 'tackle', yards: tackleYards, fumble: false, breakChance: breakChance, fumbleChance: fumbleChance };
  }
  // Break free
  const breakYards = 2 + Math.floor(Math.random() * 4); // 2-5
  return { result: 'break', yards: breakYards, fumble: false, breakChance: breakChance, fumbleChance: fumbleChance };
}

function resolveFieldGoal(ballPosition) {
  const kickDist = (100 - ballPosition) + 17;
  let rate = 0.15; // default for very long
  for (let i = 0; i < FG_SUCCESS_RATES.length; i++) {
    if (kickDist <= FG_SUCCESS_RATES[i].max) {
      rate = FG_SUCCESS_RATES[i].rate;
      break;
    }
  }
  const made = Math.random() < rate;
  return { made, distance: kickDist, rate };
}

function resolvePunt(ballPosition) {
  const travel = 35 + Math.floor(Math.random() * 16); // 35 + rand(0,15)
  const landing = ballPosition + travel;
  if (landing >= 100) {
    return { landingSpot: 80, touchback: true, distance: travel }; // CPU at their 20 = player coord 80
  }
  return { landingSpot: landing, touchback: false, distance: travel };
}

function resolveCPUDrive(cpuStartPos, posture, difficulty) {
  const params = DIFFICULTY_PARAMS[difficulty];
  const cpuYard = 100 - cpuStartPos; // Convert to CPU perspective

  // Look up scoring table
  let baseFG = 0, baseTD = 0;
  for (let i = 0; i < CPU_SCORING_TABLE.length; i++) {
    const entry = CPU_SCORING_TABLE[i];
    if (cpuYard >= entry.minYard && cpuYard < entry.maxYard) {
      baseFG = entry.fgChance;
      baseTD = entry.tdChance;
      break;
    }
  }

  const postureMod = POSTURE_MODS[posture];
  const tdChance = baseTD * postureMod.tdMult * params.cpuScoringMult;
  const fgChance = baseFG * postureMod.fgMult * params.cpuScoringMult;
  const turnoverChance = postureMod.turnoverChance;

  const roll = Math.random();

  if (roll < turnoverChance) {
    // Turnover
    let advance = 5 + Math.floor(Math.random() * 21);
    if (cpuYard + advance > 90) advance = 90 - cpuYard;
    if (advance < 0) advance = 0;
    const newCpuYard = cpuYard + advance;
    const playerBallPos = 100 - newCpuYard;
    var toPlays = [];
    toPlays.push('Run up the middle... ' + (2 + Math.floor(Math.random() * 4)) + ' yards');
    toPlays.push('Pass attempt... ' + (Math.random() > 0.5 ? 'tipped at the line!' : 'pressure forces a bad throw!'));
    toPlays.push('TURNOVER! Your defense forces a takeaway!');
    return {
      result: 'turnover',
      cpuScore: 0,
      playerBallPos: clampBallPosition(playerBallPos),
      driveText: 'TURNOVER! Your defense forces a takeaway!',
      plays: toPlays
    };
  }

  if (roll < turnoverChance + tdChance) {
    var tdPlays = [];
    tdPlays.push('Run up the middle... ' + (4 + Math.floor(Math.random() * 5)) + ' yards');
    tdPlays.push('Pass complete over the middle... ' + (8 + Math.floor(Math.random() * 10)) + ' yards');
    tdPlays.push('Quick slant... first down');
    tdPlays.push('Play action... receiver wide open downfield!');
    tdPlays.push('TOUCHDOWN.');
    return {
      result: 'touchdown',
      cpuScore: 7,
      playerBallPos: 25,
      driveText: 'The opponent marches down the field and scores a TOUCHDOWN.',
      plays: tdPlays
    };
  }

  if (roll < turnoverChance + tdChance + fgChance) {
    var fgPlays = [];
    fgPlays.push('Short pass... ' + (3 + Math.floor(Math.random() * 5)) + ' yards');
    fgPlays.push('Run to the outside... ' + (4 + Math.floor(Math.random() * 6)) + ' yards');
    fgPlays.push('Pass complete... moving the chains');
    fgPlays.push('Field goal is GOOD.');
    return {
      result: 'fieldGoal',
      cpuScore: 3,
      playerBallPos: 25,
      driveText: 'The opponent drives into field goal range and kicks it through. 3 points.',
      plays: fgPlays
    };
  }

  // 3-and-out
  var taoPlays = [];
  taoPlays.push('Run stuffed... ' + Math.floor(Math.random() * 2) + ' yards');
  taoPlays.push('Pass incomplete...');
  taoPlays.push('Short gain... not enough. Punt.');
  return {
    result: 'threeAndOut',
    cpuScore: 0,
    playerBallPos: 25,
    driveText: 'Your defense holds! The opponent goes three-and-out.',
    plays: taoPlays
  };
}

function checkGrounding(quarterbackXY, receiverPositions, difficulty) {
  const params = DIFFICULTY_PARAMS[difficulty];
  const xScale = 0.53;

  // Inside tackle box: qb.x between 38-62
  const inBox = quarterbackXY.x >= 38 && quarterbackXY.x <= 62;

  // No receiver within 5 yards
  let receiverNearby = false;
  for (let i = 0; i < receiverPositions.length; i++) {
    const rp = receiverPositions[i];
    const dx = (quarterbackXY.x - rp.x) * xScale;
    const dy = quarterbackXY.y - rp.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 5) {
      receiverNearby = true;
      break;
    }
  }

  if (inBox && !receiverNearby) {
    const called = Math.random() < params.groundingRisk;
    return { called, yardLoss: Math.abs(quarterbackXY.y) };
  }

  return { called: false, yardLoss: 0 };
}

function getYACTier(nearestDefDist) {
  if (nearestDefDist < 3) return 'immediate';
  if (nearestDefDist <= 6) return 'oneMove';
  return 'openField';
}

function calculateRunSuccess(moveType, carrierPos, defenders, runMoveCount, difficulty) {
  const params = difficulty ? DIFFICULTY_PARAMS[difficulty] : null;
  // Difficulty run bonus: practice +20%, preseason +12%, regular +0%, playoffs -5%
  const runBonus = params ? ({practice: 0.20, preseason: 0.12, regular: 0, playoffs: -0.05}[difficulty] || 0) : 0;
  let successRate;

  if (moveType === 'DiveForward') {
    const diveRate = Math.min(0.98, 0.82 + runBonus);
    return { success: Math.random() < diveRate, rate: diveRate };
  }

  if (moveType === 'Sprint' || moveType === 'HitTheHole') {
    // Check defenders ahead within 5 yards
    const xScale = 0.53;
    let closestAhead = Infinity;
    for (let i = 0; i < defenders.length; i++) {
      const def = defenders[i];
      if (def.y > carrierPos.y) {
        const dx = (carrierPos.x - def.x) * xScale;
        const dy = def.y - carrierPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < closestAhead) closestAhead = dist;
      }
    }
    if (closestAhead > 5 || closestAhead === Infinity) {
      successRate = 0.85;
    } else if (closestAhead >= 3) {
      successRate = 0.65;
    } else {
      successRate = 0.35;
    }
  } else if (moveType === 'CutOutside') {
    // Check sideline path
    const xScale = 0.53;
    let pathBlocked = false;
    for (let i = 0; i < defenders.length; i++) {
      const def = defenders[i];
      const dx = Math.abs(carrierPos.x - def.x) * xScale;
      const dy = Math.abs(carrierPos.y - def.y);
      if (dx < 3 && dy < 4) {
        pathBlocked = true;
        break;
      }
    }
    successRate = pathBlocked ? 0.30 : 0.75;
  } else if (moveType === 'Juke') {
    // Count nearby defenders
    const xScale = 0.53;
    let nearbyCount = 0;
    for (let i = 0; i < defenders.length; i++) {
      const def = defenders[i];
      const dx = (carrierPos.x - def.x) * xScale;
      const dy = carrierPos.y - def.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 5) nearbyCount++;
    }
    successRate = nearbyCount >= 2 ? 0.30 : 0.60;
  } else {
    successRate = 0.50;
  }

  // Apply difficulty bonus
  successRate = Math.min(0.98, Math.max(0.10, successRate + runBonus));

  // Pursuit escalation: after move 2, defender speed += 15% per move
  if (runMoveCount > 2) {
    const penalty = (runMoveCount - 2) * 0.15;
    successRate = Math.max(0.10, successRate - penalty);
  }

  return { success: Math.random() < successRate, rate: successRate };
}

function getRunnerMoveLabels(carrierRole) {
  if (carrierRole === 'RB') {
    return [
      { label: 'Sprint', type: 'Sprint', description: 'Burst forward with speed' },
      { label: 'Hit the Hole', type: 'HitTheHole', description: 'Drive through the gap' },
      { label: 'Juke', type: 'Juke', description: 'Quick cut to evade' },
      { label: 'Dive Forward', type: 'DiveForward', description: 'Fall forward for safe yards' }
    ];
  }
  if (carrierRole === 'QB') {
    return [
      { label: 'Sprint Upfield', type: 'Sprint', description: 'Run straight ahead' },
      { label: 'Cut Outside', type: 'CutOutside', description: 'Break to the sideline' },
      { label: 'Slide', type: 'DiveForward', description: 'Slide to end the play safely' },
      { label: 'Truck It', type: 'StiffArm', description: 'Lower the shoulder' }
    ];
  }
  // WR or TE
  return [
    { label: 'Sprint', type: 'Sprint', description: 'Burst forward with speed' },
    { label: 'Cut Outside', type: 'CutOutside', description: 'Break to the sideline' },
    { label: 'Juke', type: 'Juke', description: 'Quick cut to evade' },
    { label: 'Dive Forward', type: 'DiveForward', description: 'Fall forward for safe yards' }
  ];
}

function formatFieldPosition(ballPos) {
  if (ballPos === 50) return '50';
  if (ballPos <= 50) return 'OWN ' + ballPos;
  return 'OPP ' + (100 - ballPos);
}

function formatDown(down, distance, ballPos) {
  const ordinals = ['', '1st', '2nd', '3rd', '4th'];
  const ord = ordinals[down] || down + 'th';
  const isGoal = (ballPos !== undefined) ? (ballPos + distance >= 100) : false;
  const distLabel = isGoal ? 'Goal' : distance;
  return ord + ' & ' + distLabel;
}

function advanceDefenders(defenders, carrierPos, difficulty, runMoveCount, carrierGain) {
  var params = DIFFICULTY_PARAMS[difficulty];
  var distBase = (carrierGain !== undefined && carrierGain > 0) ? carrierGain : 3.5;
  distBase = Math.max(2.5, distBase);
  var baseSpeed = params.pursuitSpeed * distBase;
  var speed = baseSpeed;
  if (runMoveCount > 2) {
    speed = baseSpeed * (1 + 0.15 * (runMoveCount - 2));
  }

  var carrierPastLOS = carrierPos.y > 0;
  var xScale = 0.53;
  var newDefenders = [];
  for (var i = 0; i < defenders.length; i++) {
    var def = Object.assign({}, defenders[i]);
    // LOS gate: only DL advances before carrier crosses LOS
    var isDL = def.origY !== undefined ? def.origY <= 2 : def.y <= 4;
    if (!isDL && !carrierPastLOS) {
      newDefenders.push(def);
      continue;
    }
    var dx = (carrierPos.x - def.x) * xScale;
    var dy = carrierPos.y - def.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0.1) {
      var moveX = (dx / dist) * speed / xScale;
      var moveY = (dy / dist) * speed;
      def.x += moveX;
      def.y += moveY;
    }
    newDefenders.push(def);
  }
  return newDefenders;
}

function findNearestDefender(carrierPos, defenders) {
  const xScale = 0.53;
  let nearest = null;
  let minDist = Infinity;

  for (let i = 0; i < defenders.length; i++) {
    const def = defenders[i];
    const dx = (carrierPos.x - def.x) * xScale;
    const dy = carrierPos.y - def.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) {
      minDist = dist;
      nearest = { id: def.id, distance: dist, position: { x: def.x, y: def.y } };
    }
  }
  return nearest;
}

function generateRunArrows(carrierPos, defenders) {
  const xScale = 0.53;
  const arrows = [];
  const angles = [];

  // Forward cone: -45 to +45 degrees from straight ahead (0 = upfield)
  for (let deg = -45; deg <= 45; deg += 4) {
    angles.push(deg);
  }

  for (let a = 0; a < angles.length; a++) {
    const angleDeg = angles[a];
    const angleRad = (angleDeg * Math.PI) / 180;
    // Straight ahead is positive y; dx from sin, dy from cos
    const dirX = Math.sin(angleRad);
    const dirY = Math.cos(angleRad);

    // Target point clamped within 15 units
    const targetDist = 15;
    const targetX = carrierPos.x + dirX * targetDist / xScale; // convert back to percent
    const targetY = carrierPos.y + dirY * targetDist;

    // Score this direction
    let score = 100;

    // Lateral penalty: straight ahead gets 60% higher score
    const lateralFactor = 1.0 + 0.6 * Math.cos(angleRad);
    score *= lateralFactor;

    // Penalty for defenders within range
    for (let d = 0; d < defenders.length; d++) {
      const def = defenders[d];
      // Check proximity of defender to the path
      const toDx = (def.x - carrierPos.x) * xScale;
      const toDy = def.y - carrierPos.y;
      const defDist = Math.sqrt(toDx * toDx + toDy * toDy);

      if (defDist < 3) {
        // Massive penalty for defenders within 3 yards
        score -= 80;
      } else if (defDist < 8) {
        // Moderate penalty for defenders in the path
        const dot = toDx * dirX + toDy * dirY;
        if (dot > 0) {
          score -= (30 / defDist);
        }
      }
    }

    let quality;
    if (score >= 100) quality = 'good';
    else if (score >= 50) quality = 'ok';
    else quality = 'bad';

    // Clamp target position
    const clampedX = Math.max(1, Math.min(99, targetX));
    const clampedY = targetY;

    arrows.push({
      angle: angleDeg,
      quality,
      dx: clampedX - carrierPos.x,
      dy: clampedY - carrierPos.y
    });
  }

  return arrows;
}

function clampBallPosition(pos) {
  return Math.max(1, Math.min(100, pos));
}

function pickCommentary(category, context) {
  const cat = COMMENTARY[category];
  if (!cat) return { dan: '', kiki: '' };
  const danLines = cat.dan || [];
  const kikiLines = cat.kiki || [];
  const kikiTeachLines = cat.kikiTeach || [];
  let danLine = danLines[Math.floor(Math.random() * danLines.length)] || '';
  let kikiLine = kikiLines[Math.floor(Math.random() * kikiLines.length)] || '';
  // Replace placeholders
  const replacements = context || {};
  for (const key of Object.keys(replacements)) {
    const token = '{' + key + '}';
    danLine = danLine.split(token).join(String(replacements[key]));
    kikiLine = kikiLine.split(token).join(String(replacements[key]));
  }
  return { dan: danLine, kiki: kikiLine };
}

function pickCoachAdvice(coach, situation) {
  if (!coach) return '';
  const lines = COACH_LINES[coach] && COACH_LINES[coach][situation];
  if (!lines || lines.length === 0) return '';
  return lines[Math.floor(Math.random() * lines.length)];
}

// ============================================================
// REDUCER
// ============================================================
function gameReducer(state, action) {
  var newState = gameReducerCore(state, action);
  // Auto-dismiss teaching hints on any game-advancing action
  var advancingActions = ['SELECT_CATEGORY', 'SELECT_PLAY', 'SNAP', 'QB_ACTION', 'THROW', 'RUNNER_MOVE', 'CONTACT_MOVE', 'NEXT_PLAY', 'POSTURE_PICK', 'RPO_CHOICE', 'FOURTH_DOWN_OPTION'];
  if (advancingActions.indexOf(action.type) !== -1 && state.difficulty === 'practice') {
    var hintMap = { MENU: 'welcome', PLAY_SELECT: 'playSelect', PRESNAP: 'presnap', DECISION: 'pocket', RUNNER: 'runAfterCatch', CONTACT: 'runAfterCatch', DEFENSIVE_POSTURE: 'defense' };
    var hintId = hintMap[state.phase];
    if (hintId && !state.overlaysSeen[hintId]) {
      var newSeen = Object.assign({}, newState.overlaysSeen || {});
      newSeen[hintId] = true;
      newState = Object.assign({}, newState, { overlaysSeen: newSeen });
    }
  }
  // Auto-dismiss commentary on game-advancing actions
  if (advancingActions.indexOf(action.type) !== -1 && newState.showCommentary) {
    newState = Object.assign({}, newState, { showCommentary: false });
  }
  if (newState !== state && newState.phase !== state.phase) {
    return Object.assign({}, newState, { cameraMode: 'strategic' });
  }
  return newState;
}

function gameReducerCore(state, action) {
  switch (action.type) {

    // ----------------------------------------------------------
    // START_GAME
    // ----------------------------------------------------------
    case 'START_GAME': {
      const diff = action.twoPlayerMode ? 'regular' : (action.difficulty || 'regular');
      let coinTossWinner = null;
      if (action.twoPlayerMode) {
        coinTossWinner = Math.random() < 0.5 ? 1 : 2;
      }
      return {
        ...INITIAL_STATE,
        difficulty: diff,
        coach: action.coach || null,
        twoPlayerMode: !!action.twoPlayerMode,
        phase: action.twoPlayerMode ? 'COIN_TOSS' : 'MENU',
        coinTossWinner,
        muted: state.muted,
      };
    }

    // ----------------------------------------------------------
    // COIN_TOSS
    // ----------------------------------------------------------
    case 'COIN_TOSS': {
      const flipResult = Math.random() < 0.5 ? 'heads' : 'tails';
      const won = (action.choice === flipResult);
      const winner = won ? 1 : 2;
      return {
        ...state,
        coinTossWinner: winner,
        phase: 'COIN_TOSS_CHOICE',
      };
    }

    // ----------------------------------------------------------
    // COIN_TOSS_CHOICE
    // ----------------------------------------------------------
    case 'COIN_TOSS_CHOICE': {
      const wantsReceive = action.choice === 'receive';
      let firstOffense;
      if (state.coinTossWinner === 1) {
        firstOffense = wantsReceive ? 1 : 2;
      } else {
        firstOffense = wantsReceive ? 2 : 1;
      }
      return {
        ...state,
        activeOffense: firstOffense,
        receiverFirst: firstOffense,
        phase: 'MENU',
        ballPos: 25,
        down: 1,
        dist: 10,
      };
    }

    // ----------------------------------------------------------
    // SELECT_CATEGORY
    // ----------------------------------------------------------
    case 'SELECT_CATEGORY': {
      if (action.category === null) {
        return {
          ...state,
          selectedCategory: null,
          expandedPlayId: null,
          phase: 'MENU',
        };
      }
      return {
        ...state,
        selectedCategory: action.category,
        expandedPlayId: null,
        phase: 'PLAY_SELECT',
      };
    }

    // ----------------------------------------------------------
    // EXPAND_PLAY
    // ----------------------------------------------------------
    case 'EXPAND_PLAY': {
      return {
        ...state,
        expandedPlayId: state.expandedPlayId === action.playId ? null : action.playId,
      };
    }

    // ----------------------------------------------------------
    // SELECT_PLAY
    // ----------------------------------------------------------
    case 'SELECT_PLAY': {
      const play = PLAYS.find(p => p.id === action.playId);
      if (!play) return state;

      // Preserve defense when audibling — the whole point is reacting to what you saw
      const defense = state.chosenDefense || selectDefense(state.ballPos, state.down, state.dist);
      const defObj = DEFENSES.find(d => d.id === defense);

      // Build receiver waypoints from play routes
      const waypoints = {};
      const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
      const formation = play.formation;

      for (const rk of receiverKeys) {
        const route = play.routes[rk];
        const startPos = formation[rk];
        if (startPos && route) {
          const routeWP = buildRoute(route, startPos.x, startPos.y);
          const absoluteWP = routeWP.map(function(wp) {
            return {
              x: Math.max(2, Math.min(98, startPos.x + wp.x)),
              y: Math.min(110, startPos.y + wp.y)
            };
          });
          waypoints[rk] = absoluteWP;
        }
      }

      // Initial receiver positions at formation spots
      const recPos = {};
      for (const rk of receiverKeys) {
        if (formation[rk]) {
          recPos[rk] = { x: formation[rk].x, y: formation[rk].y };
        }
      }

      // Defense positions (relative to LOS: y values are already relative)
      const defPos = defObj ? defObj.players.map(function(p) { return Object.assign({}, p, { origY: p.y }); }) : [];

      // Assign DBs to receivers using greedy proximity
      var assignableReceivers = [];
      for (var ark = 0; ark < receiverKeys.length; ark++) {
        if (recPos[receiverKeys[ark]]) {
          assignableReceivers.push(receiverKeys[ark]);
        }
      }

      var takenReceivers = {};
      var dbXScaleAssign = 0.53;

      // Collect all DBs
      var dbPlayers = [];
      for (var di = 0; di < defPos.length; di++) {
        if (defPos[di].role === 'CB' || defPos[di].role === 'S') {
          dbPlayers.push(defPos[di]);
        }
      }

      // Greedy proximity: for each DB, find closest unassigned receiver
      for (var ai = 0; ai < dbPlayers.length; ai++) {
        var bestKey = null;
        var bestDist = Infinity;
        for (var ri = 0; ri < assignableReceivers.length; ri++) {
          var rk = assignableReceivers[ri];
          if (takenReceivers[rk]) continue;
          var rPos = recPos[rk];
          var ddx = (rPos.x - dbPlayers[ai].x) * dbXScaleAssign;
          var ddy = rPos.y - dbPlayers[ai].y;
          var dd = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dd < bestDist) {
            bestDist = dd;
            bestKey = rk;
          }
        }
        if (bestKey) {
          dbPlayers[ai].assignedReceiver = bestKey;
          takenReceivers[bestKey] = true;
        } else {
          dbPlayers[ai].assignedReceiver = null;
        }
      }

      // Matchup feedback and coach advice
      const matchupRating = getMatchupRating(play.id, defense);
      const matchupLabel = getMatchupLabel(matchupRating);
      const params = DIFFICULTY_PARAMS[state.difficulty];

      let advice = '';
      if (state.coach) {
        advice = pickCoachAdvice(state.coach, 'presnap');
      }

      // Override with primary receiver guidance if play has a designed target
      if (state.coach && play.primary && play.type === 'pass') {
        var primaryName = play.primary;
        if (state.coach === 'joey') {
          advice = 'This play is designed for ' + primaryName + '. Drop Back and throw to ' + primaryName + ' when they get open!';
        } else {
          advice = 'This play targets ' + primaryName + '. Drop Back to let the route develop, then look for ' + primaryName + '.';
        }
      }

      // Determine if matchup feedback should be shown
      let showMatchup = false;
      if (params.showMatchupFeedback === 'all') showMatchup = true;
      else if (params.showMatchupFeedback === 'bad' && matchupRating <= -1) showMatchup = true;

      return {
        ...state,
        selectedPlayId: action.playId,
        chosenDefense: defense,
        receiverWaypoints: waypoints,
        currentReceiverPos: recPos,
        currentDefenderPos: defPos,
        coachAdvice: advice,
        phase: 'PRESNAP',
        expandedPlayId: null,
        fieldAlert: showMatchup ? (matchupLabel + ' matchup vs ' + (defObj ? defObj.name : defense)) : null,
        scrambledOut: false,
        showCommentary: false,
        danComment: '',
        kikiComment: '',
      };
    }

    // ----------------------------------------------------------
    // AUDIBLE
    // ----------------------------------------------------------
    case 'AUDIBLE': {
      const params = DIFFICULTY_PARAMS[state.difficulty];
      if (state.audiblesThisQuarter >= params.audibleLimit) {
        return { ...state, fieldAlert: 'No audibles remaining this quarter!' };
      }
      return {
        ...state,
        audiblesThisQuarter: state.audiblesThisQuarter + 1,
        phase: 'PLAY_SELECT',
        selectedPlayId: null,
        selectedCategory: state.selectedCategory,
        expandedPlayId: null,
        fieldAlert: 'Audible! Pick a new play.',
      };
    }

    // ----------------------------------------------------------
    // SNAP
    // ----------------------------------------------------------
    case 'SNAP': {
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      if (!play) return state;

      const holdData = rollHoldTimes(state.difficulty, state.chosenDefense);

      return {
        ...state,
        phase: 'SNAPPING',
        holdTimeData: holdData,
        currentPhase: 0,
        tuckWarnings: 0,
        lookDir: null,
        ballInFlight: false,
        ballFlightTarget: null,
        fieldAlert: null,
        sprintCount: 0,
      };
    }

    // ----------------------------------------------------------
    // SNAP_COMPLETE
    // ----------------------------------------------------------
    case 'SNAP_COMPLETE': {
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      if (!play) return state;

      const params = DIFFICULTY_PARAMS[state.difficulty];
      const formation = play.formation;

      // Pass plays
      if (play.type === 'pass' || (play.type === 'pass' && play.primary)) {
        return {
          ...state,
          phase: 'DECISION',
          quarterbackXY: { x: formation.QB.x, y: formation.QB.y },
          currentPhase: 0,
          carrier: null,
          carrierRole: null,
        };
      }

      // Trick plays
      if (play.type === 'trick') {
        // Flea Flicker: pitch to RB then back to QB
        if (play.name === 'Flea Flicker') {
          const pitchFumbleChance = play.pitchFumble * (params.trickFumbleMult || 1);
          if (Math.random() < pitchFumbleChance) {
            // Fumble on the pitch
            const fumbleYard = state.ballPos;
            const cpuRecoveryPos = fumbleYard >= 100 ? 80 : Math.min(Math.max(1, fumbleYard), 99);
            const comm = pickCommentary('fumble', { play: play.name, def: state.chosenDefense });
            return {
              ...state,
              phase: 'RESULT',
              lastResult: { type: 'fumble', yards: 0, turnover: true },
              resultText: 'FUMBLE on the pitch! Turnover!',
              resultColor: '#ef4444',
              showCommentary: true,
              danComment: comm.dan,
              kikiComment: comm.kiki,
              cpuBallPos: cpuRecoveryPos,
            };
          }
          // Successful pitch-back, now it's a pass play
          return {
            ...state,
            phase: 'DECISION',
            quarterbackXY: { x: formation.QB.x, y: formation.QB.y - 2 },
            currentPhase: 0,
            carrier: null,
            carrierRole: null,
          };
        }

        // Statue of Liberty: RB runs
        if (play.name === 'Statue of Liberty') {
          return {
            ...state,
            phase: 'RUNNER',
            carrier: 'RB',
            carrierRole: 'RB',
            carrierXY: { x: formation.RB.x, y: formation.RB.y },
            runMoves: 0,
            yacMoves: 0,
            isYAC: false,
            tacklesBroken: 0,
          };
        }

        // QB Draw: QB runs
        if (play.name === 'QB Draw') {
          return {
            ...state,
            phase: 'RUNNER',
            carrier: 'QB',
            carrierRole: 'QB',
            carrierXY: { x: formation.QB.x, y: formation.QB.y },
            runMoves: 0,
            yacMoves: 0,
            isYAC: false,
            tacklesBroken: 0,
          };
        }
      }

      // Run plays
      if (play.type === 'run') {
        // HB Toss: no RPO, direct run with fumble risk
        if (play.name === 'HB Toss') {
          const pitchFumbleChance = play.pitchFumble * (params.trickFumbleMult || 1);
          if (Math.random() < pitchFumbleChance) {
            const fumbleYard = state.ballPos;
            const cpuRecoveryPos = fumbleYard >= 100 ? 80 : Math.min(Math.max(1, fumbleYard), 99);
            const comm = pickCommentary('fumble', { play: play.name, def: state.chosenDefense });
            return {
              ...state,
              phase: 'RESULT',
              lastResult: { type: 'fumble', yards: 0, turnover: true },
              resultText: 'FUMBLE on the toss! Turnover!',
              resultColor: '#ef4444',
              showCommentary: true,
              danComment: comm.dan,
              kikiComment: comm.kiki,
              cpuBallPos: cpuRecoveryPos,
            };
          }
          return {
            ...state,
            phase: 'RUNNER',
            carrier: 'RB',
            carrierRole: 'RB',
            carrierXY: { x: formation.RB.x, y: formation.RB.y },
            runMoves: 0,
            yacMoves: 0,
            isYAC: false,
            tacklesBroken: 0,
          };
        }

        // QB Sneak: direct QB run, no RPO
        if (play.name === 'QB Sneak') {
          return {
            ...state,
            phase: 'RUNNER',
            carrier: 'QB',
            carrierRole: 'QB',
            carrierXY: { x: formation.QB.x, y: formation.QB.y },
            runMoves: 0,
            yacMoves: 0,
            isYAC: false,
            tacklesBroken: 0,
          };
        }

        // RPO-eligible runs
        if (play.hasRPO) {
          // Calculate gap status for RPO read
          const defObj = DEFENSES.find(d => d.id === state.chosenDefense);
          const boxCount = defObj ? defObj.players.filter(p =>
            p.y <= 8 && p.x >= 25 && p.x <= 75
          ).length : 5;

          return {
            ...state,
            phase: 'RPO_READ',
            fieldAlert: boxCount >= 8 ? 'Heavy box! Consider pulling the ball.' :
                        boxCount <= 4 ? 'Light box. Run should have room.' :
                        'Standard look. Trust your read.',
          };
        }

        // Non-RPO run (fallback)
        return {
          ...state,
          phase: 'RUNNER',
          carrier: 'RB',
          carrierRole: 'RB',
          carrierXY: { x: formation.RB.x, y: formation.RB.y },
          runMoves: 0,
          yacMoves: 0,
          isYAC: false,
          tacklesBroken: 0,
        };
      }

      // Fallback: treat as pass play
      return {
        ...state,
        phase: 'DECISION',
        quarterbackXY: { x: formation.QB.x, y: formation.QB.y },
        currentPhase: 0,
      };
    }

    // ----------------------------------------------------------
    // QB_ACTION
    // ----------------------------------------------------------
    case 'QB_ACTION': {
      const move = action.move;
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      if (!play) return state;

      const params = DIFFICULTY_PARAMS[state.difficulty];
      let newQBXY = { ...state.quarterbackXY };
      let newLookDir = state.lookDir;
      let newPhase = state.currentPhase;
      let newRecPos = { ...state.currentReceiverPos };
      let newDefPos = state.currentDefenderPos.map(d => ({ ...d }));
      let newTuckWarnings = state.tuckWarnings;

      if (move === 'scramble') {
        return {
          ...state,
          phase: 'RUNNER',
          carrier: 'QB',
          carrierRole: 'QB',
          carrierXY: { ...state.quarterbackXY },
          runMoves: 0,
          yacMoves: 0,
          isYAC: false,
          tacklesBroken: 0,
          scrambledOut: true,
        };
      }

      if (move === 'throwAway') {
        // Check intentional grounding
        const receiverPositions = Object.values(state.currentReceiverPos);
        const grounding = checkGrounding(state.quarterbackXY, receiverPositions, state.difficulty);
        if (grounding.called) {
          const yardLoss = Math.max(1, grounding.yardLoss);
          // Check for safety on grounding
          const groundingAbsY = state.ballPos - yardLoss;
          if (groundingAbsY <= 0) {
            return {
              ...state,
              phase: 'RESULT',
              lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
              resultText: 'SAFETY! Intentional grounding in the end zone! 2 points for the defense!',
              resultColor: '#ef4444',
              cpuBallPos: 70,
            };
          }
          const comm = pickCommentary('throwAway', { play: play.name, def: state.chosenDefense });
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'grounding', yards: -yardLoss, turnover: false },
            resultText: 'Intentional Grounding! Loss of ' + yardLoss + ' yards.',
            resultColor: '#ef4444',
            showCommentary: true,
            danComment: comm.dan,
            kikiComment: comm.kiki,
          };
        }
        const comm = pickCommentary('throwAway', { play: play.name, def: state.chosenDefense });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'incomplete', yards: 0, turnover: false },
          resultText: 'Thrown away. Incomplete.',
          resultColor: '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      if (move === 'tuck') {
        const yardLoss = 1 + Math.floor(Math.random() * 2); // 1-2
        // Check for safety on tuck
        const tuckAbsY = state.ballPos - yardLoss;
        if (tuckAbsY <= 0) {
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
            resultText: 'SAFETY! QB tucked in the end zone! 2 points for the defense!',
            resultColor: '#ef4444',
            cpuBallPos: 70,
          };
        }
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'tuck', yards: -yardLoss, turnover: false },
          resultText: 'QB tucks it! Loss of ' + yardLoss + ' yards, but the ball is safe.',
          resultColor: '#eab308',
        };
      }

      // Movement actions
      switch (move) {
        case 'dropBack':
          newQBXY.y -= 2;
          break;
        case 'rollLeft':
          newQBXY.x -= 8;
          break;
        case 'rollRight':
          newQBXY.x += 8;
          break;
        case 'stepUp':
          newQBXY.y += 2;
          // Step Up restores pocket integrity by 10-15%
          var stepUpRestore = 10 + Math.floor(Math.random() * 6);
          for (var sui = 0; sui < state.holdTimeData.length; sui++) {
            var m = state.holdTimeData[sui];
            m.integrity = Math.min(100, (m.integrity || 0) + stepUpRestore);
            if (m.phasesExpired > 0) m.phasesExpired = Math.max(0, m.phasesExpired - 1);
          }
          break;
        case 'wait':
          // QB holds position. Routes develop, pocket degrades slightly less.
          break;
        case 'lookLeft':
          newLookDir = 'left';
          // Shift defenders: left side DBs -1 yard closer, right side +1.5 further
          for (let i = 0; i < newDefPos.length; i++) {
            const d = newDefPos[i];
            if (d.role === 'CB' || d.role === 'S') {
              if (d.x < 50) {
                d.y -= 1; // Left side DBs come closer
              } else {
                d.y += 1.5; // Right side DBs drift back
              }
            }
          }
          break;
        case 'lookRight':
          newLookDir = 'right';
          for (let i = 0; i < newDefPos.length; i++) {
            const d = newDefPos[i];
            if (d.role === 'CB' || d.role === 'S') {
              if (d.x >= 50) {
                d.y -= 1;
              } else {
                d.y += 1.5;
              }
            }
          }
          break;
      }

      // Clamp QB position
      newQBXY.x = Math.max(5, Math.min(95, newQBXY.x));
      newQBXY.y = Math.max(-15, Math.min(5, newQBXY.y));

      // Increment current phase
      newPhase = state.currentPhase + 1;

      // Advance receiver positions to next waypoint
      // Waypoints are ALREADY absolute (formation offset added in SELECT_PLAY)
      const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
      for (const rk of receiverKeys) {
        if (state.receiverWaypoints[rk] && state.receiverWaypoints[rk][newPhase - 1]) {
          const wp = state.receiverWaypoints[rk][newPhase - 1];
          if (play.formation[rk]) {
            newRecPos[rk] = {
              x: wp.x,
              y: wp.y
            };
          }
        } else if (state.receiverWaypoints[rk]) {
          // Clamp to last waypoint
          const wps = state.receiverWaypoints[rk];
          const lastWP = wps[wps.length - 1];
          if (play.formation[rk] && lastWP) {
            newRecPos[rk] = {
              x: lastWP.x,
              y: lastWP.y
            };
          }
        }
      }

      // Save previous receiver positions for route break detection
      var savedPrevRecPos = {};
      var prevRec = state.prevReceiverPos || {};
      var recKeys = ['W1', 'W2', 'TE', 'RB'];
      for (var ri = 0; ri < recKeys.length; ri++) {
        if (newRecPos[recKeys[ri]]) {
          savedPrevRecPos[recKeys[ri]] = { x: newRecPos[recKeys[ri]].x, y: newRecPos[recKeys[ri]].y };
        }
      }

      // Update DB positions: assignment-based coverage
      var closeRate = (params.defenderCloseRate !== undefined) ? params.defenderCloseRate : 1.0;
      var dbTracking = params.dbTracking * closeRate;
      var dbXScale = 0.53;

      // Find deepest receiver Y for safety depth reference
      var deepestRecY = 0;
      var recKeyList = ['W1', 'W2', 'TE', 'RB'];
      for (var dri = 0; dri < recKeyList.length; dri++) {
        if (newRecPos[recKeyList[dri]] && newRecPos[recKeyList[dri]].y > deepestRecY) {
          deepestRecY = newRecPos[recKeyList[dri]].y;
        }
      }

      for (var i = 0; i < newDefPos.length; i++) {
        var d = newDefPos[i];
        if (d.role === 'CB' || d.role === 'S') {
          if (d.assignedReceiver && newRecPos[d.assignedReceiver]) {
            // Man coverage: track assigned receiver
            var target = newRecPos[d.assignedReceiver];
            var dx = (target.x - d.x) * dbXScale;
            var dy = target.y - d.y;
            var dist = Math.sqrt(dx * dx + dy * dy);

            // Route break penalty: detect sharp receiver cuts
            var trackSpeed = dbTracking;
            var prevPos = prevRec[d.assignedReceiver];
            if (prevPos && target) {
              var recDx = target.x - prevPos.x;
              var recDy = target.y - prevPos.y;
              var recMoveDist = Math.sqrt(recDx * recDx + recDy * recDy);
              if (recMoveDist >= 2 && Math.abs(recDx) > 0.6 * Math.abs(recDy)) {
                trackSpeed = dbTracking * 0.5;
              }
            }

            // CBs track more aggressively -- multiplier of 7 instead of 5
            var trackMult = (d.role === 'CB') ? 7 : 5;
            if (dist > 0.5) {
              d.x += (dx / dist) * trackSpeed * trackMult / dbXScale;
              d.y += (dy / dist) * trackSpeed * trackMult;
            }

            // CB cushion: if CB is behind receiver (lower y), close gap faster
            if (d.role === 'CB' && d.y < target.y - 2) {
              d.y += 0.8; // Extra forward push to stay with receiver
            }
          } else {
            // ZONE SAFETY: maintain depth relative to deepest receiver
            // Safety stays 3-6 yards BEHIND the deepest receiver, not creeping forward
            var safetyDepthBehind = 5;
            var targetSafetyY = deepestRecY + safetyDepthBehind;
            // Never shallower than 12 yards from LOS
            targetSafetyY = Math.max(12, targetSafetyY);

            // Drift toward target depth
            var safetyDy = targetSafetyY - d.y;
            if (Math.abs(safetyDy) > 1) {
              d.y += (safetyDy > 0 ? 1 : -1) * 0.8;
            }

            // Lateral drift: split the field, don't cluster
            // Left safety covers left half, right safety covers right half
            var fieldCenter = 50;
            var targetX = d.x < fieldCenter ? 30 : 70;
            var safetyDx = targetX - d.x;
            if (Math.abs(safetyDx) > 3) {
              d.x += (safetyDx > 0 ? 1 : -1) * 0.5;
            }
          }
        }
      }

      // Check pocket status for auto-sack
      const updatedHoldData = state.holdTimeData.map(m => {
        const copy = { ...m };
        updateMatchupIntegrity(copy, newPhase);
        return copy;
      });

      // DL press toward QB — one step per action
      for (var i = 0; i < newDefPos.length; i++) {
        var d = newDefPos[i];
        if (d.role === 'DL') {
          var qb = newQBXY;
          var dlDx = (qb.x - d.x) * dbXScale;
          var dlDy = qb.y - d.y;
          var dlDist = Math.sqrt(dlDx * dlDx + dlDy * dlDy);
          if (dlDist > 0.5) {
            var avgInt = 1.0;
            if (updatedHoldData && updatedHoldData.length > 0) {
              var intSum = 0;
              for (var hi = 0; hi < updatedHoldData.length; hi++) {
                intSum += (updatedHoldData[hi].integrity !== undefined ? updatedHoldData[hi].integrity : 1.0);
              }
              avgInt = intSum / updatedHoldData.length;
            }
            var dlSpeed = 0.8 + (1.0 - (avgInt / 100)) * 3.0;
            d.x += (dlDx / dlDist) * dlSpeed / dbXScale;
            d.y += (dlDy / dlDist) * dlSpeed;
          }
        }
      }

      // LB zone coverage: track nearest receiver in their zone, not just drift toward QB
      for (var i = 0; i < newDefPos.length; i++) {
        var d = newDefPos[i];
        if (d.role === 'LB') {
          // Find nearest receiver to this LB
          var nearestRecDist = Infinity;
          var nearestRecPos = null;
          for (var lri = 0; lri < recKeyList.length; lri++) {
            var lrk = recKeyList[lri];
            if (newRecPos[lrk]) {
              var lrdx = (newRecPos[lrk].x - d.x) * dbXScale;
              var lrdy = newRecPos[lrk].y - d.y;
              var lrd = Math.sqrt(lrdx * lrdx + lrdy * lrdy);
              if (lrd < nearestRecDist) {
                nearestRecDist = lrd;
                nearestRecPos = newRecPos[lrk];
              }
            }
          }

          if (nearestRecPos && nearestRecDist < 15) {
            // Track nearest receiver in zone -- slower than DBs
            var lbDx = (nearestRecPos.x - d.x) * dbXScale;
            var lbDy = nearestRecPos.y - d.y;
            var lbDist = Math.sqrt(lbDx * lbDx + lbDy * lbDy);
            if (lbDist > 1) {
              d.x += (lbDx / lbDist) * 1.2 / dbXScale;
              d.y += (lbDy / lbDist) * 1.2;
            }
          } else {
            // No receiver nearby: drift toward QB slowly
            var lbQbDy = newQBXY.y - d.y;
            if (lbQbDy < 0 && Math.abs(lbQbDy) > 1) {
              d.y -= 0.4;
            }
          }
        }
      }

      const pocketPct = getPocketPercent(updatedHoldData, newPhase);
      const pocketWarn = getPocketWarning(pocketPct, updatedHoldData);

      if (pocketWarn.level === 'critical' || pocketWarn.level === 'red') {
        newTuckWarnings++;
      }

      // Auto-sack check
      if (newTuckWarnings >= params.autoSackWarnings) {
        const sackLoss = Math.max(1, Math.abs(newQBXY.y));
        // Check for safety on auto-sack
        const autoSackAbsY = state.ballPos - sackLoss;
        if (autoSackAbsY <= 0) {
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
            resultText: 'SAFETY! Sacked in the end zone! 2 points for the defense!',
            resultColor: '#ef4444',
            cpuBallPos: 70,
            holdTimeData: updatedHoldData,
            currentPhase: newPhase,
          };
        }
        const comm = pickCommentary('sack', { play: play.name, def: state.chosenDefense });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'sack', yards: -sackLoss, turnover: false },
          resultText: 'SACKED! Loss of ' + sackLoss + ' yards!',
          resultColor: '#ef4444',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          coachAdvice: state.coach ? pickCoachAdvice(state.coach, 'pocket') : '',
          holdTimeData: updatedHoldData,
          currentPhase: newPhase,
        };
      }

      // Check for pressure sack (any matchup at 0 for long enough)
      let zeroCount = 0;
      for (const m of updatedHoldData) {
        if (m.integrity <= 0 && m.phasesExpired >= 2) zeroCount++;
      }
      if (zeroCount >= 2) {
        const sackLoss = Math.max(1, Math.abs(newQBXY.y));
        // Check for safety on pressure sack
        const pressureSackAbsY = state.ballPos - sackLoss;
        if (pressureSackAbsY <= 0) {
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
            resultText: 'SAFETY! Pocket collapsed in the end zone! 2 points for the defense!',
            resultColor: '#ef4444',
            cpuBallPos: 70,
            holdTimeData: updatedHoldData,
            currentPhase: newPhase,
          };
        }
        const comm = pickCommentary('sack', { play: play.name, def: state.chosenDefense });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'sack', yards: -sackLoss, turnover: false },
          resultText: 'SACKED! The pocket collapsed! Loss of ' + sackLoss + ' yards!',
          resultColor: '#ef4444',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          holdTimeData: updatedHoldData,
          currentPhase: newPhase,
        };
      }

      return {
        ...state,
        quarterbackXY: newQBXY,
        lookDir: newLookDir,
        currentPhase: newPhase,
        currentReceiverPos: newRecPos,
        currentDefenderPos: newDefPos,
        prevReceiverPos: savedPrevRecPos,
        holdTimeData: updatedHoldData,
        tuckWarnings: newTuckWarnings,
        fieldAlert: pocketWarn.text || null,
      };
    }

    // ----------------------------------------------------------
    // THROW
    // ----------------------------------------------------------
    case 'THROW': {
      const targetKey = action.targetKey;
      const recPos = state.currentReceiverPos[targetKey];
      if (!recPos) return state;

      const openness = calculateReceiverOpenness(recPos, state.currentDefenderPos, state.difficulty);
      const updatedHoldData = state.holdTimeData.map(m => {
        const copy = { ...m };
        updateMatchupIntegrity(copy, state.currentPhase);
        return copy;
      });
      const pocketPct = getPocketPercent(updatedHoldData, state.currentPhase);
