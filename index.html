      const throwResult = calculateThrowResult(targetKey, openness.level, pocketPct.overall, state.currentPhase, state.difficulty);

      return {
        ...state,
        ballInFlight: true,
        ballFlightTarget: { x: recPos.x, y: recPos.y, key: targetKey },
        lastResult: {
          ...throwResult,
          targetKey,
          openness,
          receiverPos: { ...recPos },
        },
        fieldAlert: null,
      };
    }

    // ----------------------------------------------------------
    // THROW_RESOLVE
    // ----------------------------------------------------------
    case 'THROW_RESOLVE': {
      const throwData = state.lastResult;
      if (!throwData) return state;

      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      const playName = play ? play.name : 'Unknown';
      const defName = state.chosenDefense || 'base43';
      const targetKey = throwData.targetKey;
      const recPos = throwData.receiverPos || state.currentReceiverPos[targetKey];
      const relativeYards = recPos ? Math.round(recPos.y) : 0;

      const commentContext = {
        target: targetKey,
        play: playName,
        def: defName,
        yards: Math.max(0, relativeYards),
      };

      if (throwData.result === 'complete') {
        // Determine YAC tier
        const nearestDef = findNearestDefender(
          recPos || { x: 50, y: 5 },
          state.currentDefenderPos
        );
        const nearDist = nearestDef ? nearestDef.distance : 10;
        const yacTier = getYACTier(nearDist);

        if (yacTier === 'immediate') {
          // Immediate contact after catch
          return {
            ...state,
            ballInFlight: false,
            phase: 'CONTACT',
            carrier: targetKey,
            carrierRole: targetKey === 'RB' ? 'RB' : (targetKey === 'TE' ? 'TE' : 'WR'),
            carrierXY: recPos ? { ...recPos } : { x: 50, y: 5 },
            contactDefenderId: nearestDef ? nearestDef.id : null,
            tacklesBroken: 0,
            fieldAlert: 'CONTACT!',
          };
        }

        // One move or open field: RUNNER with YAC
        const maxMoves = yacTier === 'openField' ? 5 : 3;
        const commCat = relativeYards >= 15 ? 'bigPass' : 'shortPass';
        const comm = pickCommentary(commCat, commentContext);

        return {
          ...state,
          ballInFlight: false,
          phase: 'RUNNER',
          carrier: targetKey,
          carrierRole: targetKey === 'RB' ? 'RB' : (targetKey === 'TE' ? 'TE' : 'WR'),
          carrierXY: recPos ? { ...recPos } : { x: 50, y: 5 },
          isYAC: true,
          yacMoves: 0,
          maxYacMoves: maxMoves,
          runMoves: 0,
          tacklesBroken: 0,
          showCommentary: false,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      if (throwData.result === 'drop') {
        const comm = pickCommentary('drop', commentContext);
        return {
          ...state,
          ballInFlight: false,
          phase: 'RESULT',
          lastResult: { type: 'drop', yards: 0, turnover: false },
          resultText: 'DROPPED! ' + targetKey + ' couldn\'t hold on!',
          resultColor: '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      if (throwData.result === 'incomplete') {
        const openLabel = throwData.openness ? throwData.openness.label : 'contested';
        const isContested = throwData.openness && throwData.openness.level <= 1;
        const commCat = isContested ? 'contestedInc' : 'coveredInc';
        const comm = pickCommentary(commCat, commentContext);
        return {
          ...state,
          ballInFlight: false,
          phase: 'RESULT',
          lastResult: { type: 'incomplete', yards: 0, turnover: false },
          resultText: 'Incomplete! ' + targetKey + ' was ' + openLabel + '.',
          resultColor: '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      if (throwData.result === 'interception') {
        const comm = pickCommentary('interception', commentContext);
        const absYard = recPos ? state.ballPos + recPos.y : state.ballPos;
        const cpuRecovery = absYard >= 100 ? 80 : Math.min(Math.max(1, absYard), 99);
        return {
          ...state,
          ballInFlight: false,
          phase: 'RESULT',
          lastResult: { type: 'interception', yards: 0, turnover: true },
          resultText: 'INTERCEPTED! Turnover!',
          resultColor: '#ef4444',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          cpuBallPos: cpuRecovery,
        };
      }

      // Fallback
      return {
        ...state,
        ballInFlight: false,
        phase: 'RESULT',
        lastResult: { type: 'incomplete', yards: 0, turnover: false },
        resultText: 'Incomplete.',
        resultColor: '#eab308',
      };
    }

    // ----------------------------------------------------------
    // RPO_CHOICE
    // ----------------------------------------------------------
    case 'RPO_CHOICE': {
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      if (!play) return state;
      const formation = play.formation;
      const params = DIFFICULTY_PARAMS[state.difficulty];

      if (action.choice === 'handoff') {
        return {
          ...state,
          phase: 'RUNNER',
          carrier: 'RB',
          carrierRole: 'RB',
          carrierXY: { x: formation.RB.x, y: formation.RB.y },
          runMoves: 0,
          yacMoves: 0,
          isYAC: false,
          tacklesBroken: 0,
          fieldAlert: null,
        };
      }

      if (action.choice === 'qbKeep') {
        return {
          ...state,
          phase: 'RUNNER',
          carrier: 'QB',
          carrierRole: 'QB',
          carrierXY: { x: formation.QB.x, y: formation.QB.y },
          runMoves: 0,
          yacMoves: 0,
          isYAC: false,
          tacklesBroken: 0,
          fieldAlert: null,
        };
      }

      if (action.choice === 'quickPass') {
        // Single roll: 75% base completion, 2% INT, modified by difficulty
        let completionBase = 0.75 + (params.completionBonus / 100);
        completionBase = Math.min(params.completionCap / 100, completionBase);
        const intChance = 0.02 * params.intMultiplier;

        const roll = Math.random();
        if (roll < intChance) {
          const comm = pickCommentary('interception', { target: 'TE', play: play.name, def: state.chosenDefense, yards: 0 });
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'interception', yards: 0, turnover: true },
            resultText: 'RPO quick pass INTERCEPTED!',
            resultColor: '#ef4444',
            showCommentary: true,
            danComment: comm.dan,
            kikiComment: comm.kiki,
            cpuBallPos: Math.min(state.ballPos + 3, 99),
            fieldAlert: null,
          };
        }
        if (roll < intChance + (1 - completionBase)) {
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'incomplete', yards: 0, turnover: false },
            resultText: 'RPO quick pass incomplete!',
            resultColor: '#eab308',
            fieldAlert: null,
          };
        }
        // Complete: auto-resolve for 3-6 yards (quick, safe play)
        var quickGain = 3 + Math.floor(Math.random() * 4); // 3-6 yards
        var comm = pickCommentary('passCompShort', {
          target: 'TE', play: play.name,
          def: state.chosenDefense, yards: quickGain
        });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'complete', yards: quickGain, turnover: false },
          resultText: 'RPO quick pass to TE for ' + quickGain + ' yards!',
          resultColor: '#22c55e',
          showCommentary: true,
          danComment: comm ? comm.dan : null,
          kikiComment: comm ? comm.kiki : null,
          fieldAlert: null,
        };
      }

      return state;
    }

    // ----------------------------------------------------------
    // RUNNER_MOVE
    // ----------------------------------------------------------
    case 'RUNNER_MOVE': {
      const moveType = action.moveType;
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      const params = DIFFICULTY_PARAMS[state.difficulty];

      // Map display labels to generic types
      let genericType = moveType;
      if (moveType === 'Slide') genericType = 'DiveForward';
      if (moveType === 'Truck It') genericType = 'StiffArm';
      if (moveType === 'Hit the Hole' || moveType === 'HitTheHole') genericType = 'HitTheHole';
      if (moveType === 'Cut Outside' || moveType === 'CutOutside') genericType = 'CutOutside';

      const defenders = state.currentDefenderPos;
      const carrierPos = state.carrierXY;

      const runResult = calculateRunSuccess(genericType, carrierPos, defenders, state.runMoves, state.difficulty);

      let newCarrierXY = { ...carrierPos };
      let newRunMoves = state.runMoves + 1;
      let newYacMoves = state.isYAC ? state.yacMoves + 1 : 0;
      let newSprintCount = state.sprintCount + (genericType === 'Sprint' ? 1 : 0);

      // Enforce YAC limit
      if (state.isYAC && newYacMoves > state.maxYacMoves) {
        var totalYards = Math.round(state.carrierXY.y);
        var playName = play ? play.name : 'play';
        var defName = state.chosenDefense || 'base43';
        var commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
        var comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });

        // Check if a defender is actually close enough to make the stop
        var nearDef = findNearestDefender(state.carrierXY, state.currentDefenderPos);
        var tackledByDefender = nearDef && nearDef.distance < 4.0;
        var yacResultText;
        if (tackledByDefender) {
          yacResultText = 'Brought down after the catch! ' + (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : 'No gain.');
        } else {
          yacResultText = (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : 'No gain.') + ' Ran out of steam.';
        }

        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'run', yards: totalYards, turnover: false },
          resultText: yacResultText,
          resultColor: totalYards >= 5 ? '#22c55e' : (totalYards > 0 ? '#eab308' : '#ef4444'),
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      if (runResult.success) {
        // Move carrier based on move type
        switch (genericType) {
          case 'Sprint':
            newCarrierXY.y += 3 + Math.floor(Math.random() * 3); // 3-5
            break;
          case 'HitTheHole':
            newCarrierXY.y += 2 + Math.floor(Math.random() * 3); // 2-4
            break;
          case 'CutOutside': {
            const lateralDir = carrierPos.x < 50 ? -1 : 1;
            newCarrierXY.x += lateralDir * (2 + Math.floor(Math.random() * 2)); // 2-3 lateral
            newCarrierXY.y += 1 + Math.floor(Math.random() * 2); // 1-2 forward
            break;
          }
          case 'Juke': {
            const jukeDir = Math.random() < 0.5 ? -1 : 1;
            newCarrierXY.x += jukeDir * (1 + Math.floor(Math.random() * 2)); // 1-2 lateral
            newCarrierXY.y += 1 + Math.floor(Math.random() * 2); // 1-2 forward
            break;
          }
          case 'DiveForward':
            newCarrierXY.y += 1 + Math.floor(Math.random() * 3); // 1-3
            break;
          case 'StiffArm':
            newCarrierXY.y += 1 + Math.floor(Math.random() * 3); // 1-3
            break;
          default:
            newCarrierXY.y += 2;
            break;
        }
      } else {
        // Failed move: advance 0-1 yards
        newCarrierXY.y += Math.floor(Math.random() * 2); // 0 or 1
      }

      // Clamp carrier X
      newCarrierXY.x = Math.max(1, Math.min(99, newCarrierXY.x));

      // Check touchdown (before OOB — pylon dive should score)
      const absoluteY = state.ballPos + newCarrierXY.y;
      if (absoluteY >= 100) {
        const totalYards = 100 - state.ballPos;
        const playName = play ? play.name : 'play';
        const defName = state.chosenDefense || 'base43';
        const comm = pickCommentary('touchdown', { play: playName, def: defName, yards: totalYards });
        return {
          ...state,
          phase: 'TOUCHDOWN',
          carrierXY: newCarrierXY,
          lastResult: { type: 'touchdown', yards: totalYards, turnover: false },
          resultText: 'TOUCHDOWN!',
          resultColor: 'gold',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      // Check out of bounds
      if (newCarrierXY.x <= 1 || newCarrierXY.x >= 99) {
        const totalYards = Math.round(newCarrierXY.y);
        const playName = play ? play.name : 'run';
        const defName = state.chosenDefense || 'base43';
        const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
        const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          lastResult: { type: 'run', yards: totalYards, turnover: false },
          resultText: 'Out of bounds! Gain of ' + totalYards + ' yards.',
          resultColor: totalYards >= 5 ? '#22c55e' : '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
        };
      }

      // Check safety (carrier pushed back into own endzone)
      if (absoluteY <= 0) {
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
          resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
          resultColor: '#ef4444',
          cpuBallPos: 70,
          runMoves: newRunMoves,
        };
      }

      // Advance defenders toward carrier
      var carrierGain = newCarrierXY.y - carrierPos.y;
      const newDefenders = advanceDefenders(defenders, newCarrierXY, state.difficulty, newRunMoves, carrierGain);

      // Dive forward ALWAYS ends the play — no proximity check
      if (genericType === 'DiveForward') {
        const totalYards = Math.round(newCarrierXY.y);
        const playName = play ? play.name : 'play';
        const defName = state.chosenDefense || 'base43';
        const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
        const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          lastResult: { type: 'run', yards: totalYards, turnover: false },
          resultText: (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : 'No gain.') + ' Safe stop.',
          resultColor: totalYards >= 5 ? '#22c55e' : (totalYards > 0 ? '#eab308' : '#ef4444'),
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
        };
      }

      // Check for contact trigger (nearest defender within 2.0 yards)
      const nearestDef = findNearestDefender(newCarrierXY, newDefenders);
      if (nearestDef && nearestDef.distance < 2.0) {
        // Trigger contact
        return {
          ...state,
          phase: 'CONTACT',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          contactDefenderId: nearestDef ? nearestDef.id : null,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
          sprintCount: newSprintCount,
          fieldAlert: 'CONTACT!',
        };
      }

      return {
        ...state,
        carrierXY: newCarrierXY,
        currentDefenderPos: newDefenders,
        runMoves: newRunMoves,
        yacMoves: newYacMoves,
        sprintCount: newSprintCount,
        fieldAlert: null,
        autoTackleTimer: 0,
      };
    }

    // ----------------------------------------------------------
    // CONTACT_MOVE
    // ----------------------------------------------------------
    case 'CONTACT_MOVE': {
      const moveType = action.moveType;
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      const params = DIFFICULTY_PARAMS[state.difficulty];

      // Scramble fumble risk: 40-50% fumble chance on any contact
      if (state.scrambledOut) {
        var scrambleFumbleChance = 0.40 + Math.random() * 0.10;
        if (Math.random() < scrambleFumbleChance) {
          var totalYardsScr = Math.round(state.carrierXY.y);
          var commScr = pickCommentary('fumble', { yards: totalYardsScr, play: play ? play.name : 'play', def: state.chosenDefense || 'base43' });
          return {
            ...state,
            phase: 'RESULT',
            lastResult: { type: 'fumble', yards: totalYardsScr, turnover: true },
            resultText: 'FUMBLE! QB scrambled and lost the ball! Turnover!',
            resultColor: '#ef4444',
            showCommentary: true,
            danComment: commScr.dan,
            kikiComment: commScr.kiki,
            scrambledOut: false,
          };
        }
      }

      // Force tackle after 2 contacts — no more chain
      if (state.tacklesBroken >= 2) {
        var totalYards2 = Math.round(state.carrierXY.y);
        var playName2 = play ? play.name : 'play';
        var defName2 = state.chosenDefense || 'base43';
        var commCat2 = totalYards2 >= 10 ? 'bigRun' : (totalYards2 > 0 ? 'shortRun' : 'runStuffed');
        var comm2 = pickCommentary(commCat2, { yards: totalYards2, play: playName2, def: defName2 });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'tackle', yards: totalYards2, turnover: false },
          resultText: 'Brought down! ' + (totalYards2 > 0 ? 'Gain of ' + totalYards2 + ' yards.' : 'No gain.'),
          resultColor: totalYards2 >= 5 ? '#22c55e' : (totalYards2 > 0 ? '#eab308' : '#ef4444'),
          showCommentary: true,
          danComment: comm2.dan,
          kikiComment: comm2.kiki,
        };
      }

      // Map display labels to internal types
      let internalType = moveType;
      if (moveType === 'spin') internalType = 'Spin';
      if (moveType === 'juke') internalType = 'Juke';
      if (moveType === 'stiffArm') internalType = 'StiffArm';
      if (moveType === 'diveForward') internalType = 'DiveForward';

      const carrierKey = state.carrier || 'RB';
      const contactResult = resolveContact(internalType, carrierKey, state.tacklesBroken, state.difficulty);

      if (contactResult.result === 'break') {
        // Push nearest defender away
        let newDefenders = state.currentDefenderPos.map(d => ({ ...d }));
        if (state.contactDefenderId) {
          for (let i = 0; i < newDefenders.length; i++) {
            if (newDefenders[i].id === state.contactDefenderId) {
              newDefenders[i].y -= 3;
              newDefenders[i].x += (Math.random() < 0.5 ? -5 : 5);
              break;
            }
          }
        }

        const newCarrierXY = { ...state.carrierXY };
        newCarrierXY.y += contactResult.yards;

        // Check touchdown after break
        const absoluteY = state.ballPos + newCarrierXY.y;
        if (absoluteY >= 100) {
          const totalYards = 100 - state.ballPos;
          const playName = play ? play.name : 'play';
          const defName = state.chosenDefense || 'base43';
          const comm = pickCommentary('touchdown', { play: playName, def: defName, yards: totalYards });
          return {
            ...state,
            phase: 'TOUCHDOWN',
            carrierXY: newCarrierXY,
            currentDefenderPos: newDefenders,
            lastResult: { type: 'touchdown', yards: totalYards, turnover: false },
            resultText: 'TOUCHDOWN!',
            resultColor: 'gold',
            showCommentary: true,
            danComment: comm.dan,
            kikiComment: comm.kiki,
            tacklesBroken: state.tacklesBroken + 1,
          };
        }

        // Check safety after break
        if (absoluteY <= 0) {
          return {
            ...state,
            phase: 'RESULT',
            carrierXY: newCarrierXY,
            currentDefenderPos: newDefenders,
            lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
            resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
            resultColor: '#ef4444',
            cpuBallPos: 70,
            tacklesBroken: state.tacklesBroken + 1,
          };
        }

        return {
          ...state,
          phase: 'RUNNER',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          tacklesBroken: state.tacklesBroken + 1,
          fieldAlert: 'Broken tackle!',
        };
      }

      if (contactResult.result === 'fumble') {
        const totalYards = Math.round(state.carrierXY.y);
        const fumbleSpot = state.ballPos + totalYards;
        const cpuRecoveryPos = fumbleSpot >= 100 ? 80 : Math.min(Math.max(1, fumbleSpot), 99);
        const playName = play ? play.name : 'play';
        const comm = pickCommentary('fumble', { play: playName, def: state.chosenDefense });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'fumble', yards: totalYards, turnover: true },
          resultText: 'FUMBLE! Ball lost at the ' + formatFieldPosition(clampBallPosition(fumbleSpot)) + '!',
          resultColor: '#ef4444',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          cpuBallPos: cpuRecoveryPos,
        };
      }

      // Tackled
      const totalYards = Math.round(state.carrierXY.y) + contactResult.yards;
      const playName = play ? play.name : 'play';
      const defName = state.chosenDefense || 'base43';

      // Check safety on tackle
      const tackleAbsoluteY = state.ballPos + totalYards;
      if (tackleAbsoluteY <= 0) {
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
          resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
          resultColor: '#ef4444',
          cpuBallPos: 70,
        };
      }

      // Dive forward special case: guaranteed yards, safe
      if (internalType === 'DiveForward') {
        const diveYards = totalYards;
        const commCat = diveYards >= 10 ? 'bigRun' : (diveYards > 0 ? 'shortRun' : 'runStuffed');
        const comm = pickCommentary(commCat, { yards: diveYards, play: playName, def: defName });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'run', yards: diveYards, turnover: false },
          resultText: 'Dives forward! ' + (diveYards > 0 ? 'Gain of ' + diveYards + ' yards.' : 'No gain.'),
          resultColor: diveYards >= 5 ? '#22c55e' : (diveYards > 0 ? '#eab308' : '#ef4444'),
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
      const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
      return {
        ...state,
        phase: 'RESULT',
        lastResult: { type: 'tackle', yards: totalYards, turnover: false },
        resultText: 'Tackled! ' + (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : (totalYards < 0 ? 'Loss of ' + Math.abs(totalYards) + ' yards.' : 'No gain.')),
        resultColor: totalYards >= 5 ? '#22c55e' : (totalYards > 0 ? '#eab308' : '#ef4444'),
        showCommentary: true,
        danComment: comm.dan,
        kikiComment: comm.kiki,
      };
    }

    // ----------------------------------------------------------
    // NEXT_PLAY
    // ----------------------------------------------------------
    case 'NEXT_PLAY': {
      const result = state.lastResult;
      if (!result) return { ...state, phase: 'MENU' };

      // Increment deep pass count for progressive Look introduction
      var _deepPlayIds = ['deepPost', 'fourVerticals', 'teSeam', 'playAction', 'flea'];
      var _newDeepPassCount = state.deepPassCount || 0;
      if (_deepPlayIds.indexOf(state.selectedPlayId) !== -1) _newDeepPassCount++;
      state = { ...state, deepPassCount: _newDeepPassCount };

      // Reset melificent counter on any possession change
      if (result.turnover || result.type === 'touchdown' || result.type === 'safety') {
        state = { ...state, melificentAttempts: 0, goForItToggleCount: 0 };
      }

      const yards = result.yards || 0;
      let newBallPos = clampBallPosition(state.ballPos + yards);
      let newDown = state.down;
      let newDist = state.dist;
      let newPossessions = state.totalPossessions;
      let newPossessionsQ = state.possessionsThisQuarter;

      // Touchdown -> TOUCHDOWN phase
      if (result.type === 'touchdown') {
        return { ...state, phase: 'TOUCHDOWN', chosenDefense: null };
      }

      // Safety: 2 points for defense, then turnover
      if (result.type === 'safety') {
        const scoreKey = state.twoPlayerMode
          ? (state.activeOffense === 1 ? 'p2Score' : 'p1Score')
          : 'cpuScore';
        const scoreUpdate = {};
        scoreUpdate[scoreKey] = (state[scoreKey] || 0) + 2;

        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            ...scoreUpdate,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: 25,
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Safety! 2 points. Possession change.',
            chosenDefense: null,
          };
        }

        return {
          ...state,
          ...scoreUpdate,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: state.cpuBallPos || 70,
          postureChoice: null,
          cpuDriveResult: null,
          ballPos: 25,
          down: 1,
          dist: 10,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Safety! 2 points for the defense.',
          chosenDefense: null,
        };
      }

      // Turnover (INT, fumble) -> DEFENSIVE_POSTURE
      if (result.turnover) {
        newPossessions++;
        newPossessionsQ++;

        // Check quarter advancement
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - (state.cpuBallPos || 75)),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Turnover! Possession change.',
            chosenDefense: null,
          };
        }

        return {
          ...state,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: state.cpuBallPos || 75,
          postureChoice: null,
          cpuDriveResult: null,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          chosenDefense: null,
        };
      }

      // Melificent pity: give the down back, stay on 4th down
      if (result.type === 'melificent_pity') {
        return {
          ...state,
          phase: 'FOURTH_DOWN',
          lastResult: null,
          showCommentary: false,
          fieldAlert: null,
          chosenDefense: null,
        };
      }

      // Check first down
      const yardsToFirst = state.dist;
      if (yards >= yardsToFirst) {
        // First down achieved
        newDown = 1;
        newDist = Math.min(10, 100 - newBallPos);
      } else {
        newDown = state.down + 1;
        newDist = state.dist - yards;
        if (newDist <= 0) {
          newDown = 1;
          newDist = Math.min(10, 100 - newBallPos);
        }
      }

      // Check if it's now 4th down
      if (newDown > 4) {
        // Turnover on downs
        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - newBallPos),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Turnover on downs!',
            chosenDefense: null,
          };
        }

        return {
          ...state,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: Math.max(1, 100 - newBallPos),
          postureChoice: null,
          cpuDriveResult: null,
          down: 1,
          dist: 10,
          ballPos: 25,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Turnover on downs!',
          chosenDefense: null,
        };
      }

      // 4th down reached: show FOURTH_DOWN options
      if (newDown === 4) {
        return {
          ...state,
          phase: 'FOURTH_DOWN',
          ballPos: newBallPos,
          down: newDown,
          dist: newDist,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: null,
          chosenDefense: null,
        };
      }

      // Normal next down
      return {
        ...state,
        phase: 'MENU',
        ballPos: newBallPos,
        down: newDown,
        dist: newDist,
        selectedPlayId: null,
        selectedCategory: null,
        lastResult: null,
        showCommentary: false,
        fieldAlert: null,
        chosenDefense: null,
      };
    }

    // ----------------------------------------------------------
    // FOURTH_DOWN_OPTION
    // ----------------------------------------------------------
    case 'FOURTH_DOWN_OPTION': {
      var choice = action.choice;

      if (choice === 'punt') {
        var puntResult = resolvePunt(state.ballPos);
        var puntTargetY = puntResult.landingSpot - state.ballPos;
        return {
          ...state,
          phase: 'KICK_FLIGHT',
          ballInFlight: true,
          ballFlightTarget: { x: 50, y: puntTargetY },
          lastResult: { type: 'punt', landingSpot: puntResult.landingSpot, touchback: puntResult.touchback, distance: puntResult.distance || (puntResult.landingSpot - state.ballPos) },
          fieldAlert: 'PUNTING...',
          showCommentary: false,
        };
      }

      if (choice === 'fieldGoal') {
        var fgResult = resolveFieldGoal(state.ballPos);
        var fgTargetY = 100 - state.ballPos + 5;

        // Melificent check: FG over 60 yards
        var fgDistance = fgResult.distance;
        var isMelificent = fgDistance > 60;
        var melificentCheat = state.goForItToggleCount >= 3;

        if (isMelificent && !melificentCheat) {
          // Melificent event -- dramatic failure (or 0.01% miracle)
          var miracleRoll = Math.random();
          if (miracleRoll < 0.0001) {
            // Natural miracle -- 0.01% chance
            return {
              ...state,
              phase: 'KICK_FLIGHT',
              ballInFlight: true,
              ballFlightTarget: { x: 50, y: fgTargetY },
              lastResult: { type: 'fieldGoal', made: true, distance: fgDistance, melificent: true, miracle: true },
              fieldAlert: 'KICK IS UP...',
              showCommentary: false,
            };
          }

          // Pick a random failure message
          var MELIFICENT_MESSAGES = [
            "Further... further... it's going... bounces off the crossbar! Oh, so close!",
            "The kick is up... it's got the distance... and it hooks wide right. Heartbreak.",
            "That ball is traveling... still going... lands in the parking lot. Wrong direction, but impressive distance.",
            "It's up! It's got legs! It... hits a bird. Not making this up.",
            "The kick is away... further... further... bounces into the TV cameras. What a disappointment!",
            "Really put a foot through this one... and it's gone. Into the stands. Three rows up. Someone's got a souvenir.",
            "It's got the distance! It's got the height! It's... five yards wide. Close only counts in horseshoes.",
            "That kick has hang time... serious hang time... still going... it lands on the other side of the field. The wrong other side.",
            "The ball is up and... oh. Oh no. That's headed for the hot dog vendor.",
            "Further... further... the crowd is on its feet... and it bounces off the top of the scoreboard. Not even close, but what a kick.",
            "Crushed it! That ball is flying! And flying... and flying... out of the stadium. Literally out of the stadium.",
            "The kick is up... it's curving... still curving... that ball just did a U-turn.",
            "It's got the power! It's got the angle! It's... intercepted? Can you intercept a field goal? Apparently yes.",
            "That ball sailed over the crossbar... and over the stands... and over the parking lot. Never seeing that ball again.",
            "It's up! Looking good! Looking GREAT! And... it bounces off the mascot. Right off his head.",
            "The kick is away and it's... actually, where did it go? Did anyone see where it went?"
          ];
          var melMsg = MELIFICENT_MESSAGES[Math.floor(Math.random() * MELIFICENT_MESSAGES.length)];

          // Pity mechanic: per possession, first attempt gives the down back
          var melAttempts = (state.melificentAttempts || 0) + 1;
          if (melAttempts <= 1) {
            // First attempt this possession: wry commentary, give the down back
            return {
              ...state,
              phase: 'RESULT',
              lastResult: { type: 'melificent_pity', yards: 0, turnover: false },
              resultText: melMsg,
              resultColor: '#f59e0b',
              showCommentary: true,
              danComment: melMsg,
              kikiComment: "Hey, you miss 100% of the shots you don't take. The defense is giving the down back.",
              melificentAttempts: melAttempts,
              fieldAlert: null,
            };
          } else {
            // Second+ attempt same possession: real turnover
            return {
              ...state,
              phase: 'RESULT',
              lastResult: { type: 'fieldGoal', made: false, distance: fgDistance, yards: 0, turnover: true },
              resultText: melMsg,
              resultColor: '#ef4444',
              showCommentary: true,
              danComment: melMsg,
              kikiComment: "That's a turnover. Brutal field position for the opponent.",
              cpuBallPos: Math.min(state.ballPos, 99),
              melificentAttempts: melAttempts,
              fieldAlert: null,
            };
          }
        }

        // Melificent cheat code: guaranteed success
        if (isMelificent && melificentCheat) {
          return {
            ...state,
            phase: 'KICK_FLIGHT',
            ballInFlight: true,
            ballFlightTarget: { x: 50, y: fgTargetY },
            lastResult: { type: 'fieldGoal', made: true, distance: fgDistance, melificent: true, cheat: true },
            fieldAlert: 'KICK IS UP...',
            showCommentary: false,
            goForItToggleCount: 0,
          };
        }

        // Normal field goal
        return {
          ...state,
          phase: 'KICK_FLIGHT',
          ballInFlight: true,
          ballFlightTarget: { x: 50, y: fgTargetY },
          lastResult: { type: 'fieldGoal', made: fgResult.made, distance: fgDistance },
          fieldAlert: 'KICK IS UP...',
          showCommentary: false,
          goForItToggleCount: 0,
        };
      }

      if (choice === 'goForIt') {
        return {
          ...state,
          phase: 'MENU',
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Going for it on 4th down!',
          chosenDefense: null,
          cameFromFourthDown: true,
          goForItToggleCount: (state.goForItToggleCount || 0) + 1,
        };
      }

      if (choice === 'back') {
        return {
          ...state,
          phase: 'FOURTH_DOWN',
          cameFromFourthDown: false,
          goForItToggleCount: (state.goForItToggleCount || 0),
        };
      }

      return state;
    }

    // ----------------------------------------------------------
    // KICK_RESOLVE
    // ----------------------------------------------------------
    case 'KICK_RESOLVE': {
      var result = state.lastResult;

      if (result.type === 'punt') {
        var cpuRecoveryPos = result.touchback ? 80 : result.landingSpot;
        var puntDist = result.distance;
        var puntDan = "High kick... " + puntDist + " yard punt" + (result.touchback ? " into the end zone. Touchback." : ".");

        var newPossessions = state.totalPossessions + 1;
        var newPossessionsQ = state.possessionsThisQuarter + 1;
        var quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            ballInFlight: false,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - result.landingSpot),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            lastResult: { type: 'punt', yards: puntDist, turnover: true, landingSpot: result.landingSpot, touchback: result.touchback },
            resultText: result.touchback ? 'Punt! Touchback.' : 'Punt of ' + puntDist + ' yards.',
            resultColor: '#3b82f6',
            showCommentary: true,
            danComment: puntDan,
            kikiComment: "Flipping field position. Smart play.",
            selectedPlayId: null,
            selectedCategory: null,
            chosenDefense: null,
            fieldAlert: null,
          };
        }

        return {
          ...state,
          ballInFlight: false,
          phase: 'RESULT',
          lastResult: { type: 'punt', yards: puntDist, turnover: true, landingSpot: result.landingSpot, touchback: result.touchback },
          resultText: result.touchback ? 'Punt! Touchback.' : 'Punt of ' + puntDist + ' yards.',
          resultColor: '#3b82f6',
          showCommentary: true,
          danComment: puntDan,
          kikiComment: "Flipping field position. Smart play.",
          cpuBallPos: cpuRecoveryPos,
          fieldAlert: null,
        };
      }

      if (result.type === 'fieldGoal') {
        if (result.made) {
          var scoreKey = state.twoPlayerMode ? (state.activeOffense === 1 ? 'p1Score' : 'p2Score') : 'playerScore';
          var fgNewState = { ...state };
          fgNewState[scoreKey] = (state[scoreKey] || 0) + 3;

          var fgDan = result.melificent
            ? "It's up... it's going... IT IS GOOD! FROM " + result.distance + " YARDS! UNBELIEVABLE!"
            : "The kick is up... and it is GOOD! From " + result.distance + " yards out!";
          var fgKiki = result.melificent
            ? "I have NEVER seen anything like that. " + result.distance + " yards. That is IMPOSSIBLE."
            : "Taking the points. Good call.";

          var newPossessions = state.totalPossessions + 1;
          var newPossessionsQ = state.possessionsThisQuarter + 1;
          var quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

          if (state.twoPlayerMode) {
            return {
              ...fgNewState,
              ballInFlight: false,
              phase: result.melificent ? 'TOUCHDOWN' : (quarterResult.phase || 'MENU'),
              activeOffense: state.activeOffense === 1 ? 2 : 1,
              ballPos: 25,
              down: 1,
              dist: 10,
              totalPossessions: newPossessions,
              possessionsThisQuarter: newPossessionsQ,
              quarter: quarterResult.quarter || state.quarter,
              lastResult: { type: 'fieldGoal', made: true, yards: 0, turnover: true, distance: result.distance, melificent: result.melificent },
              resultText: result.melificent
                ? 'FIELD GOAL IS GOOD! ' + result.distance + ' YARDS! THE IMPOSSIBLE KICK!'
                : 'FIELD GOAL IS GOOD! ' + result.distance + ' yards. +3 points!',
              resultColor: result.melificent ? 'gold' : '#eab308',
              showCommentary: true,
              danComment: fgDan,
              kikiComment: fgKiki,
              selectedPlayId: null,
              selectedCategory: null,
              chosenDefense: null,
              fieldAlert: null,
            };
          }

          return {
            ...fgNewState,
            ballInFlight: false,
            phase: result.melificent ? 'TOUCHDOWN' : 'RESULT',
            lastResult: { type: 'fieldGoal', made: true, yards: 0, turnover: true, distance: result.distance, melificent: result.melificent },
            resultText: result.melificent
              ? 'FIELD GOAL IS GOOD! ' + result.distance + ' YARDS! THE IMPOSSIBLE KICK!'
              : 'FIELD GOAL IS GOOD! ' + result.distance + ' yards. +3 points!',
            resultColor: result.melificent ? 'gold' : '#eab308',
            showCommentary: true,
            danComment: fgDan,
            kikiComment: fgKiki,
            cpuBallPos: 75,
            fieldAlert: null,
          };
        } else {
          var cpuPos = Math.min(state.ballPos, 99);
          var newPossessions = state.totalPossessions + 1;
          var newPossessionsQ = state.possessionsThisQuarter + 1;
          var quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

          if (state.twoPlayerMode) {
            return {
              ...state,
              ballInFlight: false,
              phase: quarterResult.phase || 'MENU',
              activeOffense: state.activeOffense === 1 ? 2 : 1,
              ballPos: Math.max(1, 100 - cpuPos),
              down: 1,
              dist: 10,
              totalPossessions: newPossessions,
              possessionsThisQuarter: newPossessionsQ,
              quarter: quarterResult.quarter || state.quarter,
              lastResult: { type: 'fieldGoal', made: false, yards: 0, turnover: true, distance: result.distance },
              resultText: 'FIELD GOAL MISSED! ' + result.distance + ' yards.',
              resultColor: '#ef4444',
              showCommentary: true,
              danComment: "The kick is up... and it's NO GOOD! Missed it wide!",
              kikiComment: "Empty possession. Opponent gets great field position.",
              selectedPlayId: null,
              selectedCategory: null,
              chosenDefense: null,
              fieldAlert: null,
            };
          }

          return {
            ...state,
            ballInFlight: false,
            phase: 'RESULT',
            lastResult: { type: 'fieldGoal', made: false, yards: 0, turnover: true, distance: result.distance },
            resultText: 'FIELD GOAL MISSED! ' + result.distance + ' yards.',
            resultColor: '#ef4444',
            showCommentary: true,
            danComment: "The kick is up... and it's NO GOOD! Missed it wide!",
            kikiComment: "Empty possession. Opponent gets great field position.",
            cpuBallPos: cpuPos,
            fieldAlert: null,
          };
        }
      }
      return state;
    }

    // ----------------------------------------------------------
    // FOURTH_DOWN_BACK — return to MENU from 4th down screen
    // ----------------------------------------------------------
    case 'FOURTH_DOWN_BACK': {
      return {
        ...state,
        phase: 'FOURTH_DOWN',
        goForItToggleCount: (state.goForItToggleCount || 0),
      };
    }

    // ----------------------------------------------------------
    // BACK_TO_FOURTH_DOWN — return to 4th down from MENU
    // ----------------------------------------------------------
    case 'BACK_TO_FOURTH_DOWN': {
      return {
        ...state,
        phase: 'FOURTH_DOWN',
        cameFromFourthDown: false,
      };
    }

    // ----------------------------------------------------------
    // POSTURE_PICK
    // ----------------------------------------------------------
    case 'POSTURE_PICK': {
      return {
        ...state,
        phase: 'CPU_DRIVING',
        postureChoice: action.posture,
        cpuDrivePlays: [],
        cpuDrivePlayIndex: 0,
      };
    }

    // ----------------------------------------------------------
    // RESOLVE_CPU_DRIVE
    // ----------------------------------------------------------
    case 'RESOLVE_CPU_DRIVE': {
      const posture = state.postureChoice;
      const driveResult = resolveCPUDrive(state.cpuBallPos, posture, state.difficulty);

      // Store drive result and start play-by-play stepping
      return {
        ...state,
        cpuDriveResult: driveResult,
        cpuDrivePlays: driveResult.plays || [],
        cpuDrivePlayIndex: 0,
      };
    }

    case 'CPU_DRIVE_NEXT_PLAY': {
      var nextPlayIdx = (state.cpuDrivePlayIndex || 0) + 1;
      if (nextPlayIdx >= (state.cpuDrivePlays || []).length) {
        // Drive complete — resolve to CPU_RESULT
        var driveResult2 = state.cpuDriveResult;
        if (!driveResult2) return { ...state, phase: 'CPU_RESULT' };

        var newCpuScore2 = state.twoPlayerMode
          ? (state.activeOffense === 1 ? state.p2Score : state.p1Score) + driveResult2.cpuScore
          : state.cpuScore + driveResult2.cpuScore;

        var playerBallPos2 = clampBallPosition(driveResult2.playerBallPos);

        var comm3 = pickCommentary('cpuDrive', {});
        var coachAdvice3 = state.coach ? pickCoachAdvice(state.coach, 'postureDebrief') : '';

        var newPossessions2 = state.totalPossessions + 1;
        var newPossessionsQ2 = state.possessionsThisQuarter + 1;
        var quarterResult2 = checkQuarterAdvance(state.quarter, newPossessionsQ2, newPossessions2);

        var scoreUpdate2 = state.twoPlayerMode
          ? (state.activeOffense === 1
            ? { p2Score: newCpuScore2 }
            : { p1Score: newCpuScore2 })
          : { cpuScore: newCpuScore2 };

        return {
          ...state,
          ...scoreUpdate2,
          phase: 'CPU_RESULT',
          postureChoice: state.postureChoice,
          cpuDriveResult: driveResult2,
          cpuResultNextPhase: quarterResult2.phase || 'MENU',
          cpuResultNextQuarter: quarterResult2.quarter || state.quarter,
          ballPos: playerBallPos2,
          down: 1,
          dist: 10,
          totalPossessions: newPossessions2,
          possessionsThisQuarter: newPossessionsQ2,
          quarter: quarterResult2.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          showCommentary: false,
          danComment: driveResult2.driveText,
          kikiComment: comm3.kiki,
          coachAdvice: coachAdvice3,
          fieldAlert: null,
          lastResult: null,
          chosenDefense: null,
        };
      }
      // Still stepping through plays
      return { ...state, cpuDrivePlayIndex: nextPlayIdx };
    }

    // ----------------------------------------------------------
    // DISMISS_CPU_RESULT
    // ----------------------------------------------------------
    case 'DISMISS_CPU_RESULT': {
      return {
        ...state,
        phase: state.cpuResultNextPhase || 'MENU',
        quarter: state.cpuResultNextQuarter || state.quarter,
        cpuResultNextPhase: null,
        cpuResultNextQuarter: null,
      };
    }

    // ----------------------------------------------------------
    // TWO_PLAYER_DEF_PICK
    // ----------------------------------------------------------
    case 'TWO_PLAYER_DEF_PICK': {
      return {
        ...state,
        chosenDefense: action.defenseId,
        phase: 'PRESNAP',
      };
    }

    // ----------------------------------------------------------
    // DISMISS_COMMENTARY
    // ----------------------------------------------------------
    case 'DISMISS_COMMENTARY': {
      return { ...state, showCommentary: false };
    }

    // ----------------------------------------------------------
    // DISMISS_OVERLAY
    // ----------------------------------------------------------
    case 'DISMISS_OVERLAY': {
      return {
        ...state,
        overlaysSeen: {
          ...state.overlaysSeen,
          [action.overlayId || 'unknown']: true,
        },
      };
    }

    // ----------------------------------------------------------
    // ANIMATION_TICK — incremental position updates during active phases
    // ----------------------------------------------------------
    case 'ANIMATION_TICK': {
      const tickPlay = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
      if (!tickPlay) return state;
      const tickFormation = tickPlay.formation;
      const tickParams = state.difficulty ? DIFFICULTY_PARAMS[state.difficulty] : null;
      if (!tickParams) return state;

      // DECISION / RPO_READ: field frozen — all movement happens in QB_ACTION per button press
      if (state.phase === 'DECISION' || state.phase === 'RPO_READ') {
        return state;
      }

      // RUNNER: defenders converge on carrier every tick — inaction gets you tackled
      if (state.phase === 'RUNNER') {
        var tickCarrier = state.carrierXY;
        var tickDifficulty = state.difficulty;
        var tickDefs = state.currentDefenderPos;

        var convergeFraction = {
          practice: 0.15,
          preseason: 0.20,
          regular: 0.35,
          playoffs: 0.50
        };
        var fraction = convergeFraction[tickDifficulty] || 0.25;

        // Carrier past LOS (y > 0) triggers full pursuit for all defenders
        var carrierPastLOS = tickCarrier.y > 0;

        var xScale = 0.53;
        var newTickDefs = [];
        for (var tdi = 0; tdi < tickDefs.length; tdi++) {
          var td = Object.assign({}, tickDefs[tdi]);
          // DL (y <= 2 at snap) always moves; LB/secondary gated behind LOS until carrier crosses
          var isDL = td.origY !== undefined ? td.origY <= 2 : td.y <= 4;
          if (!isDL && !carrierPastLOS) {
            newTickDefs.push(td);
            continue;
          }
          var tdx = (tickCarrier.x - td.x) * xScale;
          var tdy = tickCarrier.y - td.y;
          var tdist = Math.sqrt(tdx * tdx + tdy * tdy);
          if (tdist > 1.0) {
            td.x += (tdx / tdist) * fraction / xScale;
            td.y += (tdy / tdist) * fraction;
          }
          newTickDefs.push(td);
        }

        // Check if any defender is now within auto-tackle range
        var autoTackleRange = 1.2;
        var autoTackled = false;
        for (var ati = 0; ati < newTickDefs.length; ati++) {
          var atd = newTickDefs[ati];
          var atdx = (tickCarrier.x - atd.x) * xScale;
          var atdy = tickCarrier.y - atd.y;
          var atdist = Math.sqrt(atdx * atdx + atdy * atdy);
          if (atdist < autoTackleRange) {
            autoTackled = true;
            break;
          }
        }

        if (autoTackled) {
          var nearDef = findNearestDefender(tickCarrier, newTickDefs);
          return {
            ...state,
            phase: 'CONTACT',
            currentDefenderPos: newTickDefs,
            contactDefenderId: nearDef ? nearDef.id : null,
            fieldAlert: 'CONTACT!',
            autoTackleTimer: 0,
          };
        }

        // Auto-tackle countdown: if any defender within 2.0 yards, increment timer
        var closeThreat = false;
        for (var cti = 0; cti < newTickDefs.length; cti++) {
          var ctd = newTickDefs[cti];
          var ctdx = (tickCarrier.x - ctd.x) * xScale;
          var ctdy = tickCarrier.y - ctd.y;
          var ctdist = Math.sqrt(ctdx * ctdx + ctdy * ctdy);
          if (ctdist < 2.0) { closeThreat = true; break; }
        }
        var newAutoTimer = closeThreat ? (state.autoTackleTimer || 0) + 1 : 0;
        if (newAutoTimer >= 15) {
          var nearDef2 = findNearestDefender(tickCarrier, newTickDefs);
          return {
            ...state,
            phase: 'CONTACT',
            currentDefenderPos: newTickDefs,
            contactDefenderId: nearDef2 ? nearDef2.id : null,
            fieldAlert: 'TACKLED! Too slow to react!',
            autoTackleTimer: 0,
          };
        }

        return { ...state, currentDefenderPos: newTickDefs, autoTackleTimer: newAutoTimer };
      }

      // CONTACT: jitter + gated convergence + auto-tackle timer
      if (state.phase === 'CONTACT') {
        var jitterCarrier = { x: state.carrierXY.x, y: state.carrierXY.y };
        jitterCarrier.x += (Math.random() - 0.5) * 0.8;
        jitterCarrier.y += (Math.random() - 0.5) * 0.4;

        var carrierPastLOS = jitterCarrier.y > 0;
        var xScale = 0.53;

        // Auto-tackle timer: force result if player idles on contact menu
        var newAutoTimerContact = (state.autoTackleTimer || 0) + 1;
        if (newAutoTimerContact >= 25) {
          var totalYardsAutoContact = Math.round(jitterCarrier.y);
          return {
            ...state,
            phase: 'RESULT',
            carrierXY: jitterCarrier,
            lastResult: { type: 'tackle', yards: totalYardsAutoContact, turnover: false },
            resultText: 'Forward progress stopped! ' + (totalYardsAutoContact > 0 ? 'Gain of ' + totalYardsAutoContact + ' yards.' : 'No gain.'),
            resultColor: '#ef4444',
            autoTackleTimer: 0,
          };
        }

        // Other defenders converge -- with LOS gating and reduced speed
        var newDefPos = state.currentDefenderPos.map(function(d) {
          var nd = Object.assign({}, d);
          if (nd.id !== state.contactDefenderId) {
            // LOS gate: only DL can cross before carrier does
            var isDL = nd.origY !== undefined ? nd.origY <= 2 : nd.y <= 4;
            if (!isDL && !carrierPastLOS) {
              return nd;
            }
            var cdx = (jitterCarrier.x - nd.x) * xScale;
            var cdy = jitterCarrier.y - nd.y;
            var cdist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cdist > 2) {
              nd.x += (cdx / cdist) * 0.15 / xScale;
              nd.y += (cdy / cdist) * 0.15;
            }
          } else {
            // Contact defender jitters with carrier
            nd.x += (Math.random() - 0.5) * 0.6;
            nd.y += (Math.random() - 0.5) * 0.3;
          }
          return nd;
        });

        return {
          ...state,
          carrierXY: jitterCarrier,
          currentDefenderPos: newDefPos,
          autoTackleTimer: newAutoTimerContact,
        };
      }

      return state;
    }

    // ----------------------------------------------------------
    // TOGGLE_PAUSE
    // ----------------------------------------------------------
    case 'TOGGLE_PAUSE': {
      return { ...state, isPaused: !state.isPaused };
    }

    case 'TOGGLE_NOTE_TO_PLAYERS': {
      return { ...state, showNoteToPlayers: !state.showNoteToPlayers };
    }

    // ----------------------------------------------------------
    // RESTART_GAME
    // ----------------------------------------------------------
    case 'RESTART_GAME': {
      return {
        ...INITIAL_STATE,
        coach: state.coach,
        difficulty: state.difficulty,
        twoPlayerMode: state.twoPlayerMode || false,
        phase: 'MENU',
      };
    }

    // ----------------------------------------------------------
    // TOGGLE_MUTE
    // ----------------------------------------------------------
    case 'TOGGLE_MUTE': {
      const newMuted = !state.muted;
      SoundEngine.setMuted(newMuted);
      return { ...state, muted: newMuted };
    }

    // ----------------------------------------------------------
    // ADVANCE_QUARTER
    // ----------------------------------------------------------
    case 'ADVANCE_QUARTER': {
      const nextQuarter = state.quarter + 1;
      if (nextQuarter > 4) {
        return { ...state, phase: 'GAME_OVER' };
      }
      // Reset field state at halftime (entering Q3)
      const halftimeReset = nextQuarter === 3 ? {
        ballPos: 25,
        down: 1,
        dist: 10,
        activeOffense: state.twoPlayerMode ? (state.activeOffense === 1 ? 2 : 1) : state.activeOffense,
      } : {};
      return {
        ...state,
        ...halftimeReset,
        phase: 'MENU',
        quarter: nextQuarter,
        possessionsThisQuarter: 0,
        audiblesThisQuarter: 0,
      };
    }

    // ----------------------------------------------------------
    // SCORE_TOUCHDOWN
    // ----------------------------------------------------------
    case 'SCORE_TOUCHDOWN': {
      const scoreKey = state.twoPlayerMode
        ? (state.activeOffense === 1 ? 'p1Score' : 'p2Score')
        : 'playerScore';

      let newPossessions = state.totalPossessions + 1;
      let newPossessionsQ = state.possessionsThisQuarter + 1;
      const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

      const scoreUpdate = {};
      scoreUpdate[scoreKey] = (state[scoreKey] || 0) + 7;

      if (state.twoPlayerMode) {
        return {
          ...state,
          ...scoreUpdate,
          phase: quarterResult.phase || 'MENU',
          activeOffense: state.activeOffense === 1 ? 2 : 1,
          ballPos: 25,
          down: 1,
          dist: 10,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: null,
          chosenDefense: null,
        };
      }

      return {
        ...state,
        ...scoreUpdate,
        phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
        cpuBallPos: 75,
        postureChoice: null,
        cpuDriveResult: null,
        ballPos: 25,
        down: 1,
        dist: 10,
        totalPossessions: newPossessions,
        possessionsThisQuarter: newPossessionsQ,
        quarter: quarterResult.quarter || state.quarter,
        selectedPlayId: null,
        selectedCategory: null,
        lastResult: null,
        showCommentary: false,
        fieldAlert: null,
        chosenDefense: null,
      };
    }

    default:
      return state;
  }
}

// ============================================================
// HELPER: Quarter advancement logic
// ============================================================
function checkQuarterAdvance(currentQuarter, possessionsThisQ, totalPossessions) {
  // Each quarter has ~4 possessions per team (8 total)
  const possessionsPerQuarter = 8;

  if (possessionsThisQ >= possessionsPerQuarter) {
    if (currentQuarter === 2) {
      return { phase: 'HALFTIME', quarter: currentQuarter };
    }
    if (currentQuarter >= 4) {
      return { phase: 'GAME_OVER', quarter: currentQuarter };
    }
    return { phase: 'QUARTER_CHANGE', quarter: currentQuarter };
  }
  return { phase: null, quarter: currentQuarter };
}

// ============================================================
// PLAYER TOKEN COMPONENT
// ============================================================
function PlayerToken({ id, role, x, y, isBallCarrier, isOffense, integrityColor, label, instant, scale }) {
  const tokenClass = React.useMemo(() => {
    let base = 'token';
    if (instant) base += ' instant';

    if (isOffense) {
      switch (role) {
        case 'QB': base += ' token-qb'; break;
        case 'RB': base += ' token-rb'; break;
        case 'W1': case 'W2': case 'WR': base += ' token-wr'; break;
        case 'TE': base += ' token-te'; break;
        case 'OL': base += ' token-ol'; break;
        default: base += ' token-wr'; break;
      }
      if (role === 'OL' && integrityColor) {
        base += ' integrity-' + integrityColor;
      }
    } else {
      switch (role) {
        case 'DL': base += ' token-dl'; break;
        case 'LB': base += ' token-lb'; break;
        case 'CB': base += ' token-cb'; break;
        case 'S':  base += ' token-s'; break;
        default: base += ' token-lb'; break;
      }
    }

    if (isBallCarrier) base += ' ball-carrier';
    return base;
  }, [role, isOffense, isBallCarrier, integrityColor, instant]);

  const scaleStr = (scale && scale !== 1) ? ' scale(' + scale + ')' : '';
  const rotateStr = (role === 'QB' && isOffense) ? ' rotate(45deg)' : '';
  const style = {
    left: x + 'px',
    top: y + 'px',
    transform: 'translate(-50%, -50%)' + scaleStr + rotateStr,
  };

  const displayLabel = label || (id || '').replace(/[0-9]/g, '');

  return React.createElement('div', {
    className: tokenClass,
    style: style,
    title: id,
  },
    React.createElement('span', {
      className: role === 'QB' ? 'label' : null,
      style: { fontSize: '10px', pointerEvents: 'none' }
    }, displayLabel)
  );
}

// ============================================================
// GAME FIELD COMPONENT
// ============================================================
function GameField({ state, dispatch }) {
  const fieldScrollRef = React.useRef(null);
  const viewportRef = React.useRef(null);
  const prevCameraModeRef = React.useRef(state.cameraMode);
  const [fieldWidth, setFieldWidth] = React.useState(0);
  const [viewportHeight, setViewportHeight] = React.useState(450);
  const [instantCam, setInstantCam] = React.useState(false);

  // Dynamic yard-to-pixel ratio based on camera mode
  const followYardPx = viewportHeight / 55;
  const yardPx = state.cameraMode === 'strategic' ? (viewportHeight / 120) : followYardPx;
  const totalFieldHeight = 120 * yardPx;
  const tokenScale = yardPx / YARD_PX;

  // Measure field width and height
  React.useEffect(function() {
    var measure = function() {
      if (viewportRef.current) {
        var rect = viewportRef.current.getBoundingClientRect();
        setFieldWidth(rect.width);
        setViewportHeight(rect.height);
      }
    };
    // Double RAF ensures CSS layout recalculations finish before measuring
    requestAnimationFrame(function() { requestAnimationFrame(measure); });
    window.addEventListener('resize', measure);
    return function() { window.removeEventListener('resize', measure); };
  }, [state.phase]);

  // Camera positioning
  React.useEffect(() => {
    if (!fieldScrollRef.current) return;

    if (state.cameraMode === 'strategic') {
      // Full field visible — no scrolling needed
      fieldScrollRef.current.style.transform = 'translateY(0px)';
      return;
    }

    // Follow mode: track ball carrier or ball-in-flight, not LOS
    let trackYard = state.ballPos;
    if (state.carrier && state.carrierXY && (state.phase === 'RUNNER' || state.phase === 'CONTACT')) {
      trackYard = state.ballPos + state.carrierXY.y;
    } else if (state.ballInFlight && state.ballFlightTarget) {
      var qbY = state.quarterbackXY ? state.quarterbackXY.y : 0;
      var targetY = state.ballFlightTarget.y;
      trackYard = state.ballPos + (qbY + targetY) / 2;
    }

    const trackPixel = (110 - trackYard) * yardPx;
    // Offset camera for overlay phases: put LOS in upper third, not center
    var overlayPhases = ['DECISION', 'RUNNER', 'CONTACT', 'RPO_READ', 'FOURTH_DOWN'];
    var isOverlay = overlayPhases.indexOf(state.phase) !== -1;
    var cameraOffset;
    if (state.phase === 'RUNNER' || state.phase === 'CONTACT') {
      cameraOffset = viewportHeight * 0.45;
    } else if (isOverlay) {
      cameraOffset = viewportHeight * 0.35;
    } else {
      cameraOffset = viewportHeight / 2;
    }
    var targetScroll = trackPixel - cameraOffset;
    var bottomClamp = isOverlay ? (totalFieldHeight - viewportHeight + viewportHeight * 0.6) : (totalFieldHeight - viewportHeight + viewportHeight * 0.15);
    var clampedScroll = Math.max(0, Math.min(bottomClamp, targetScroll));

    fieldScrollRef.current.style.transform = 'translateY(' + (-clampedScroll) + 'px)';
  }, [state.cameraMode, state.ballPos, state.phase, state.carrierXY, state.ballInFlight, state.ballFlightTarget]);

  // Instant camera: only when staying within strategic mode (e.g. MENU → PRESNAP)
  React.useEffect(() => {
    const prevMode = prevCameraModeRef.current;
    const newMode = state.cameraMode;
    prevCameraModeRef.current = newMode;

    if (prevMode === 'strategic' && newMode === 'strategic') {
      setInstantCam(true);
      const timer = setTimeout(() => setInstantCam(false), 50);
      return () => clearTimeout(timer);
    }
  }, [state.cameraMode, state.phase]);

  // Sound effects — triggered by phase transitions
  React.useEffect(function() {
    if (state.phase === 'SNAPPING' || state.phase === 'KICK_FLIGHT') {
      SoundEngine.play('snap');
    }
    if (state.phase === 'CONTACT') {
      SoundEngine.play('tackle');
    }
    if (state.phase === 'TOUCHDOWN') {
      SoundEngine.play('whistle');
      setTimeout(function() { SoundEngine.play('crowd'); }, 300);
    }
    if (state.phase === 'RESULT' && state.resultText && state.resultText.includes('SACKED')) {
      SoundEngine.play('sackBuzz');
    }
  }, [state.phase, state.resultText]);

  // Coordinate conversion helpers — all use dynamic yardPx
  function yardToPixelY(yardFromOwnGoal) {
    return (110 - yardFromOwnGoal) * yardPx;
  }

  function relToAbsoluteY(relativeY) {
    return state.ballPos + relativeY;
  }

  function posToPixel(xPct, relativeY) {
    const absY = relToAbsoluteY(relativeY);
    return {
      left: (xPct / 100) * fieldWidth,
      top: yardToPixelY(absY),
    };
  }

  // Build yard lines
  const yardLines = [];
  for (let yd = 0; yd <= 100; yd++) {
    const pixelY = yardToPixelY(yd);
    let lineClass = 'yard-line';
    if (yd % 10 === 0) lineClass += ' ten';
    else if (yd % 5 === 0) lineClass += ' five';

    yardLines.push(
      React.createElement('div', {
        key: 'yl-' + yd,
        className: lineClass,
        style: { top: pixelY + 'px' }
      })
    );
  }

  // Yard numbers
  const yardNumbers = [];
  for (let yd = 10; yd <= 90; yd += 10) {
    const displayNum = yd <= 50 ? yd : (100 - yd);
    if (displayNum === 0 || displayNum === 10) continue;
    const pixelY = yardToPixelY(yd);
    yardNumbers.push(
      React.createElement('div', {
        key: 'yn-l-' + yd,
        className: 'yard-number',
        style: { left: '8%', top: (pixelY - 12) + 'px' }
      }, displayNum)
    );
    yardNumbers.push(
      React.createElement('div', {
        key: 'yn-r-' + yd,
        className: 'yard-number',
        style: { right: '8%', top: (pixelY - 12) + 'px', left: 'auto' }
      }, displayNum)
    );
  }

  // Hash marks
  const hashMarks = [];
  for (let yd = 1; yd <= 99; yd++) {
    if (yd % 5 === 0) continue;
    const pixelY = yardToPixelY(yd);
    hashMarks.push(
      React.createElement('div', {
        key: 'hash-l-' + yd,
        style: {
          position: 'absolute',
          left: '29.5%',
          top: pixelY + 'px',
          width: '2px',
          height: '1px',
          background: 'rgba(255,255,255,0.12)',
        }
      })
    );
    hashMarks.push(
      React.createElement('div', {
        key: 'hash-r-' + yd,
        style: {
          position: 'absolute',
          left: '70.5%',
          top: pixelY + 'px',
          width: '2px',
          height: '1px',
          background: 'rgba(255,255,255,0.12)',
        }
      })
    );
  }

  // Turf bands (alternating every 5 yards)
  const turfBands = [];
  for (let band = 0; band < 20; band++) {
    const startYard = band * 5;
    const topPx = yardToPixelY(startYard + 5);
    const height = 5 * yardPx;
    turfBands.push(
      React.createElement('div', {
        key: 'turf-' + band,
        className: 'yard-band ' + (band % 2 === 0 ? 'even' : 'odd'),
        style: { top: topPx + 'px', height: height + 'px' }
      })
    );
  }

  // End zones
  const oppEndzone = React.createElement('div', {
    className: 'endzone endzone-opponent',
    style: { top: 0, height: (10 * yardPx) + 'px' }
  }, 'END ZONE');

  const ownEndzone = React.createElement('div', {
    className: 'endzone endzone-own',
    style: { top: (110 * yardPx) + 'px', height: (10 * yardPx) + 'px' }
  }, 'END ZONE');

  // Midfield logo
  const midfieldLogo = React.createElement('div', {
    key: 'midfield',
    style: {
      position: 'absolute',
      top: (yardToPixelY(50) - 16) + 'px',
      left: '50%',
      transform: 'translateX(-50%)',
      fontSize: '32px',
      fontWeight: '900',
      color: 'rgba(255,255,255,0.06)',
      pointerEvents: 'none',
      userSelect: 'none',
    }
  }, 'HM');

  // Goal posts
  const goalPosts = [];
  const goalPostStyle = {
    position: 'absolute',
    width: '20%',
    height: '3px',
    background: '#ddb830',
    left: '40%',
    zIndex: 4,
    borderRadius: '2px',
  };
  goalPosts.push(
    React.createElement('div', {
      key: 'gp-top',
      style: { ...goalPostStyle, top: (yardToPixelY(100) - 2) + 'px' }
    })
  );
  goalPosts.push(
    React.createElement('div', {
      key: 'gp-bottom',
      style: { ...goalPostStyle, top: (yardToPixelY(0) - 2) + 'px' }
    })
  );

  // Line of scrimmage
  const losLine = React.createElement('div', {
    className: 'line-of-scrimmage',
    style: { top: yardToPixelY(state.ballPos) + 'px' }
  });

  // First down marker
  let firstDownMarker = null;
  if (state.dist <= 30) {
    const firstDownYard = state.ballPos + state.dist;
    if (firstDownYard <= 100) {
      firstDownMarker = React.createElement('div', {
        className: 'first-down-marker',
        style: { top: yardToPixelY(firstDownYard) + 'px' }
      });
    }
  }

  // ---- PLAYER TOKENS ----
  const playerTokens = [];
  const isActivePlay = ['PRESNAP', 'SNAPPING', 'DECISION', 'RPO_READ', 'RUNNER', 'CONTACT', 'KICK_FLIGHT'].includes(state.phase);
  const play = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
  const formation = play ? play.formation : null;
  const instantTokens = state.phase === 'PRESNAP';

  // Don't render tokens until field width is measured
  const canRenderTokens = fieldWidth > 0;

  if (canRenderTokens && isActivePlay && formation) {
    // OL tokens
    const holdData = state.holdTimeData || [];
    for (let i = 0; i < formation.OL.length; i++) {
      const olPos = formation.OL[i];
      const pixel = posToPixel(olPos.x, olPos.y);
      let intColor = 'good';
      if (holdData[i]) {
        if (holdData[i].integrity > 60) intColor = 'good';
        else if (holdData[i].integrity > 25) intColor = 'warn';
        else intColor = 'bad';
      }
      playerTokens.push(
        React.createElement(PlayerToken, {
          key: 'OL' + i,
          id: 'OL' + (i + 1),
          role: 'OL',
          x: pixel.left,
          y: pixel.top,
          isBallCarrier: false,
          isOffense: true,
          integrityColor: intColor,
          label: '',
          instant: instantTokens,
          scale: tokenScale,
        })
      );
    }

    // QB token
    const qbPos = (state.phase === 'DECISION' || state.phase === 'SNAPPING')
      ? state.quarterbackXY
      : (formation.QB || { x: 50, y: -3 });
    const qbPx = posToPixel(qbPos.x, qbPos.y);
    const qbIsCarrier = state.carrier === 'QB' && (state.phase === 'RUNNER' || state.phase === 'CONTACT');
    playerTokens.push(
      React.createElement(PlayerToken, {
        key: 'QB',
        id: 'QB',
        role: 'QB',
        x: qbPx.left,
        y: qbPx.top,
        isBallCarrier: qbIsCarrier,
        isOffense: true,
        label: 'QB',
        instant: instantTokens,
        scale: tokenScale,
      })
    );

    // Receiver tokens (W1, W2, TE, RB)
    const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
    var intendedKey = play && play.primary ? play.primary : null;
    var showIntended = intendedKey && (state.phase === 'DECISION' || state.phase === 'SNAPPING');
    for (const rk of receiverKeys) {
      let recPosition;
      if (state.currentReceiverPos[rk]) {
        recPosition = state.currentReceiverPos[rk];
      } else if (formation[rk]) {
        recPosition = { x: formation[rk].x, y: formation[rk].y };
      }
      if (!recPosition) continue;

      // If this receiver is the carrier in RUNNER/CONTACT, use carrierXY
      const isCarrier = state.carrier === rk && (state.phase === 'RUNNER' || state.phase === 'CONTACT');
      const displayPos = isCarrier ? state.carrierXY : recPosition;
      const px = posToPixel(displayPos.x, displayPos.y);
      var isIntended = showIntended && rk === intendedKey;

      playerTokens.push(
        React.createElement(PlayerToken, {
          key: rk,
          id: rk,
          role: rk,
          x: px.left,
          y: px.top,
          isBallCarrier: isCarrier,
          isOffense: true,
          label: rk,
          instant: instantTokens,
          scale: tokenScale,
        })
      );

      // Gold ring + INTENDED badge on primary receiver at snap
      if (isIntended) {
        playerTokens.push(
          React.createElement('div', {
            key: rk + '-intended-ring',
            style: {
              position: 'absolute',
              left: px.left + 'px',
              top: px.top + 'px',
              transform: 'translate(-50%, -50%)',
              width: (30 * (tokenScale || 1)) + 'px',
              height: (30 * (tokenScale || 1)) + 'px',
              borderRadius: '50%',
              border: '2px solid gold',
              boxShadow: '0 0 8px gold',
              pointerEvents: 'none',
              zIndex: 5,
            }
          }),
          React.createElement('div', {
            key: rk + '-intended-badge',
            style: {
              position: 'absolute',
              left: px.left + 'px',
              top: (px.top - 18 * (tokenScale || 1)) + 'px',
              transform: 'translateX(-50%)',
              background: 'gold',
              color: '#000',
              fontSize: '8px',
              fontWeight: 'bold',
              padding: '1px 4px',
              borderRadius: '3px',
              pointerEvents: 'none',
              zIndex: 6,
              whiteSpace: 'nowrap',
            }
          }, 'INTENDED')
        );
      }
    }

    // Defense tokens
    for (let i = 0; i < state.currentDefenderPos.length; i++) {
      const def = state.currentDefenderPos[i];
      const defPx = posToPixel(def.x, def.y);
      playerTokens.push(
        React.createElement(PlayerToken, {
          key: 'def-' + def.id,
          id: def.id,
          role: def.role,
          x: defPx.left,
          y: defPx.top,
          isBallCarrier: false,
          isOffense: false,
          label: '',
          instant: instantTokens,
          scale: tokenScale,
        })
      );
    }
  } else if (canRenderTokens) {
    // Fallback formation rendering for non-active phases
    // Keeps the field from ever looking empty
    const fallbackPhases = ['MENU', 'PLAY_SELECT', 'RESULT', 'FOURTH_DOWN', 'CPU_RESULT'];
    if (fallbackPhases.includes(state.phase)) {

      if (state.phase === 'RESULT' && (Object.keys(state.currentReceiverPos).length > 0 || state.currentDefenderPos.length > 0)) {
        // RESULT: show players at their final positions from the play that just ended
        const resultPlay = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
        const resultFormation = resultPlay ? resultPlay.formation : FI;

        // OL at formation spots
        for (let i = 0; i < resultFormation.OL.length; i++) {
          const olPos = resultFormation.OL[i];
          const pixel = posToPixel(olPos.x, olPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'OL' + i,
              id: 'OL' + (i + 1),
              role: 'OL',
              x: pixel.left,
              y: pixel.top,
              isBallCarrier: false,
              isOffense: true,
              integrityColor: 'good',
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // QB at last known position or formation
        const qbFinalPos = state.quarterbackXY || (resultFormation.QB || { x: 50, y: -3 });
        const qbFinalPx = posToPixel(qbFinalPos.x, qbFinalPos.y);
        playerTokens.push(
          React.createElement(PlayerToken, {
            key: 'QB',
            id: 'QB',
            role: 'QB',
            x: qbFinalPx.left,
            y: qbFinalPx.top,
            isBallCarrier: false,
            isOffense: true,
            label: 'QB',
            instant: true,
            scale: tokenScale,
          })
        );

        // Receivers at their final positions
        const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
        for (const rk of receiverKeys) {
          let recPos = state.currentReceiverPos[rk];
          // If this receiver was the carrier, use carrierXY
          if (state.carrier === rk && state.carrierXY) {
            recPos = state.carrierXY;
          }
          if (!recPos && resultFormation[rk]) {
