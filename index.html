            recPos = { x: resultFormation[rk].x, y: resultFormation[rk].y };
          }
          if (!recPos) continue;
          const px = posToPixel(recPos.x, recPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: rk,
              id: rk,
              role: rk,
              x: px.left,
              y: px.top,
              isBallCarrier: false,
              isOffense: true,
              label: rk,
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // Defenders at their final positions
        for (let i = 0; i < state.currentDefenderPos.length; i++) {
          const def = state.currentDefenderPos[i];
          const defPx = posToPixel(def.x, def.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'def-' + def.id,
              id: def.id,
              role: def.role,
              x: defPx.left,
              y: defPx.top,
              isBallCarrier: false,
              isOffense: false,
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

      } else {
        // MENU, PLAY_SELECT, FOURTH_DOWN, CPU_RESULT: show default I-Formation offense
        // During PLAY_SELECT with an expanded play, use that play's formation
        let fallbackFormation = FI;
        if (state.phase === 'PLAY_SELECT' && state.expandedPlayId) {
          const previewPlay = PLAYS.find(p => p.id === state.expandedPlayId);
          if (previewPlay) fallbackFormation = previewPlay.formation;
        }

        // OL
        for (let i = 0; i < fallbackFormation.OL.length; i++) {
          const olPos = fallbackFormation.OL[i];
          const pixel = posToPixel(olPos.x, olPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'OL' + i,
              id: 'OL' + (i + 1),
              role: 'OL',
              x: pixel.left,
              y: pixel.top,
              isBallCarrier: false,
              isOffense: true,
              integrityColor: 'good',
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // QB
        const qbPos = fallbackFormation.QB || { x: 50, y: -3 };
        const qbPx = posToPixel(qbPos.x, qbPos.y);
        playerTokens.push(
          React.createElement(PlayerToken, {
            key: 'QB',
            id: 'QB',
            role: 'QB',
            x: qbPx.left,
            y: qbPx.top,
            isBallCarrier: false,
            isOffense: true,
            label: 'QB',
            instant: true,
            scale: tokenScale,
          })
        );

        // Receivers
        const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
        for (const rk of receiverKeys) {
          if (!fallbackFormation[rk]) continue;
          const rPos = fallbackFormation[rk];
          const px = posToPixel(rPos.x, rPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: rk,
              id: rk,
              role: rk,
              x: px.left,
              y: px.top,
              isBallCarrier: false,
              isOffense: true,
              label: rk,
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // Defense tokens (visual only — Base 4-3 default)
        var fallbackDefense = DEFENSES[0].players; // base43
        for (var di = 0; di < fallbackDefense.length; di++) {
          var def = fallbackDefense[di];
          var defPx = posToPixel(def.x, def.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'fallback-def-' + def.id,
              id: def.id,
              role: def.role,
              x: defPx.left,
              y: defPx.top,
              isBallCarrier: false,
              isOffense: false,
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }
      }
    }
  }

  // ---- BALL ----
  const ballScaleStr = tokenScale !== 1 ? ' scale(' + tokenScale + ')' : '';
  let ballElement = null;
  if (isActivePlay) {
    if (state.ballInFlight && state.ballFlightTarget) {
      const targetPx = posToPixel(state.ballFlightTarget.x, state.ballFlightTarget.y);
      ballElement = React.createElement('div', {
        className: 'ball flying',
        style: { left: targetPx.left + 'px', top: targetPx.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    } else if (state.carrier && (state.phase === 'RUNNER' || state.phase === 'CONTACT')) {
      const carrierPx = posToPixel(state.carrierXY.x, state.carrierXY.y);
      ballElement = React.createElement('div', {
        className: 'ball',
        style: { left: carrierPx.left + 'px', top: carrierPx.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    } else if (state.phase === 'DECISION' || state.phase === 'SNAPPING') {
      const qbXY = state.quarterbackXY;
      const qbPx2 = posToPixel(qbXY.x, qbXY.y);
      ballElement = React.createElement('div', {
        className: 'ball',
        style: { left: qbPx2.left + 'px', top: qbPx2.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    }
  }

  // ---- GHOST ROUTES (SVG overlay) ----
  let ghostRouteSVG = null;
  const params = state.difficulty ? DIFFICULTY_PARAMS[state.difficulty] : null;
  if (params && play && formation) {
    const ghostPhases = params.ghostRoutePhases || [];
    let showGhost = false;
    if (state.phase === 'PLAY_SELECT' && ghostPhases.includes('select')) showGhost = true;
    if (state.phase === 'PRESNAP' && ghostPhases.includes('presnap')) showGhost = true;
    if ((state.phase === 'DECISION' || state.phase === 'RUNNER' || state.phase === 'CONTACT') && ghostPhases.includes('play')) showGhost = true;

    if (showGhost && state.receiverWaypoints) {
      const routeLines = [];
      const recKeys = ['W1', 'W2', 'TE', 'RB'];
      for (const rk of recKeys) {
        const wps = state.receiverWaypoints[rk];
        if (!wps || wps.length === 0) continue;

        const startPos = formation[rk];
        if (!startPos) continue;
        const startPx = posToPixel(startPos.x, startPos.y);

        let pathData = 'M ' + startPx.left + ' ' + startPx.top;
        for (let w = 0; w < wps.length; w++) {
          const wp = wps[w];
          // Waypoints are already absolute (startPos was added in SELECT_PLAY)
          const wpPx = posToPixel(wp.x, wp.y);
          pathData += ' L ' + wpPx.left + ' ' + wpPx.top;
        }

        const isDecoy = play.routes[rk] === 'block' || play.routes[rk] === 'check';
        const routeColor = isDecoy ? 'rgba(120,130,255,0.6)' : 'rgba(0,220,255,0.9)';

        routeLines.push(
          React.createElement('path', {
            key: 'route-' + rk,
            d: pathData,
            className: 'ghost-route' + (isDecoy ? ' decoy' : ''),
            stroke: routeColor,
            strokeWidth: 3,
            fill: 'none',
          })
        );
      }

      if (routeLines.length > 0) {
        ghostRouteSVG = React.createElement('svg', {
          className: 'route-overlay',
          style: { width: '100%', height: totalFieldHeight + 'px' },
        }, routeLines);
      }
    }
  }

  // Preview ghost routes during PLAY_SELECT when a play card is expanded
  // (before SELECT_PLAY fires, so receiverWaypoints don't exist yet)
  if (canRenderTokens && !ghostRouteSVG && state.phase === 'PLAY_SELECT' && state.expandedPlayId) {
    const previewPlay = PLAYS.find(p => p.id === state.expandedPlayId);
    if (previewPlay) {
      const previewFormation = previewPlay.formation;
      const previewRouteLines = [];
      const recKeys = ['W1', 'W2', 'TE', 'RB'];

      for (const rk of recKeys) {
        const route = previewPlay.routes[rk];
        const startPos = previewFormation[rk];
        if (!startPos || !route) continue;

        // Generate waypoints on-the-fly (same logic as SELECT_PLAY)
        const routeWP = buildRoute(route, startPos.x, startPos.y);
        const absoluteWP = routeWP.map(function(wp) {
          return {
            x: Math.max(2, Math.min(98, startPos.x + wp.x)),
            y: Math.min(110, startPos.y + wp.y)
          };
        });

        const startPx = posToPixel(startPos.x, startPos.y);
        let pathData = 'M ' + startPx.left + ' ' + startPx.top;
        for (let w = 0; w < absoluteWP.length; w++) {
          const wpPx = posToPixel(absoluteWP[w].x, absoluteWP[w].y);
          pathData += ' L ' + wpPx.left + ' ' + wpPx.top;
        }

        const isDecoy = route === 'block' || route === 'check';
        const routeColor = isDecoy ? 'rgba(120,130,255,0.6)' : 'rgba(0,220,255,0.9)';

        previewRouteLines.push(
          React.createElement('path', {
            key: 'preview-route-' + rk,
            d: pathData,
            className: 'ghost-route' + (isDecoy ? ' decoy' : ''),
            stroke: routeColor,
            strokeWidth: 3,
            fill: 'none',
          })
        );
      }

      if (previewRouteLines.length > 0) {
        ghostRouteSVG = React.createElement('svg', {
          className: 'route-overlay',
          style: { width: '100%', height: totalFieldHeight + 'px' },
        }, previewRouteLines);
      }
    }
  }

  // ---- OPENNESS LABELS (during DECISION) ----
  const opennessLabels = [];
  if (state.phase === 'DECISION') {
    const recKeys = ['W1', 'W2', 'TE', 'RB'];
    for (const rk of recKeys) {
      const rp = state.currentReceiverPos[rk];
      if (!rp) continue;
      // Skip blockers
      if (play && (play.routes[rk] === 'block')) continue;

      const openness = calculateReceiverOpenness(rp, state.currentDefenderPos, state.difficulty);
      const px = posToPixel(rp.x, rp.y);

      opennessLabels.push(
        React.createElement('div', {
          key: 'open-' + rk,
          style: {
            position: 'absolute',
            left: px.left + 'px',
            top: (px.top - 22) + 'px',
            transform: 'translateX(-50%)',
            background: 'rgba(0,0,0,0.7)',
            color: openness.color,
            fontSize: '10px',
            fontWeight: 'bold',
            padding: '2px 6px',
            borderRadius: '4px',
            whiteSpace: 'nowrap',
            zIndex: 12,
            pointerEvents: 'none',
          }
        }, rk + ': ' + openness.label)
      );
    }
  }

  // ---- RUN ARROWS (during RUNNER) ----
  let runArrowElements = null;
  if (state.phase === 'RUNNER' && state.carrierXY) {
    const arrows = generateRunArrows(state.carrierXY, state.currentDefenderPos);
    const arrowEls = [];
    const carrierPx = posToPixel(state.carrierXY.x, state.carrierXY.y);

    for (let i = 0; i < arrows.length; i += 3) {
      const arrow = arrows[i];
      const arrowColor = arrow.quality === 'good' ? '#22c55e' :
                          arrow.quality === 'ok' ? '#eab308' : '#ef4444';
      const length = 20;
      const endX = carrierPx.left + Math.sin(arrow.angle * Math.PI / 180) * length;
      const endY = carrierPx.top - Math.cos(arrow.angle * Math.PI / 180) * length;

      arrowEls.push(
        React.createElement('line', {
          key: 'arrow-' + i,
          x1: carrierPx.left,
          y1: carrierPx.top,
          x2: endX,
          y2: endY,
          stroke: arrowColor,
          strokeWidth: 2,
          opacity: 0.6,
        })
      );
    }

    if (arrowEls.length > 0) {
      runArrowElements = React.createElement('svg', {
        className: 'route-overlay',
        style: { width: '100%', height: totalFieldHeight + 'px', pointerEvents: 'none' },
      }, arrowEls);
    }
  }

  // ---- FIELD ALERT ----
  let alertElement = null;
  if (state.fieldAlert) {
    alertElement = React.createElement('div', {
      className: 'alert-toast',
    }, state.fieldAlert);
  }

  // ---- OL MATCHUP INTEGRITY DOTS ----
  const olDots = [];
  if ((state.phase === 'DECISION' || state.phase === 'SNAPPING') && state.holdTimeData.length > 0) {
    for (let i = 0; i < Math.min(5, state.holdTimeData.length); i++) {
      const m = state.holdTimeData[i];
      const dotColor = m.integrity > 60 ? '#22c55e' : (m.integrity > 25 ? '#eab308' : '#ef4444');

      // Position dots below each OL player
      if (formation && formation.OL[i]) {
        const olPx = posToPixel(formation.OL[i].x, formation.OL[i].y);
        olDots.push(
          React.createElement('div', {
            key: 'oldot-' + i,
            style: {
              position: 'absolute',
              left: olPx.left + 'px',
              top: (olPx.top + 16) + 'px',
              width: '6px',
              height: '6px',
              borderRadius: '50%',
              background: dotColor,
              transform: 'translateX(-50%)',
              zIndex: 11,
              pointerEvents: 'none',
            }
          })
        );
      }
    }
  }

  // ---- POCKET COLLAPSE WARNING ----
  let pocketWarningText = null;
  if (state.phase === 'DECISION' && state.holdTimeData.length > 0) {
    const currentPocket = getPocketPercent(state.holdTimeData, state.currentPhase);
    const warning = getPocketWarning(currentPocket, state.holdTimeData);
    if (warning.text) {
      const qbPxW = posToPixel(state.quarterbackXY.x, state.quarterbackXY.y);
      const warnColor = warning.level === 'critical' ? '#ef4444' :
                        warning.level === 'red' ? '#f97316' : '#eab308';
      pocketWarningText = React.createElement('div', {
        style: {
          position: 'absolute',
          left: qbPxW.left + 'px',
          top: (qbPxW.top + 24) + 'px',
          transform: 'translateX(-50%)',
          color: warnColor,
          fontSize: '11px',
          fontWeight: 'bold',
          whiteSpace: 'nowrap',
          zIndex: 12,
          pointerEvents: 'none',
          textShadow: '0 0 4px rgba(0,0,0,0.8)',
          animation: 'pulse 1s ease-in-out infinite',
        }
      }, warning.text);
    }
  }

  // ---- DOWN & DISTANCE HUD ----
  var isOverlayPhase = ['DECISION', 'RUNNER', 'CONTACT', 'RPO_READ', 'FOURTH_DOWN'].indexOf(state.phase) !== -1;
  const downDistHud = React.createElement('div', {
    className: 'hud-compact',
    style: {
      position: 'absolute',
      bottom: isOverlayPhase ? undefined : 0,
      top: isOverlayPhase ? 0 : undefined,
      left: 0,
      right: 0,
      background: 'rgba(0,0,0,0.85)',
      padding: '6px 10px',
      fontSize: '13px',
      zIndex: 15,
    }
  },
    React.createElement('span', { style: { color: '#f5a623', fontWeight: 'bold' } },
      formatDown(state.down, state.dist, state.ballPos)
    ),
    React.createElement('span', { style: { color: '#aaa' } },
      ' at ' + formatFieldPosition(state.ballPos)
    ),
    (state.phase === 'RUNNER' && state.carrier) ?
      React.createElement('span', { style: { color: '#84cc16', marginLeft: '10px' } },
        state.carrier + ' | Moves: ' + state.runMoves + (state.isYAC ? ' (YAC ' + state.yacMoves + ')' : '')
      ) : null,
    state.phase === 'DECISION' ?
      React.createElement('span', { style: { color: '#84cc16', marginLeft: '10px' } },
        'Actions: ' + state.currentPhase
      ) : null
  );

  // ---- DEFENSE LABEL BADGE ----
  let defBadge = null;
  if (isActivePlay && state.chosenDefense) {
    const defObj = DEFENSES.find(d => d.id === state.chosenDefense);
    defBadge = React.createElement('div', {
      style: {
        position: 'absolute',
        top: '4px',
        left: '50%',
        transform: 'translateX(-50%)',
        background: 'rgba(180,30,30,0.85)',
        color: '#fff',
        fontSize: '11px',
        fontWeight: 'bold',
        padding: '2px 8px',
        borderRadius: '4px',
        zIndex: 16,
      }
    }, 'DEF: ' + (defObj ? defObj.name : state.chosenDefense));
  }

  // ---- CONTACT SCREEN FLASH ----
  const isContact = state.phase === 'CONTACT';

  // ---- ASSEMBLE FIELD ----
  const fieldChildren = [
    ...turfBands,
    oppEndzone,
    ownEndzone,
    ...yardLines,
    ...hashMarks,
    ...yardNumbers,
    midfieldLogo,
    ...goalPosts,
    losLine,
    firstDownMarker,
    ghostRouteSVG,
    ...playerTokens,
    ballElement,
    ...opennessLabels,
    runArrowElements,
    ...olDots,
    pocketWarningText,
  ];

  const fieldContainer = React.createElement('div', {
    ref: fieldScrollRef,
    className: 'field-container' + (instantCam ? ' instant-cam' : ''),
    style: {
      width: '100%',
      height: totalFieldHeight + 'px',
      position: 'relative',
    }
  }, ...fieldChildren);

  return React.createElement('div', {
    ref: viewportRef,
    className: 'field-viewport' + (isContact ? ' contact-screen' : '') + (['DECISION', 'RUNNER', 'CONTACT'].indexOf(state.phase) !== -1 ? ' overlay-active' : ''),
  },
    fieldContainer,
    downDistHud,
    defBadge,
    alertElement
  );
}

}

  const defObj = DEFENSES.find(function(d) { return d.id === state.chosenDefense; });
  const matchupRating = play ? getMatchupRating(play.id, state.chosenDefense) : 0;

  let matchupTag = null;
  if (state.difficulty === 'practice') {
    // No rating tags in practice, just coach advice
  } else if (state.difficulty === 'preseason') {
    const labels = [
      { min: 2, text: 'Great call!', color: '#22c55e' },
      { min: 1, text: 'Good call', color: '#84cc16' },
      { min: 0, text: 'Decent look', color: '#eab308' },
      { min: -1, text: 'Careful', color: '#f97316' },
      { min: -Infinity, text: 'BAD call', color: '#ef4444' }

// ============================================================
// 6. DECISION SCREEN
// ============================================================
function DecisionScreen({ state, dispatch }) {
  var play = PLAYS.find(function(p) { return p.id === state.selectedPlayId; });
  var params = DIFFICULTY_PARAMS[state.difficulty];
  var holdData = state.holdTimeData || [];
  var pocketPct = getPocketPercent(holdData, state.currentPhase);
  var pocketOverall = pocketPct.overall !== undefined ? pocketPct.overall : (pocketPct >= 0 ? pocketPct : 100);
  var pocketNum = typeof pocketOverall === 'number' ? pocketOverall : 100;
  var pocketWarn = getPocketWarning(pocketPct, holdData);
  var survivalMode = pocketNum <= 0;

  // Build pocket bar color
  var pocketColor = pocketNum > 60 ? '#22c55e' : (pocketNum > 30 ? '#eab308' : '#ef4444');

  // Calculate receiver openness for each target
  var receiverKeys = ['W1', 'W2', 'TE', 'RB'];
  var targets = [];
  var bestKey = null;
  var bestOpenness = -1;
  var isMuted = state.currentPhase === 0;

  for (var ri = 0; ri < receiverKeys.length; ri++) {
    var rk = receiverKeys[ri];
    var recPos = state.currentReceiverPos[rk];
    if (!recPos) continue;
    if (play && play.routes[rk] === 'block') continue;

    var openness = calculateReceiverOpenness(recPos, state.currentDefenderPos, state.difficulty);
    var throwResult = calculateThrowResult(rk, openness.level, pocketNum, state.currentPhase, state.difficulty);
    var hitPct = Math.round(((throwResult.details ? throwResult.details.completionPct : 0) || 0) * 100);
    var intPct = Math.round(((throwResult.details ? throwResult.details.intChance : 0) || 0) * 100);
    var primaryReceiver = play && play.primary === rk;

    if (openness.level > bestOpenness) {
      bestOpenness = openness.level;
      bestKey = rk;
    }

    targets.push({
      key: rk,
      openness: openness,
      hitPct: hitPct,
      intPct: intPct,
      primaryReceiver: primaryReceiver,
      throwResult: throwResult
    });
  }

  var showBestGlow = params.highlightBestThrow;

  // Target cards - TOP of overlay
  var targetElements = [];
  for (var ti = 0; ti < targets.length; ti++) {
    var t = targets[ti];
    if (survivalMode && t.openness.level === 0) continue;

    var isBest = showBestGlow && t.key === bestKey;
    var isPrimary = t.primaryReceiver;
    var cardStyle = {};

    if (isMuted) {
      // Phase 0: muted grey cards, no openness/percentages, just names
      cardStyle = {
        background: '#1a1a2e', border: '2px solid #444', opacity: 0.6,
        borderRadius: '8px', padding: '10px', cursor: 'pointer', textAlign: 'center',
        transition: 'all 0.3s'
      };
      if (isPrimary) {
        cardStyle.border = '2px solid gold';
        cardStyle.boxShadow = '0 0 8px rgba(255,215,0,0.4)';
        cardStyle.opacity = 0.8;
      }
      targetElements.push(
        React.createElement('div', {
          key: 'tgt-' + t.key,
          className: 'throw-target',
          onClick: function(k) { return function() { dispatch({ type: 'THROW', targetKey: k }); }; }(t.key),
          style: cardStyle
        },
          React.createElement('div', { className: 'tgt-name', style: { color: '#888' } }, t.key)
        )
      );
    } else {
      // Phase 1+: full color with openness and percentages
      var openClass = t.openness.level >= 3 ? 'open-wide' :
                        t.openness.level >= 2 ? 'open-moderate' : 'open-tight';
      cardStyle = {};
      if (isPrimary) {
        cardStyle.border = '2px solid gold';
        cardStyle.boxShadow = '0 0 8px rgba(255,215,0,0.4)' + (isBest ? ', 0 0 12px rgba(59,130,246,0.5)' : '');
      }

      targetElements.push(
        React.createElement('div', {
          key: 'tgt-' + t.key,
          className: 'throw-target ' + openClass + (isBest ? ' best-throw' : ''),
          onClick: function(k) { return function() { dispatch({ type: 'THROW', targetKey: k }); }; }(t.key),
          style: Object.keys(cardStyle).length > 0 ? cardStyle : undefined
        },
          React.createElement('div', { className: 'tgt-name' }, t.key),
          React.createElement('div', {
            style: { color: t.openness.color, fontWeight: 'bold', fontSize: '12px', margin: '4px 0' }
          }, t.openness.label),
          React.createElement('div', { className: 'tgt-detail', style: { fontFamily: 'monospace' } },
            'HIT ' + t.hitPct + '%  INT ' + t.intPct + '%'
          )
        )
      );
    }
  }

  // --- QB ACTION BUTTONS (3 core + escape) ---
  var qbActionRow = [];
  var escapeRow = [];
  var showEscape = pocketNum < 50;

  if (!survivalMode) {
    // Phase-based labels for Drop Back
    var dropBackLabel = 'Drop Back (Run the Play)';
    var dropBackSubtitle = null;
    if (state.currentPhase >= 3) {
      dropBackLabel = 'Hold On!';
      dropBackSubtitle = 'Pocket is shaky -- make a decision soon';
    } else if (state.currentPhase >= 1) {
      dropBackLabel = 'Buy Time';
      dropBackSubtitle = 'Receivers getting open';
    }
    var isPreseason = state.difficulty === 'preseason' || state.difficulty === 'practice';
    var dropBackStyle = { background: '#3b82f6', flex: 2, padding: '10px 8px' };
    if (isPreseason && state.currentPhase === 0) {
      dropBackStyle.boxShadow = '0 0 12px rgba(59,130,246,0.4)';
      dropBackStyle.fontSize = '15px';
    }

    qbActionRow.push(
      React.createElement('button', {
        key: 'dropBack',
        className: 'btn',
        onClick: function() { dispatch({ type: 'QB_ACTION', move: 'dropBack' }); },
        style: dropBackStyle
      },
        React.createElement('div', { style: { fontWeight: 'bold' } }, dropBackLabel),
        dropBackSubtitle ? React.createElement('div', { style: { fontSize: '9px', opacity: 0.7 } }, dropBackSubtitle) : null
      )
    );

    qbActionRow.push(
      React.createElement('button', {
        key: 'stepUp',
        className: 'btn',
        onClick: function() { dispatch({ type: 'QB_ACTION', move: 'stepUp' }); },
        style: { background: '#6366f1', flex: 1, padding: '10px 6px' }
      },
        React.createElement('div', { style: { fontWeight: 'bold' } }, 'Step Up'),
        React.createElement('div', { style: { fontSize: '9px', opacity: 0.7 } }, 'Restore pocket')
      )
    );

    qbActionRow.push(
      React.createElement('button', {
        key: 'wait',
        className: 'btn',
        onClick: function() { dispatch({ type: 'QB_ACTION', move: 'wait' }); },
        style: { background: '#555', flex: 1, padding: '10px 6px' }
      },
        React.createElement('div', { style: { fontWeight: 'bold' } }, 'Wait'),
        React.createElement('div', { style: { fontSize: '9px', opacity: 0.7 } }, 'Hold position')
      )
    );
  }

  // Escape row: Scramble, Throw Away, Tuck — when pocket < 50% (or survival mode)
  if (showEscape || survivalMode) {
    var isEasyMode = state.difficulty === 'preseason' || state.difficulty === 'practice';
    var escapeButtons = isEasyMode ? [
      { label: '\u{1F91C} Tuck (safe)', move: 'tuck', color: '#dc2626' },
      { label: '\u{1F3C3} Scramble (risky!)', move: 'scramble', color: '#16a34a' }
    ] : [
      { label: '\u{1F3C3} Scramble', move: 'scramble', color: '#16a34a' },
      { label: '\u274C Throw Away', move: 'throwAway', color: '#ca8a04' },
      { label: '\u{1F91C} Tuck the Ball', move: 'tuck', color: '#dc2626' }
    ];
    for (var ei = 0; ei < escapeButtons.length; ei++) {
      (function(moveData) {
        escapeRow.push(
          React.createElement('button', {
            key: moveData.move,
            className: 'btn',
            onClick: function() { dispatch({ type: 'QB_ACTION', move: moveData.move }); },
            style: { background: moveData.color, flex: 1 }
          }, moveData.label)
        );
      })(escapeButtons[ei]);
    }
  }

  // --- Contextual suggestions (Change #4): phase >= 4, no receiver better than contested, pocket > 25% ---
  var contextualRow = [];
  if (state.currentPhase >= 4 && pocketNum > 25 && !survivalMode) {
    var allContested = true;
    var bestCheckdown = null;
    var bestCheckdownLevel = -1;
    for (var ci = 0; ci < targets.length; ci++) {
      if (targets[ci].openness.level > 1) { allContested = false; break; }
      if (targets[ci].openness.level > bestCheckdownLevel) {
        bestCheckdownLevel = targets[ci].openness.level;
        bestCheckdown = targets[ci];
      }
    }
    if (allContested && bestCheckdown) {
      var shortLabel = bestCheckdown.key === 'RB' ? 'RB is open underneath' : ('Short pass to ' + bestCheckdown.key);
      contextualRow.push(
        React.createElement('button', {
          key: 'checkdown',
          className: 'btn',
          onClick: function() { dispatch({ type: 'THROW', targetKey: bestCheckdown.key }); },
          style: { background: '#ca8a04', flex: 1, fontSize: '12px' }
        }, shortLabel)
      );
    }
    // Scramble edge check
    var qbX = state.quarterbackXY ? state.quarterbackXY.x : 50;
    var qbY = state.quarterbackXY ? state.quarterbackXY.y : 0;
    var leftEdgeClear = true;
    var rightEdgeClear = true;
    for (var di = 0; di < state.currentDefenderPos.length; di++) {
      var def = state.currentDefenderPos[di];
      if (def.x < 15 && Math.abs(def.y - qbY) < 5) leftEdgeClear = false;
      if (def.x > 85 && Math.abs(def.y - qbY) < 5) rightEdgeClear = false;
    }
    if (rightEdgeClear) {
      contextualRow.push(
        React.createElement('button', {
          key: 'scrambleRight',
          className: 'btn',
          onClick: function() { dispatch({ type: 'QB_ACTION', move: 'scramble' }); },
          style: { background: '#16a34a', flex: 1, fontSize: '12px' }
        }, 'Scramble Right -- edge is open')
      );
    } else if (leftEdgeClear) {
      contextualRow.push(
        React.createElement('button', {
          key: 'scrambleLeft',
          className: 'btn',
          onClick: function() { dispatch({ type: 'QB_ACTION', move: 'scramble' }); },
          style: { background: '#16a34a', flex: 1, fontSize: '12px' }
        }, 'Scramble Left -- edge is open')
      );
    }
  }

  return React.createElement('div', { className: 'decision-panel', style: { position: 'relative', zIndex: 20 } },
    // Pocket bar
    React.createElement('div', { className: 'pocket-bar-container' },
      React.createElement('span', { className: 'pocket-label' }, 'Pocket'),
      React.createElement('div', { className: 'pocket-bar-bg' },
        React.createElement('div', {
          className: 'pocket-bar-fill',
          style: { width: Math.max(0, Math.min(100, pocketNum)) + '%', background: pocketColor }
        })
      ),
      React.createElement('span', { style: { fontSize: '11px', color: pocketColor, minWidth: '32px', textAlign: 'right' } },
        Math.round(pocketNum) + '%'
      )
    ),
    pocketWarn.text ? React.createElement('div', {
      style: { color: '#ef4444', fontSize: '12px', fontWeight: 'bold', textAlign: 'center', margin: '4px 0' }
    }, pocketWarn.text) : null,
    survivalMode ? React.createElement('div', {
      style: { color: '#ef4444', fontSize: '13px', fontWeight: 'bold', textAlign: 'center', margin: '6px 0', animation: 'pulse 0.8s ease-in-out infinite' }
    }, '\u26A0 POCKET COLLAPSED \u2014 Escape now!') : null,
    // Receiver cards at TOP
    React.createElement('div', { className: 'targets-grid', style: { marginBottom: '8px' } }, targetElements),
    // QB action buttons BELOW receivers
    qbActionRow.length > 0 ? React.createElement('div', { className: 'action-buttons', style: { marginBottom: '6px' } }, qbActionRow) : null,
    // Contextual suggestions
    contextualRow.length > 0 ? React.createElement('div', { className: 'action-buttons', style: { marginBottom: '6px' } }, contextualRow) : null,
    // Escape row at bottom
    escapeRow.length > 0 ? React.createElement('div', { className: 'action-buttons' }, escapeRow) : null
  );
}

  const boxCount = defObj ? defObj.players.filter(function(p) {
    return p.y <= 8 && p.x >= 25 && p.x <= 75;
  }).length : 5;
  const gapOpen = boxCount <= 7;

  // Calculate success chances based on gap status
  const handoffBase = gapOpen ? 70 : 35;
  let keepBase = gapOpen ? 50 : 60;
  if (state.chosenDefense === 'blitz') keepBase = 25;
  const passBase = gapOpen ? 60 : 75;

  const isYAC = state.isYAC;
  const moveCounter = isYAC
    ? 'YAC Move #' + (state.yacMoves + 1)
    : 'Run Move #' + (state.runMoves + 1);

  // Nearest defender info
  const nearestDef = findNearestDefender(state.carrierXY, state.currentDefenderPos);
  let defWarning = null;
  if (nearestDef) {
    const dist = nearestDef.distance;
    const defColor = dist < 2 ? '#ef4444' : (dist < 4 ? '#eab308' : '#22c55e');
    defWarning = React.createElement('div', {
      style: { textAlign: 'center', fontSize: '12px', color: defColor, marginBottom: '6px' }

  const runButtons = [];

    const runResult = calculateRunSuccess(ml.type, state.carrierXY, state.currentDefenderPos, state.runMoves);
    const successPct = Math.round((runResult.rate || 0.5) * 100);

    (function(moveData, idx, pct) {

          sprintStamina = '\u26A1 ';

          disabled: sprintFatigued,
          style: {
            background: sprintFatigued ? '#555' : moveColors[idx % 4], flex: 1, padding: '8px 4px', textAlign: 'center', minWidth: '45%',
            opacity: sprintFatigued ? 0.5 : 1,
            cursor: sprintFatigued ? 'not-allowed' : 'pointer',
            position: 'relative'

        },
          React.createElement('div', { style: { fontWeight: 'bold', fontSize: '14px' } }, btnLabel),
          React.createElement('div', { style: { fontSize: '10px', opacity: 0.8 } },
            sprintFatigued ? 'Gassed' : pct + '% | ' + moveData.description
          )
        )
      );
      // Add Run button alongside when Sprint is fatigued
      if (sprintFatigued) {
        var runResult2 = calculateRunSuccess('HitTheHole', state.carrierXY, state.currentDefenderPos, state.runMoves, state.difficulty);
        var runPct = Math.round((runResult2.rate || 0.5) * 100);
        runButtons.push(

            onClick: function() { dispatch({ type: 'RUNNER_MOVE', moveType: 'HitTheHole' }); },

            React.createElement('div', { style: { fontWeight: 'bold', fontSize: '14px' } }, '\uD83C\uDFC3 Run'),
            React.createElement('div', { style: { fontSize: '10px', opacity: 0.8 } }, runPct + '% | Push forward')
          )

    })(ml, mi, successPct);

  return React.createElement('div', { style: { padding: '8px', position: 'relative', zIndex: 20 } },

    state.isYAC ? React.createElement('div', {

function ContactScreen({ state, dispatch }) {
  const carrierKey = state.carrier || 'RB';
  const contactDef = state.contactDefenderId || 'DEF';
  const tackles = state.tacklesBroken;

  const contactMoves = [
    {
      label: '\u{1F300} Spin Move', type: 'spin',
      color: '#a855f7'
    },
    {
      label: '\u{1F4A8} Juke', type: 'juke',
      color: '#3b82f6'
    },
    {
      label: '\u{1F91A} Stiff Arm', type: 'stiffArm',
      color: '#f97316'
    },
    {
      label: '\u{2B07}\u{FE0F} Dive Forward', type: 'diveForward',
      color: '#22c55e'
    }
  ];

  // Calculate break/fumble chances for each
  const moveButtons = [];
  for (let ci = 0; ci < contactMoves.length; ci++) {
    const cm = contactMoves[ci];
    let internalType = cm.type;
    if (cm.type === 'spin') internalType = 'Spin';
    if (cm.type === 'juke') internalType = 'Juke';
    if (cm.type === 'stiffArm') internalType = 'StiffArm';
    if (cm.type === 'diveForward') internalType = 'DiveForward';

    const contactResult = resolveContact(internalType, carrierKey, tackles, state.difficulty);
    const breakPct = Math.round((contactResult.breakChance || 0) * 100);
    const fumblePct = Math.round((contactResult.fumbleChance || 0) * 100);

    const isDive = cm.type === 'diveForward';

    (function(moveData, breakP, fumbleP, dive) {
      moveButtons.push(
        React.createElement('button', {
          key: 'ct-' + moveData.type,
          className: 'btn',
          onClick: function() { dispatch({ type: 'CONTACT_MOVE', moveType: moveData.type }); },
          style: { background: moveData.color, flex: 1, padding: '8px 4px', textAlign: 'center', minWidth: '45%' }
        },
          React.createElement('div', { style: { fontWeight: 'bold', fontSize: '13px' } }, moveData.label),
          React.createElement('div', { style: { fontSize: '10px', opacity: 0.8, fontFamily: 'monospace' } },
            dive ? '+1-3 yards, SAFE' : 'Break ' + breakP + '% | Fumble ' + fumbleP + '%'
          )
        )
      );
    })(cm, breakPct, fumblePct, isDive);
  }

  return React.createElement('div', {
    style: { padding: '8px', position: 'relative', zIndex: 20 }
  },
    React.createElement('div', {
      style: {
        textAlign: 'center', fontWeight: 'bold', fontSize: '20px', color: '#ef4444',
        marginBottom: '6px', animation: 'contactPulse 0.5s ease-in-out'
      }
    }, '\u{1F4A5} CONTACT!'),
    React.createElement('div', {
      style: { textAlign: 'center', fontSize: '12px', color: '#aaa', marginBottom: '8px' }
    }, 'Defender: ' + contactDef + ' | Tackles broken: ' + tackles),
    React.createElement('div', {
      style: { display: 'flex', flexWrap: 'wrap', gap: '8px' }
    }, moveButtons)
  );
}

// 10. RESULT SCREEN
// ============================================================
function ResultScreen({ state, dispatch }) {
  const result = state.lastResult;
  const yards = result ? result.yards : 0;

  // Determine color class
  let barClass = 'result-bar ';
  if (result && result.turnover) barClass += 'negative';
  else if (yards < 0) barClass += 'negative';
  else if (yards === 0 && result && result.type === 'incomplete') barClass += 'neutral';
  else if (yards >= 10) barClass += 'positive';
  else barClass += 'neutral';

  // Coaching debrief for practice/preseason
  let debriefText = null;
  if (state.difficulty === 'practice' || state.difficulty === 'preseason') {
    if (result && result.turnover) {
      debriefText = 'Turnovers are costly. Look for safer options when coverage is tight.';
    } else if (yards >= 10) {
      debriefText = 'Great play! Reading the defense correctly pays off with big gains.';
    } else if (yards <= 0) {
      debriefText = 'Sometimes the defense wins. Consider the matchup next time.';
    } else {
      debriefText = 'A solid gain. Keep making smart reads and building drives.';
    }
  }

  return React.createElement('div', { style: { padding: '8px', position: 'relative', zIndex: 20 } },
    React.createElement('div', { className: barClass },
      state.resultText || (yards > 0 ? 'Gain of ' + yards + ' yards.' : yards < 0 ? 'Loss of ' + Math.abs(yards) + ' yards.' : 'No gain.')
    ),
    debriefText ? React.createElement('div', {
      style: { color: '#84cc16', fontSize: '12px', fontStyle: 'italic', textAlign: 'center', margin: '6px 0' }
    }, debriefText) : null,
    React.createElement('button', {
      className: 'btn btn-primary',
      onClick: function() { dispatch({ type: 'NEXT_PLAY' }); },
      style: { width: '100%', marginTop: '8px', padding: '14px', fontSize: '16px' }

}

// ============================================================
// 13. TOUCHDOWN SCREEN
// ============================================================
function TouchdownScreen({ state, dispatch }) {
  var result = state.lastResult;
  var description = state.resultText || 'TOUCHDOWN!';
  var colors = ['gold', '#ef4444', '#3b82f6', '#22c55e', '#f97316'];

  // Score countup
  var countState = React.useState(0);
  var count = countState[0];
  var setCount = countState[1];
  var countRef = React.useRef(0);
  React.useEffect(function() {
    var id = setInterval(function() {
      countRef.current = countRef.current + 1;
      setCount(countRef.current);
      if (countRef.current >= 7) clearInterval(id);
    }, 85);
    return function() { clearInterval(id); };
  }, []);

  // Multi-burst fireworks (3 clusters)
  var fireworks = [];
  var bursts = [
    { left: '20%', top: '25%', particles: 18, delay: 0 },
    { left: '40%', top: '20%', particles: 18, delay: 0.3 },
    { left: '60%', top: '30%', particles: 18, delay: 0.6 },
    { left: '80%', top: '25%', particles: 18, delay: 0.9 },
    { left: '50%', top: '15%', particles: 18, delay: 1.2 }
  ];
  for (var bi = 0; bi < bursts.length; bi++) {
    var burst = bursts[bi];
    for (var pi = 0; pi < burst.particles; pi++) {
      var angle = (pi / burst.particles) * 360 + Math.random() * 30;
      var dist = 50 + Math.random() * 40;
      var dx = Math.cos(angle * Math.PI / 180) * dist;
      var dy = Math.sin(angle * Math.PI / 180) * dist;
      var size = 8 + Math.floor(Math.random() * 10);
      fireworks.push(
        React.createElement('div', {
          key: 'fw-' + bi + '-' + pi,
          className: 'firework',
          style: {
            '--dx': dx + 'px', '--dy': dy + 'px',
            background: colors[Math.floor(Math.random() * colors.length)],
            left: burst.left, top: burst.top,
            width: size + 'px', height: size + 'px',
            animationDelay: (burst.delay + pi * 0.06) + 's'
          }
        })
      );
    }
  }

  var scoreStyle = { fontSize: '28px', fontWeight: 'bold', color: '#22c55e', margin: '12px 0' };
  if (count >= 7) {
    scoreStyle.animation = 'scoreCountPulse 0.3s ease';
  }

  return React.createElement('div', { className: 'overlay-screen td-flash' },
    fireworks,
    React.createElement('div', { className: 'overlay-card' },
      React.createElement('div', { style: { fontSize: '60px', marginBottom: '10px' } }, '\u{1F3C8}'),
      React.createElement('div', { className: 'td-text' }, 'TOUCHDOWN!'),

// 20. PRACTICE OVERLAY
// ============================================================
function PracticeOverlay({ state, dispatch }) {
  if (state.difficulty !== 'practice') return null;

  // Determine which hint to show based on phase
  var overlayId = null;
  if (state.phase === 'MENU' && !state.overlaysSeen.welcome) overlayId = 'welcome';
  else if (state.phase === 'PLAY_SELECT' && !state.overlaysSeen.playSelect) overlayId = 'playSelect';
  else if (state.phase === 'PRESNAP' && !state.overlaysSeen.presnap) overlayId = 'presnap';
  else if (state.phase === 'DECISION' && !state.overlaysSeen.pocket) overlayId = 'pocket';
  else if ((state.phase === 'RUNNER' || state.phase === 'CONTACT') && !state.overlaysSeen.runAfterCatch) overlayId = 'runAfterCatch';
  else if (state.phase === 'DEFENSIVE_POSTURE' && !state.overlaysSeen.defense) overlayId = 'defense';

  if (!overlayId) return null;

  var overlayData = PRACTICE_OVERLAYS[overlayId];
  if (!overlayData) return null;

  // Auto-dismiss: any game-advancing action in the reducer clears this
  // Teaching hint: small translucent text at top of field, no button
  return React.createElement('div', {
    style: {
      position: 'fixed', top: '56px', left: '50%', transform: 'translateX(-50%)',
      maxWidth: '420px', width: '90%', zIndex: 210,
      background: 'rgba(0,0,20,0.20)', borderRadius: '8px', padding: '10px 14px',
      color: 'rgba(255,255,255,0.7)', fontSize: '13px', lineHeight: '1.4',
      pointerEvents: 'none', textAlign: 'center',
      animation: 'fadeIn 0.4s ease'
    }
  },
    React.createElement('span', { style: { fontWeight: 'bold', color: 'rgba(59,130,246,0.8)' } }, overlayData.title + ' '),
    overlayData.text
  );
}

// 22. APP COMPONENT
// ============================================================
function App() {
  const [state, dispatch] = React.useReducer(gameReducer, INITIAL_STATE);

  // SNAPPING phase timer: dispatch SNAP_COMPLETE after 1200ms
  React.useEffect(function() {
    if (state.phase === 'SNAPPING' && !state.isPaused) {
      const timer = setTimeout(function() {
        dispatch({ type: 'SNAP_COMPLETE' });
      }, 1200);
      return function() { clearTimeout(timer); };
    }
  }, [state.phase, state.isPaused]);

  // CPU_DRIVING phase: resolve drive on first tick, then step through plays
  React.useEffect(function() {
    if (state.phase === 'CPU_DRIVING' && !state.isPaused) {
      if (!state.cpuDrivePlays || state.cpuDrivePlays.length === 0) {
        // First tick: resolve the drive to generate plays
        var timer = setTimeout(function() {
          dispatch({ type: 'RESOLVE_CPU_DRIVE' });
        }, 400);
        return function() { clearTimeout(timer); };
      } else {
        // Subsequent ticks: step through plays
        var timer2 = setTimeout(function() {
          dispatch({ type: 'CPU_DRIVE_NEXT_PLAY' });
        }, 800);
        return function() { clearTimeout(timer2); };
      }
    }
  }, [state.phase, state.isPaused, state.cpuDrivePlayIndex, state.cpuDrivePlays]);

  // Commentary stays until player dismisses — no auto-dismiss timer

  // THROW_RESOLVE: after ball flight animation (600ms)
  React.useEffect(function() {
    if (state.ballInFlight && state.ballFlightTarget && !state.isPaused && state.phase !== 'KICK_FLIGHT') {
      const timer = setTimeout(function() {
        dispatch({ type: 'THROW_RESOLVE' });
      }, 600);
      return function() { clearTimeout(timer); };
    }
  }, [state.ballInFlight, state.ballFlightTarget, state.isPaused, state.phase]);

  // KICK_FLIGHT: ball flight animation delay (1200ms)
  React.useEffect(function() {
    if (state.phase === 'KICK_FLIGHT' && !state.isPaused) {
      var timer = setTimeout(function() {
        dispatch({ type: 'KICK_RESOLVE' });
      }, 1200);
      return function() { clearTimeout(timer); };
    }
  }, [state.phase, state.isPaused]);

  // ANIMATION_TICK: 200ms interval during active play phases
  React.useEffect(function() {
    const tickPhases = ['RUNNER', 'CONTACT'];
    if (tickPhases.includes(state.phase) && !state.isPaused) {
      const tickInterval = setInterval(function() {
        dispatch({ type: 'ANIMATION_TICK' });
      }, 200);
      return function() { clearInterval(tickInterval); };
    }
  }, [state.phase, state.isPaused]);

  const phase = state.phase;

  // Render based on phase
  const children = [];

  if (phase === 'TITLE') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(TitleScreen, { dispatch: dispatch })
    );
  }

  if (phase === 'COIN_TOSS' || phase === 'COIN_TOSS_CHOICE') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(CoinTossScreen, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'HALFTIME') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(HalftimeScreen, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'QUARTER_CHANGE') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(QuarterChangeScreen, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'GAME_OVER') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(GameOverScreen, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'DEFENSIVE_POSTURE') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(Scoreboard, { state: state, dispatch: dispatch }),
      React.createElement('div', { style: { marginTop: '52px' } },
        React.createElement(DefensivePostureScreen, { state: state, dispatch: dispatch })
      ),
      React.createElement(PracticeOverlay, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'CPU_DRIVING') {
    var cpuPlayIdx = state.cpuDrivePlayIndex || 0;
    var cpuPlays = state.cpuDrivePlays || [];
    var visiblePlays = [];
    for (var cpi = 0; cpi <= cpuPlayIdx && cpi < cpuPlays.length; cpi++) {
      visiblePlays.push(cpuPlays[cpi]);
    }
    if (visiblePlays.length === 0) visiblePlays.push('Opponent driving...');
    return React.createElement('div', { className: 'game-container' },
      React.createElement(Scoreboard, { state: state, dispatch: dispatch }),
      React.createElement('div', {
        style: {
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          height: 'calc(100vh - 60px)', textAlign: 'center', padding: '0 20px'
        }
      },
        React.createElement('div', {
          style: { color: '#ef4444', fontSize: '14px', fontWeight: 'bold', marginBottom: '12px', opacity: 0.7 }
        }, 'OPPONENT POSSESSION'),
        React.createElement('div', {
          style: { display: 'flex', flexDirection: 'column', gap: '6px', maxHeight: '60vh', overflowY: 'auto' }
        },
          visiblePlays.map(function(playText, pi) {
            var isLatest = pi === visiblePlays.length - 1;
            return React.createElement('div', {
              key: 'cpuplay-' + pi,
              style: {
                color: isLatest ? '#fbbf24' : '#888',
                fontSize: isLatest ? '18px' : '14px',
                fontWeight: isLatest ? 'bold' : 'normal',
                animation: isLatest ? 'fadeIn 0.3s ease-in' : 'none',
                fontFamily: 'monospace'
              }
            }, playText);
          })
        )
      )
    );
  }

  if (phase === 'CPU_RESULT') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(Scoreboard, { state: state, dispatch: dispatch }),
      React.createElement(CPUResultScreen, { state: state, dispatch: dispatch })
    );
  }

  if (phase === 'TWO_PLAYER_DEF') {
    return React.createElement('div', { className: 'game-container' },
      React.createElement(TwoPlayerDefScreen, { state: state, dispatch: dispatch })
    );
  }

  // All other phases: Scoreboard + GameField + phase-specific panel
  let panelContent = null;

  switch (phase) {
    case 'MENU':
      panelContent = React.createElement(MenuScreen, { state: state, dispatch: dispatch });
      break;
    case 'PLAY_SELECT':
      panelContent = React.createElement(PlaySelectScreen, { state: state, dispatch: dispatch });
      break;
    case 'PRESNAP':
      panelContent = React.createElement(PresnapScreen, { state: state, dispatch: dispatch });
      break;
    case 'SNAPPING':
      panelContent = React.createElement('div', {
        style: {
          textAlign: 'center', padding: '20px', fontSize: '24px', fontWeight: 'bold',
          color: '#f5a623', animation: 'pulse 0.6s ease-in-out infinite'
        }
      }, '\u{1F3C8} SNAP! Ball is in play...');
      break;
    case 'DECISION':
      panelContent = React.createElement(DecisionScreen, { state: state, dispatch: dispatch });
      break;
    case 'RPO_READ':
      panelContent = React.createElement(RPOScreen, { state: state, dispatch: dispatch });
      break;
    case 'RUNNER':
      panelContent = React.createElement(RunnerScreen, { state: state, dispatch: dispatch });
      break;
    case 'CONTACT':
      panelContent = React.createElement(ContactScreen, { state: state, dispatch: dispatch });
      break;
    case 'KICK_FLIGHT':
      panelContent = React.createElement('div', {
        style: {
          textAlign: 'center', padding: '20px', fontSize: '24px', fontWeight: 'bold',
          color: '#f5a623', animation: 'pulse 0.6s ease-in-out infinite'
        }
      }, '\uD83C\uDFC8 KICK IS UP...');
      break;
    case 'RESULT':
      panelContent = React.createElement(ResultScreen, { state: state, dispatch: dispatch });
      break;
    case 'TOUCHDOWN':
      return React.createElement('div', { className: 'game-container' },
        React.createElement(Scoreboard, { state: state, dispatch: dispatch }),
        React.createElement(GameField, { state: state, dispatch: dispatch }),
        React.createElement(TouchdownScreen, { state: state, dispatch: dispatch }),
        React.createElement(PracticeOverlay, { state: state, dispatch: dispatch }),
        React.createElement('button', {
          onClick: function() { dispatch({ type: 'TOGGLE_PAUSE' }); },
          style: {
            position: 'fixed', top: '10px', right: '10px', zIndex: 150,
            background: 'rgba(0,0,0,0.6)', border: '1px solid #555', borderRadius: '6px',
            color: '#aaa', fontSize: '18px', padding: '4px 10px', cursor: 'pointer', lineHeight: '1'
          }
        }, '\u2630'),
        React.createElement(PauseMenuOverlay, { state: state, dispatch: dispatch }),
        state.showNoteToPlayers ? React.createElement(NoteToPlayersScreen, { dispatch: dispatch }) : null
      );
    case 'FOURTH_DOWN':
      panelContent = React.createElement(FourthDownScreen, { state: state, dispatch: dispatch });
      break;
    default:
      panelContent = React.createElement('div', { style: { padding: '20px', color: '#888' } }, 'Unknown phase: ' + phase);
  }

  // Menu button (visible during gameplay, top-right)
  const menuBtn = React.createElement('button', {
    onClick: function() { dispatch({ type: 'TOGGLE_PAUSE' }); },
    style: {
      position: 'fixed', top: '10px', right: '10px', zIndex: 150,
      background: 'rgba(0,0,0,0.6)', border: '1px solid #555', borderRadius: '6px',
      color: '#aaa', fontSize: '18px', padding: '4px 10px', cursor: 'pointer',
      lineHeight: '1'
    }
  }, '\u2630');

  var isOverlayPhase = (phase === 'DECISION' || phase === 'RUNNER' || phase === 'CONTACT' || phase === 'RPO_READ' || phase === 'FOURTH_DOWN');

  return React.createElement('div', { className: 'game-container' },
    React.createElement(Scoreboard, { state: state, dispatch: dispatch }),
    isOverlayPhase
      ? React.createElement('div', {
          style: { position: 'relative', width: '100%' }
        },
          React.createElement(GameField, { state: state, dispatch: dispatch }),
          state.showCommentary ? React.createElement(CommentaryOverlay, { state: state, dispatch: dispatch }) : null,
          React.createElement('div', { className: 'overlay-panel' }, panelContent)
        )
      : React.createElement('div', {
          style: { position: 'relative', width: '100%' }
        },
          React.createElement(GameField, { state: state, dispatch: dispatch }),
          state.showCommentary ? React.createElement(CommentaryOverlay, { state: state, dispatch: dispatch }) : null,
          panelContent
        ),
    state.coachAdvice && phase !== 'PRESNAP' ? React.createElement(CoachAdvice, { state: state }) : null,
    React.createElement(PracticeOverlay, { state: state, dispatch: dispatch }),
    menuBtn,
    React.createElement(PauseMenuOverlay, { state: state, dispatch: dispatch }),
    state.showNoteToPlayers ? React.createElement(NoteToPlayersScreen, { dispatch: dispatch }) : null
  );
}

// ============================================================
// 23. RENDER CALL
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

</script>
</body>
