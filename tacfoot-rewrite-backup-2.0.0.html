      // Clamp carrier X
      newCarrierXY.x = Math.max(1, Math.min(99, newCarrierXY.x));

      // Check out of bounds
      if (newCarrierXY.x <= 1 || newCarrierXY.x >= 99) {
        const totalYards = Math.round(newCarrierXY.y);
        const playName = play ? play.name : 'run';
        const defName = state.chosenDefense || 'base43';
        const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
        const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          lastResult: { type: 'run', yards: totalYards, turnover: false },
          resultText: 'Out of bounds! Gain of ' + totalYards + ' yards.',
          resultColor: totalYards >= 5 ? '#22c55e' : '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
        };
      }

      // Check touchdown
      const absoluteY = state.ballPos + newCarrierXY.y;
      if (absoluteY >= 100) {
        const totalYards = 100 - state.ballPos;
        const playName = play ? play.name : 'play';
        const defName = state.chosenDefense || 'base43';
        const comm = pickCommentary('touchdown', { play: playName, def: defName, yards: totalYards });
        return {
          ...state,
          phase: 'TOUCHDOWN',
          carrierXY: newCarrierXY,
          lastResult: { type: 'touchdown', yards: totalYards, turnover: false },
          resultText: 'TOUCHDOWN!',
          resultColor: 'gold',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      // Check safety (carrier pushed back into own endzone)
      if (absoluteY <= 0) {
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
          resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
          resultColor: '#ef4444',
          cpuBallPos: 70,
          runMoves: newRunMoves,
        };
      }

      // Advance defenders toward carrier
      const newDefenders = advanceDefenders(defenders, newCarrierXY, state.difficulty, newRunMoves);

      // Check for contact trigger (nearest defender within 1.5 yards)
      const nearestDef = findNearestDefender(newCarrierXY, newDefenders);
      if (nearestDef && nearestDef.distance < 1.5) {
        // Dive forward = safe stop, no contact
        if (genericType === 'DiveForward') {
          const totalYards = Math.round(newCarrierXY.y);
          const playName = play ? play.name : 'play';
          const defName = state.chosenDefense || 'base43';
          const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
          const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
          return {
            ...state,
            phase: 'RESULT',
            carrierXY: newCarrierXY,
            currentDefenderPos: newDefenders,
            lastResult: { type: 'run', yards: totalYards, turnover: false },
            resultText: (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : 'No gain.') + ' Safe stop.',
            resultColor: totalYards >= 5 ? '#22c55e' : (totalYards > 0 ? '#eab308' : '#ef4444'),
            showCommentary: true,
            danComment: comm.dan,
            kikiComment: comm.kiki,
            runMoves: newRunMoves,
            yacMoves: newYacMoves,
          };
        }

        // Otherwise trigger contact
        return {
          ...state,
          phase: 'CONTACT',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          contactDefenderId: nearestDef ? nearestDef.id : null,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
          fieldAlert: 'CONTACT!',
        };
      }

      // Check YAC limit
      if (state.isYAC && newYacMoves >= state.maxYacMoves) {
        const totalYards = Math.round(newCarrierXY.y);
        const playName = play ? play.name : 'play';
        const defName = state.chosenDefense || 'base43';
        const commCat = totalYards >= 15 ? 'bigPass' : 'shortPass';
        const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName, target: state.carrier });
        return {
          ...state,
          phase: 'RESULT',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          lastResult: { type: 'complete', yards: totalYards, turnover: false },
          resultText: 'Tackled after the catch! Gain of ' + totalYards + ' yards.',
          resultColor: totalYards >= 10 ? '#22c55e' : '#eab308',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          runMoves: newRunMoves,
          yacMoves: newYacMoves,
        };
      }

      return {
        ...state,
        carrierXY: newCarrierXY,
        currentDefenderPos: newDefenders,
        runMoves: newRunMoves,
        yacMoves: newYacMoves,
        fieldAlert: null,
      };
    }

    // ----------------------------------------------------------
    // CONTACT_MOVE
    // ----------------------------------------------------------
    case 'CONTACT_MOVE': {
      const moveType = action.moveType;
      const play = PLAYS.find(p => p.id === state.selectedPlayId);
      const params = DIFFICULTY_PARAMS[state.difficulty];

      // Map display labels to internal types
      let internalType = moveType;
      if (moveType === 'spin') internalType = 'Spin';
      if (moveType === 'juke') internalType = 'Juke';
      if (moveType === 'stiffArm') internalType = 'StiffArm';
      if (moveType === 'diveForward') internalType = 'DiveForward';

      const carrierKey = state.carrier || 'RB';
      const contactResult = resolveContact(internalType, carrierKey, state.tacklesBroken, state.difficulty);

      if (contactResult.result === 'break') {
        // Push nearest defender away
        let newDefenders = state.currentDefenderPos.map(d => ({ ...d }));
        if (state.contactDefenderId) {
          for (let i = 0; i < newDefenders.length; i++) {
            if (newDefenders[i].id === state.contactDefenderId) {
              newDefenders[i].y -= 3;
              newDefenders[i].x += (Math.random() < 0.5 ? -5 : 5);
              break;
            }
          }
        }

        const newCarrierXY = { ...state.carrierXY };
        newCarrierXY.y += contactResult.yards;

        // Check touchdown after break
        const absoluteY = state.ballPos + newCarrierXY.y;
        if (absoluteY >= 100) {
          const totalYards = 100 - state.ballPos;
          const playName = play ? play.name : 'play';
          const defName = state.chosenDefense || 'base43';
          const comm = pickCommentary('touchdown', { play: playName, def: defName, yards: totalYards });
          return {
            ...state,
            phase: 'TOUCHDOWN',
            carrierXY: newCarrierXY,
            currentDefenderPos: newDefenders,
            lastResult: { type: 'touchdown', yards: totalYards, turnover: false },
            resultText: 'TOUCHDOWN!',
            resultColor: 'gold',
            showCommentary: true,
            danComment: comm.dan,
            kikiComment: comm.kiki,
            tacklesBroken: state.tacklesBroken + 1,
          };
        }

        // Check safety after break
        if (absoluteY <= 0) {
          return {
            ...state,
            phase: 'RESULT',
            carrierXY: newCarrierXY,
            currentDefenderPos: newDefenders,
            lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
            resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
            resultColor: '#ef4444',
            cpuBallPos: 70,
            tacklesBroken: state.tacklesBroken + 1,
          };
        }

        return {
          ...state,
          phase: 'RUNNER',
          carrierXY: newCarrierXY,
          currentDefenderPos: newDefenders,
          tacklesBroken: state.tacklesBroken + 1,
          fieldAlert: 'Broken tackle!',
        };
      }

      if (contactResult.result === 'fumble') {
        const totalYards = Math.round(state.carrierXY.y);
        const fumbleSpot = state.ballPos + totalYards;
        const cpuRecoveryPos = fumbleSpot >= 100 ? 80 : Math.min(Math.max(1, fumbleSpot), 99);
        const playName = play ? play.name : 'play';
        const comm = pickCommentary('fumble', { play: playName, def: state.chosenDefense });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'fumble', yards: totalYards, turnover: true },
          resultText: 'FUMBLE! Ball lost at the ' + formatFieldPosition(clampBallPosition(fumbleSpot)) + '!',
          resultColor: '#ef4444',
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
          cpuBallPos: cpuRecoveryPos,
        };
      }

      // Tackled
      const totalYards = Math.round(state.carrierXY.y) + contactResult.yards;
      const playName = play ? play.name : 'play';
      const defName = state.chosenDefense || 'base43';

      // Check safety on tackle
      const tackleAbsoluteY = state.ballPos + totalYards;
      if (tackleAbsoluteY <= 0) {
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'safety', yards: -state.ballPos, turnover: true },
          resultText: 'SAFETY! Tackled in the end zone! 2 points for the defense!',
          resultColor: '#ef4444',
          cpuBallPos: 70,
        };
      }

      // Dive forward special case: guaranteed yards, safe
      if (internalType === 'DiveForward') {
        const diveYards = totalYards;
        const commCat = diveYards >= 10 ? 'bigRun' : (diveYards > 0 ? 'shortRun' : 'runStuffed');
        const comm = pickCommentary(commCat, { yards: diveYards, play: playName, def: defName });
        return {
          ...state,
          phase: 'RESULT',
          lastResult: { type: 'run', yards: diveYards, turnover: false },
          resultText: 'Dives forward! ' + (diveYards > 0 ? 'Gain of ' + diveYards + ' yards.' : 'No gain.'),
          resultColor: diveYards >= 5 ? '#22c55e' : (diveYards > 0 ? '#eab308' : '#ef4444'),
          showCommentary: true,
          danComment: comm.dan,
          kikiComment: comm.kiki,
        };
      }

      const commCat = totalYards >= 10 ? 'bigRun' : (totalYards > 0 ? 'shortRun' : 'runStuffed');
      const comm = pickCommentary(commCat, { yards: totalYards, play: playName, def: defName });
      return {
        ...state,
        phase: 'RESULT',
        lastResult: { type: 'tackle', yards: totalYards, turnover: false },
        resultText: 'Tackled! ' + (totalYards > 0 ? 'Gain of ' + totalYards + ' yards.' : (totalYards < 0 ? 'Loss of ' + Math.abs(totalYards) + ' yards.' : 'No gain.')),
        resultColor: totalYards >= 5 ? '#22c55e' : (totalYards > 0 ? '#eab308' : '#ef4444'),
        showCommentary: true,
        danComment: comm.dan,
        kikiComment: comm.kiki,
      };
    }

    // ----------------------------------------------------------
    // NEXT_PLAY
    // ----------------------------------------------------------
    case 'NEXT_PLAY': {
      const result = state.lastResult;
      if (!result) return { ...state, phase: 'MENU' };

      const yards = result.yards || 0;
      let newBallPos = clampBallPosition(state.ballPos + yards);
      let newDown = state.down;
      let newDist = state.dist;
      let newPossessions = state.totalPossessions;
      let newPossessionsQ = state.possessionsThisQuarter;

      // Touchdown -> TOUCHDOWN phase
      if (result.type === 'touchdown') {
        return { ...state, phase: 'TOUCHDOWN' };
      }

      // Safety: 2 points for defense, then turnover
      if (result.type === 'safety') {
        const scoreKey = state.twoPlayerMode
          ? (state.activeOffense === 1 ? 'p2Score' : 'p1Score')
          : 'cpuScore';
        const scoreUpdate = {};
        scoreUpdate[scoreKey] = (state[scoreKey] || 0) + 2;

        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            ...scoreUpdate,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: 25,
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Safety! 2 points. Possession change.',
          };
        }

        return {
          ...state,
          ...scoreUpdate,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: state.cpuBallPos || 70,
          postureChoice: null,
          cpuDriveResult: null,
          ballPos: 25,
          down: 1,
          dist: 10,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Safety! 2 points for the defense.',
        };
      }

      // Turnover (INT, fumble) -> DEFENSIVE_POSTURE
      if (result.turnover) {
        newPossessions++;
        newPossessionsQ++;

        // Check quarter advancement
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - (state.cpuBallPos || 75)),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Turnover! Possession change.',
          };
        }

        return {
          ...state,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: state.cpuBallPos || 75,
          postureChoice: null,
          cpuDriveResult: null,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
        };
      }

      // Check first down
      const yardsToFirst = state.dist;
      if (yards >= yardsToFirst) {
        // First down achieved
        newDown = 1;
        newDist = Math.min(10, 100 - newBallPos);
      } else {
        newDown = state.down + 1;
        newDist = state.dist - yards;
        if (newDist <= 0) {
          newDown = 1;
          newDist = Math.min(10, 100 - newBallPos);
        }
      }

      // Check if it's now 4th down
      if (newDown > 4) {
        // Turnover on downs
        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - newBallPos),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Turnover on downs!',
          };
        }

        return {
          ...state,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: Math.max(1, 100 - newBallPos),
          postureChoice: null,
          cpuDriveResult: null,
          down: 1,
          dist: 10,
          ballPos: 25,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Turnover on downs!',
        };
      }

      // 4th down reached: show FOURTH_DOWN options
      if (newDown === 4) {
        return {
          ...state,
          phase: 'FOURTH_DOWN',
          ballPos: newBallPos,
          down: newDown,
          dist: newDist,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: null,
        };
      }

      // Normal next down
      return {
        ...state,
        phase: 'MENU',
        ballPos: newBallPos,
        down: newDown,
        dist: newDist,
        selectedPlayId: null,
        selectedCategory: null,
        lastResult: null,
        showCommentary: false,
        fieldAlert: null,
      };
    }

    // ----------------------------------------------------------
    // FOURTH_DOWN_OPTION
    // ----------------------------------------------------------
    case 'FOURTH_DOWN_OPTION': {
      const choice = action.choice;
      let newPossessions = state.totalPossessions;
      let newPossessionsQ = state.possessionsThisQuarter;

      if (choice === 'punt') {
        const puntResult = resolvePunt(state.ballPos);
        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (state.twoPlayerMode) {
          return {
            ...state,
            phase: quarterResult.phase || 'MENU',
            activeOffense: state.activeOffense === 1 ? 2 : 1,
            ballPos: Math.max(1, 100 - puntResult.landingSpot),
            down: 1,
            dist: 10,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: puntResult.touchback ? 'Punt! Touchback.' : 'Punt!',
          };
        }

        return {
          ...state,
          phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
          cpuBallPos: puntResult.landingSpot,
          postureChoice: null,
          cpuDriveResult: null,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: puntResult.touchback ? 'Punt! Touchback.' : 'Punt!',
        };
      }

      if (choice === 'fieldGoal') {
        const fgResult = resolveFieldGoal(state.ballPos);
        newPossessions++;
        newPossessionsQ++;
        const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

        if (fgResult.made) {
          const scoreKey = state.twoPlayerMode
            ? (state.activeOffense === 1 ? 'p1Score' : 'p2Score')
            : 'playerScore';
          const newScores = { ...state };
          newScores[scoreKey] = (state[scoreKey] || 0) + 3;

          if (state.twoPlayerMode) {
            return {
              ...newScores,
              phase: quarterResult.phase || 'MENU',
              activeOffense: state.activeOffense === 1 ? 2 : 1,
              ballPos: 25,
              down: 1,
              dist: 10,
              totalPossessions: newPossessions,
              possessionsThisQuarter: newPossessionsQ,
              quarter: quarterResult.quarter || state.quarter,
              selectedPlayId: null,
              selectedCategory: null,
              lastResult: null,
              showCommentary: false,
              fieldAlert: 'Field Goal is GOOD! ' + fgResult.distance + ' yards. +3 points!',
            };
          }

          return {
            ...newScores,
            phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
            cpuBallPos: 75,
            postureChoice: null,
            cpuDriveResult: null,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Field Goal is GOOD! ' + fgResult.distance + ' yards. +3 points!',
          };
        } else {
          // Missed FG
          const cpuPos = Math.min(state.ballPos, 99);

          if (state.twoPlayerMode) {
            return {
              ...state,
              phase: quarterResult.phase || 'MENU',
              activeOffense: state.activeOffense === 1 ? 2 : 1,
              ballPos: Math.max(1, 100 - cpuPos),
              down: 1,
              dist: 10,
              totalPossessions: newPossessions,
              possessionsThisQuarter: newPossessionsQ,
              quarter: quarterResult.quarter || state.quarter,
              selectedPlayId: null,
              selectedCategory: null,
              lastResult: null,
              showCommentary: false,
              fieldAlert: 'Field Goal MISSED! ' + fgResult.distance + ' yards.',
            };
          }

          return {
            ...state,
            phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
            cpuBallPos: cpuPos,
            postureChoice: null,
            cpuDriveResult: null,
            totalPossessions: newPossessions,
            possessionsThisQuarter: newPossessionsQ,
            quarter: quarterResult.quarter || state.quarter,
            selectedPlayId: null,
            selectedCategory: null,
            lastResult: null,
            showCommentary: false,
            fieldAlert: 'Field Goal MISSED! ' + fgResult.distance + ' yards.',
          };
        }
      }

      if (choice === 'goForIt') {
        return {
          ...state,
          phase: 'MENU',
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: 'Going for it on 4th down!',
        };
      }

      return state;
    }

    // ----------------------------------------------------------
    // POSTURE_PICK
    // ----------------------------------------------------------
    case 'POSTURE_PICK': {
      const posture = action.posture;
      const driveResult = resolveCPUDrive(state.cpuBallPos, posture, state.difficulty);

      // Update CPU score
      const newCpuScore = state.twoPlayerMode
        ? (state.activeOffense === 1 ? state.p2Score : state.p1Score) + driveResult.cpuScore
        : state.cpuScore + driveResult.cpuScore;

      const playerBallPos = clampBallPosition(driveResult.playerBallPos);

      const comm = pickCommentary('cpuDrive', {});
      const coachAdvice = state.coach ? pickCoachAdvice(state.coach, 'postureDebrief') : '';

      let newPossessions = state.totalPossessions + 1;
      let newPossessionsQ = state.possessionsThisQuarter + 1;
      const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

      const scoreUpdate = state.twoPlayerMode
        ? (state.activeOffense === 1
          ? { p2Score: newCpuScore }
          : { p1Score: newCpuScore })
        : { cpuScore: newCpuScore };

      return {
        ...state,
        ...scoreUpdate,
        phase: 'CPU_RESULT',
        postureChoice: posture,
        cpuDriveResult: driveResult,
        cpuResultNextPhase: quarterResult.phase || 'MENU',
        cpuResultNextQuarter: quarterResult.quarter || state.quarter,
        ballPos: playerBallPos,
        down: 1,
        dist: 10,
        totalPossessions: newPossessions,
        possessionsThisQuarter: newPossessionsQ,
        quarter: quarterResult.quarter || state.quarter,
        selectedPlayId: null,
        selectedCategory: null,
        showCommentary: false,
        danComment: driveResult.driveText,
        kikiComment: comm.kiki,
        coachAdvice: coachAdvice,
        fieldAlert: null,
        lastResult: null,
      };
    }

    // ----------------------------------------------------------
    // DISMISS_CPU_RESULT
    // ----------------------------------------------------------
    case 'DISMISS_CPU_RESULT': {
      return {
        ...state,
        phase: state.cpuResultNextPhase || 'MENU',
        quarter: state.cpuResultNextQuarter || state.quarter,
        cpuResultNextPhase: null,
        cpuResultNextQuarter: null,
      };
    }

    // ----------------------------------------------------------
    // TWO_PLAYER_DEF_PICK
    // ----------------------------------------------------------
    case 'TWO_PLAYER_DEF_PICK': {
      return {
        ...state,
        chosenDefense: action.defenseId,
        phase: 'PRESNAP',
      };
    }

    // ----------------------------------------------------------
    // DISMISS_COMMENTARY
    // ----------------------------------------------------------
    case 'DISMISS_COMMENTARY': {
      return { ...state, showCommentary: false };
    }

    // ----------------------------------------------------------
    // DISMISS_OVERLAY
    // ----------------------------------------------------------
    case 'DISMISS_OVERLAY': {
      return {
        ...state,
        overlaysSeen: {
          ...state.overlaysSeen,
          [action.overlayId || 'unknown']: true,
        },
      };
    }

    // ----------------------------------------------------------
    // ANIMATION_TICK — incremental position updates during active phases
    // ----------------------------------------------------------
    case 'ANIMATION_TICK': {
      const tickPlay = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
      if (!tickPlay) return state;
      const tickFormation = tickPlay.formation;
      const tickParams = state.difficulty ? DIFFICULTY_PARAMS[state.difficulty] : null;
      if (!tickParams) return state;

      // DECISION / RPO_READ: advance receivers along waypoints, track defenders, press DL
      if (state.phase === 'DECISION' || state.phase === 'RPO_READ') {
        const newRecPos = { ...state.currentReceiverPos };
        const newDefPos = state.currentDefenderPos.map(d => ({ ...d }));
        const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
        const tickXScale = 0.53;

        // Advance receivers toward their next waypoint (interpolate between waypoints)
        for (const rk of receiverKeys) {
          const wps = state.receiverWaypoints[rk];
          if (!wps || wps.length === 0) continue;
          const currentPos = newRecPos[rk];
          if (!currentPos) continue;

          // Find the waypoint the receiver is heading toward based on current phase
          const wpIndex = Math.min(state.currentPhase, wps.length - 1);
          const targetWP = wps[wpIndex];
          if (!targetWP) continue;

          // Waypoints are already absolute (startPos.x + wp.x was done in SELECT_PLAY)
          const targetX = targetWP.x;
          const targetY = targetWP.y;

          // Interpolate toward target at ~2.5 yards per tick
          const dx = targetX - currentPos.x;
          const dy = targetY - currentPos.y;
          const dist = Math.sqrt((dx * tickXScale) * (dx * tickXScale) + dy * dy);
          if (dist > 0.5) {
            const speed = Math.min(2.5, dist);
            newRecPos[rk] = {
              x: currentPos.x + (dx / dist) * speed / tickXScale * tickXScale,
              y: currentPos.y + (dy / dist) * speed,
            };
          }
        }

        // DBs track toward nearest receiver
        const dbTrack = tickParams.dbTracking;
        for (let i = 0; i < newDefPos.length; i++) {
          const d = newDefPos[i];
          if (d.role === 'CB' || d.role === 'S') {
            let nearRecKey = null;
            let nearDist = Infinity;
            for (const rk of receiverKeys) {
              if (newRecPos[rk]) {
                const rdx = (newRecPos[rk].x - d.x) * tickXScale;
                const rdy = newRecPos[rk].y - d.y;
                const rd = Math.sqrt(rdx * rdx + rdy * rdy);
                if (rd < nearDist) { nearDist = rd; nearRecKey = rk; }
              }
            }
            if (nearRecKey && newRecPos[nearRecKey]) {
              const target = newRecPos[nearRecKey];
              const tdx = (target.x - d.x) * tickXScale;
              const tdy = target.y - d.y;
              const td = Math.sqrt(tdx * tdx + tdy * tdy);
              if (td > 0.5) {
                const trackSpeed = dbTrack * 2;
                d.x += (tdx / td) * trackSpeed / tickXScale;
                d.y += (tdy / td) * trackSpeed;
              }
            }
          }

          // DL press toward QB
          if (d.role === 'DL') {
            const qb = state.quarterbackXY;
            const dlDx = (qb.x - d.x) * tickXScale;
            const dlDy = qb.y - d.y;
            const dlDist = Math.sqrt(dlDx * dlDx + dlDy * dlDy);
            if (dlDist > 0.5) {
              const dlSpeed = 1.0;
              d.x += (dlDx / dlDist) * dlSpeed / tickXScale;
              d.y += (dlDy / dlDist) * dlSpeed;
            }
          }

          // LB drift forward slightly
          if (d.role === 'LB') {
            const qb = state.quarterbackXY;
            const lbDy = qb.y - d.y;
            if (lbDy < 0 && Math.abs(lbDy) > 1) {
              d.y -= 0.5;
            }
          }
        }

        return {
          ...state,
          currentReceiverPos: newRecPos,
          currentDefenderPos: newDefPos,
        };
      }

      // RUNNER: advance carrier slightly, converge defenders
      if (state.phase === 'RUNNER') {
        const newDefPos = advanceDefenders(
          state.currentDefenderPos, state.carrierXY, state.difficulty, state.runMoves
        );
        return {
          ...state,
          currentDefenderPos: newDefPos,
        };
      }

      // CONTACT: small jitter/struggle animation
      if (state.phase === 'CONTACT') {
        const jitterCarrier = { ...state.carrierXY };
        jitterCarrier.x += (Math.random() - 0.5) * 0.8;
        jitterCarrier.y += (Math.random() - 0.5) * 0.4;

        // Other defenders continue converging
        const newDefPos = state.currentDefenderPos.map(d => {
          const nd = { ...d };
          if (nd.id !== state.contactDefenderId) {
            const cdx = (jitterCarrier.x - nd.x) * 0.53;
            const cdy = jitterCarrier.y - nd.y;
            const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cdist > 2) {
              nd.x += (cdx / cdist) * 1.0 / 0.53;
              nd.y += (cdy / cdist) * 1.0;
            }
          } else {
            // Contact defender jitters with carrier
            nd.x += (Math.random() - 0.5) * 0.6;
            nd.y += (Math.random() - 0.5) * 0.3;
          }
          return nd;
        });

        return {
          ...state,
          carrierXY: jitterCarrier,
          currentDefenderPos: newDefPos,
        };
      }

      return state;
    }

    // ----------------------------------------------------------
    // TOGGLE_MUTE
    // ----------------------------------------------------------
    case 'TOGGLE_MUTE': {
      const newMuted = !state.muted;
      SoundEngine.setMuted(newMuted);
      return { ...state, muted: newMuted };
    }

    // ----------------------------------------------------------
    // ADVANCE_QUARTER
    // ----------------------------------------------------------
    case 'ADVANCE_QUARTER': {
      const nextQuarter = state.quarter + 1;
      if (nextQuarter > 4) {
        return { ...state, phase: 'GAME_OVER' };
      }
      // Reset field state at halftime (entering Q3)
      const halftimeReset = nextQuarter === 3 ? {
        ballPos: 25,
        down: 1,
        dist: 10,
        activeOffense: state.twoPlayerMode ? (state.activeOffense === 1 ? 2 : 1) : state.activeOffense,
      } : {};
      return {
        ...state,
        ...halftimeReset,
        phase: 'MENU',
        quarter: nextQuarter,
        possessionsThisQuarter: 0,
        audiblesThisQuarter: 0,
      };
    }

    // ----------------------------------------------------------
    // SCORE_TOUCHDOWN
    // ----------------------------------------------------------
    case 'SCORE_TOUCHDOWN': {
      const scoreKey = state.twoPlayerMode
        ? (state.activeOffense === 1 ? 'p1Score' : 'p2Score')
        : 'playerScore';

      let newPossessions = state.totalPossessions + 1;
      let newPossessionsQ = state.possessionsThisQuarter + 1;
      const quarterResult = checkQuarterAdvance(state.quarter, newPossessionsQ, newPossessions);

      const scoreUpdate = {};
      scoreUpdate[scoreKey] = (state[scoreKey] || 0) + 7;

      if (state.twoPlayerMode) {
        return {
          ...state,
          ...scoreUpdate,
          phase: quarterResult.phase || 'MENU',
          activeOffense: state.activeOffense === 1 ? 2 : 1,
          ballPos: 25,
          down: 1,
          dist: 10,
          totalPossessions: newPossessions,
          possessionsThisQuarter: newPossessionsQ,
          quarter: quarterResult.quarter || state.quarter,
          selectedPlayId: null,
          selectedCategory: null,
          lastResult: null,
          showCommentary: false,
          fieldAlert: null,
        };
      }

      return {
        ...state,
        ...scoreUpdate,
        phase: quarterResult.phase || 'DEFENSIVE_POSTURE',
        cpuBallPos: 75,
        postureChoice: null,
        cpuDriveResult: null,
        ballPos: 25,
        down: 1,
        dist: 10,
        totalPossessions: newPossessions,
        possessionsThisQuarter: newPossessionsQ,
        quarter: quarterResult.quarter || state.quarter,
        selectedPlayId: null,
        selectedCategory: null,
        lastResult: null,
        showCommentary: false,
        fieldAlert: null,
      };
    }

    default:
      return state;
  }
}

// ============================================================
// HELPER: Quarter advancement logic
// ============================================================
function checkQuarterAdvance(currentQuarter, possessionsThisQ, totalPossessions) {
  // Each quarter has ~4 possessions per team (8 total)
  const possessionsPerQuarter = 8;

  if (possessionsThisQ >= possessionsPerQuarter) {
    if (currentQuarter === 2) {
      return { phase: 'HALFTIME', quarter: currentQuarter };
    }
    if (currentQuarter >= 4) {
      return { phase: 'GAME_OVER', quarter: currentQuarter };
    }
    return { phase: 'QUARTER_CHANGE', quarter: currentQuarter };
  }
  return { phase: null, quarter: currentQuarter };
}

// ============================================================
// PLAYER TOKEN COMPONENT
// ============================================================
function PlayerToken({ id, role, x, y, isBallCarrier, isOffense, integrityColor, label, instant, scale }) {
  const tokenClass = React.useMemo(() => {
    let base = 'token';
    if (instant) base += ' instant';

    if (isOffense) {
      switch (role) {
        case 'QB': base += ' token-qb'; break;
        case 'RB': base += ' token-rb'; break;
        case 'W1': case 'W2': case 'WR': base += ' token-wr'; break;
        case 'TE': base += ' token-te'; break;
        case 'OL': base += ' token-ol'; break;
        default: base += ' token-wr'; break;
      }
      if (role === 'OL' && integrityColor) {
        base += ' integrity-' + integrityColor;
      }
    } else {
      switch (role) {
        case 'DL': base += ' token-dl'; break;
        case 'LB': base += ' token-lb'; break;
        case 'CB': base += ' token-cb'; break;
        case 'S':  base += ' token-s'; break;
        default: base += ' token-lb'; break;
      }
    }

    if (isBallCarrier) base += ' ball-carrier';
    return base;
  }, [role, isOffense, isBallCarrier, integrityColor, instant]);

  const scaleStr = (scale && scale !== 1) ? ' scale(' + scale + ')' : '';
  const rotateStr = (role === 'QB' && isOffense) ? ' rotate(45deg)' : '';
  const style = {
    left: x + 'px',
    top: y + 'px',
    transform: 'translate(-50%, -50%)' + scaleStr + rotateStr,
  };

  const displayLabel = label || (id || '').replace(/[0-9]/g, '');

  return React.createElement('div', {
    className: tokenClass,
    style: style,
    title: id,
  },
    React.createElement('span', {
      className: role === 'QB' ? 'label' : null,
      style: { fontSize: '10px', pointerEvents: 'none' }
    }, displayLabel)
  );
}

// ============================================================
// GAME FIELD COMPONENT
// ============================================================
function GameField({ state, dispatch }) {
  const fieldScrollRef = React.useRef(null);
  const viewportRef = React.useRef(null);
  const prevCameraModeRef = React.useRef(state.cameraMode);
  const [fieldWidth, setFieldWidth] = React.useState(0);
  const [viewportHeight, setViewportHeight] = React.useState(450);
  const [instantCam, setInstantCam] = React.useState(false);

  // Dynamic yard-to-pixel ratio based on camera mode
  const yardPx = state.cameraMode === 'strategic' ? (viewportHeight / 120) : YARD_PX;
  const totalFieldHeight = 120 * yardPx;
  const tokenScale = yardPx / YARD_PX;

  // Measure field width and height
  React.useEffect(() => {
    const measure = () => {
      if (viewportRef.current) {
        const rect = viewportRef.current.getBoundingClientRect();
        setFieldWidth(rect.width);
        setViewportHeight(rect.height);
      }
    };
    // Measure after layout is complete
    requestAnimationFrame(measure);
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  // Camera positioning
  React.useEffect(() => {
    if (!fieldScrollRef.current) return;

    if (state.cameraMode === 'strategic') {
      // Full field visible — no scrolling needed
      fieldScrollRef.current.style.transform = 'translateY(0px)';
      return;
    }

    // Follow mode: track ball carrier or ball-in-flight, not LOS
    let trackYard = state.ballPos;
    if (state.carrier && state.carrierXY && (state.phase === 'RUNNER' || state.phase === 'CONTACT')) {
      trackYard = state.ballPos + state.carrierXY.y;
    } else if (state.ballInFlight && state.ballFlightTarget) {
      trackYard = state.ballPos + state.ballFlightTarget.y;
    }

    const trackPixel = (110 - trackYard) * yardPx;
    const targetScroll = trackPixel - viewportHeight / 2;
    const clampedScroll = Math.max(0, Math.min(totalFieldHeight - viewportHeight, targetScroll));

    fieldScrollRef.current.style.transform = 'translateY(' + (-clampedScroll) + 'px)';
  }, [state.cameraMode, state.ballPos, state.phase, state.carrierXY, state.ballInFlight, state.ballFlightTarget]);

  // Instant camera: only when staying within strategic mode (e.g. MENU → PRESNAP)
  React.useEffect(() => {
    const prevMode = prevCameraModeRef.current;
    const newMode = state.cameraMode;
    prevCameraModeRef.current = newMode;

    if (prevMode === 'strategic' && newMode === 'strategic') {
      setInstantCam(true);
      const timer = setTimeout(() => setInstantCam(false), 50);
      return () => clearTimeout(timer);
    }
  }, [state.cameraMode, state.phase]);

  // Coordinate conversion helpers — all use dynamic yardPx
  function yardToPixelY(yardFromOwnGoal) {
    return (110 - yardFromOwnGoal) * yardPx;
  }

  function relToAbsoluteY(relativeY) {
    return state.ballPos + relativeY;
  }

  function posToPixel(xPct, relativeY) {
    const absY = relToAbsoluteY(relativeY);
    return {
      left: (xPct / 100) * fieldWidth,
      top: yardToPixelY(absY),
    };
  }

  // Build yard lines
  const yardLines = [];
  for (let yd = 0; yd <= 100; yd++) {
    const pixelY = yardToPixelY(yd);
    let lineClass = 'yard-line';
    if (yd % 10 === 0) lineClass += ' ten';
    else if (yd % 5 === 0) lineClass += ' five';

    yardLines.push(
      React.createElement('div', {
        key: 'yl-' + yd,
        className: lineClass,
        style: { top: pixelY + 'px' }
      })
    );
  }

  // Yard numbers
  const yardNumbers = [];
  for (let yd = 10; yd <= 90; yd += 10) {
    const displayNum = yd <= 50 ? yd : (100 - yd);
    if (displayNum === 0 || displayNum === 10) continue;
    const pixelY = yardToPixelY(yd);
    yardNumbers.push(
      React.createElement('div', {
        key: 'yn-l-' + yd,
        className: 'yard-number',
        style: { left: '8%', top: (pixelY - 12) + 'px' }
      }, displayNum)
    );
    yardNumbers.push(
      React.createElement('div', {
        key: 'yn-r-' + yd,
        className: 'yard-number',
        style: { right: '8%', top: (pixelY - 12) + 'px', left: 'auto' }
      }, displayNum)
    );
  }

  // Hash marks
  const hashMarks = [];
  for (let yd = 1; yd <= 99; yd++) {
    if (yd % 5 === 0) continue;
    const pixelY = yardToPixelY(yd);
    hashMarks.push(
      React.createElement('div', {
        key: 'hash-l-' + yd,
        style: {
          position: 'absolute',
          left: '29.5%',
          top: pixelY + 'px',
          width: '2px',
          height: '1px',
          background: 'rgba(255,255,255,0.12)',
        }
      })
    );
    hashMarks.push(
      React.createElement('div', {
        key: 'hash-r-' + yd,
        style: {
          position: 'absolute',
          left: '70.5%',
          top: pixelY + 'px',
          width: '2px',
          height: '1px',
          background: 'rgba(255,255,255,0.12)',
        }
      })
    );
  }

  // Turf bands (alternating every 5 yards)
  const turfBands = [];
  for (let band = 0; band < 20; band++) {
    const startYard = band * 5;
    const topPx = yardToPixelY(startYard + 5);
    const height = 5 * yardPx;
    turfBands.push(
      React.createElement('div', {
        key: 'turf-' + band,
        className: 'yard-band ' + (band % 2 === 0 ? 'even' : 'odd'),
        style: { top: topPx + 'px', height: height + 'px' }
      })
    );
  }

  // End zones
  const oppEndzone = React.createElement('div', {
    className: 'endzone endzone-opponent',
    style: { top: 0, height: (10 * yardPx) + 'px' }
  }, 'END ZONE');

  const ownEndzone = React.createElement('div', {
    className: 'endzone endzone-own',
    style: { top: (110 * yardPx) + 'px', height: (10 * yardPx) + 'px' }
  }, 'END ZONE');

  // Midfield logo
  const midfieldLogo = React.createElement('div', {
    key: 'midfield',
    style: {
      position: 'absolute',
      top: (yardToPixelY(50) - 16) + 'px',
      left: '50%',
      transform: 'translateX(-50%)',
      fontSize: '32px',
      fontWeight: '900',
      color: 'rgba(255,255,255,0.06)',
      pointerEvents: 'none',
      userSelect: 'none',
    }
  }, 'HM');

  // Goal posts
  const goalPosts = [];
  const goalPostStyle = {
    position: 'absolute',
    width: '20%',
    height: '3px',
    background: '#ddb830',
    left: '40%',
    zIndex: 4,
    borderRadius: '2px',
  };
  goalPosts.push(
    React.createElement('div', {
      key: 'gp-top',
      style: { ...goalPostStyle, top: (yardToPixelY(100) - 2) + 'px' }
    })
  );
  goalPosts.push(
    React.createElement('div', {
      key: 'gp-bottom',
      style: { ...goalPostStyle, top: (yardToPixelY(0) - 2) + 'px' }
    })
  );

  // Line of scrimmage
  const losLine = React.createElement('div', {
    className: 'line-of-scrimmage',
    style: { top: yardToPixelY(state.ballPos) + 'px' }
  });

  // First down marker
  let firstDownMarker = null;
  if (state.dist <= 30) {
    const firstDownYard = state.ballPos + state.dist;
    if (firstDownYard <= 100) {
      firstDownMarker = React.createElement('div', {
        className: 'first-down-marker',
        style: { top: yardToPixelY(firstDownYard) + 'px' }
      });
    }
  }

  // ---- PLAYER TOKENS ----
  const playerTokens = [];
  const isActivePlay = ['PRESNAP', 'SNAPPING', 'DECISION', 'RPO_READ', 'RUNNER', 'CONTACT'].includes(state.phase);
  const play = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
  const formation = play ? play.formation : null;
  const instantTokens = state.phase === 'PRESNAP';

  // Don't render tokens until field width is measured
  const canRenderTokens = fieldWidth > 0;

  if (canRenderTokens && isActivePlay && formation) {
    // OL tokens
    const holdData = state.holdTimeData || [];
    for (let i = 0; i < formation.OL.length; i++) {
      const olPos = formation.OL[i];
      const pixel = posToPixel(olPos.x, olPos.y);
      let intColor = 'good';
      if (holdData[i]) {
        if (holdData[i].integrity > 60) intColor = 'good';
        else if (holdData[i].integrity > 25) intColor = 'warn';
        else intColor = 'bad';
      }
      playerTokens.push(
        React.createElement(PlayerToken, {
          key: 'OL' + i,
          id: 'OL' + (i + 1),
          role: 'OL',
          x: pixel.left,
          y: pixel.top,
          isBallCarrier: false,
          isOffense: true,
          integrityColor: intColor,
          label: '',
          instant: instantTokens,
          scale: tokenScale,
        })
      );
    }

    // QB token
    const qbPos = (state.phase === 'DECISION' || state.phase === 'SNAPPING')
      ? state.quarterbackXY
      : (formation.QB || { x: 50, y: -3 });
    const qbPx = posToPixel(qbPos.x, qbPos.y);
    const qbIsCarrier = state.carrier === 'QB' && (state.phase === 'RUNNER' || state.phase === 'CONTACT');
    playerTokens.push(
      React.createElement(PlayerToken, {
        key: 'QB',
        id: 'QB',
        role: 'QB',
        x: qbPx.left,
        y: qbPx.top,
        isBallCarrier: qbIsCarrier,
        isOffense: true,
        label: 'QB',
        instant: instantTokens,
        scale: tokenScale,
      })
    );

    // Receiver tokens (W1, W2, TE, RB)
    const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
    for (const rk of receiverKeys) {
      let recPosition;
      if (state.currentReceiverPos[rk]) {
        recPosition = state.currentReceiverPos[rk];
      } else if (formation[rk]) {
        recPosition = { x: formation[rk].x, y: formation[rk].y };
      }
      if (!recPosition) continue;

      // If this receiver is the carrier in RUNNER/CONTACT, use carrierXY
      const isCarrier = state.carrier === rk && (state.phase === 'RUNNER' || state.phase === 'CONTACT');
      const displayPos = isCarrier ? state.carrierXY : recPosition;
      const px = posToPixel(displayPos.x, displayPos.y);

      playerTokens.push(
        React.createElement(PlayerToken, {
          key: rk,
          id: rk,
          role: rk,
          x: px.left,
          y: px.top,
          isBallCarrier: isCarrier,
          isOffense: true,
          label: rk,
          instant: instantTokens,
          scale: tokenScale,
        })
      );
    }

    // Defense tokens
    for (let i = 0; i < state.currentDefenderPos.length; i++) {
      const def = state.currentDefenderPos[i];
      const defPx = posToPixel(def.x, def.y);
      playerTokens.push(
        React.createElement(PlayerToken, {
          key: 'def-' + def.id,
          id: def.id,
          role: def.role,
          x: defPx.left,
          y: defPx.top,
          isBallCarrier: false,
          isOffense: false,
          label: '',
          instant: instantTokens,
          scale: tokenScale,
        })
      );
    }
  } else if (canRenderTokens) {
    // Fallback formation rendering for non-active phases
    // Keeps the field from ever looking empty
    const fallbackPhases = ['MENU', 'PLAY_SELECT', 'RESULT', 'FOURTH_DOWN', 'CPU_RESULT'];
    if (fallbackPhases.includes(state.phase)) {

      if (state.phase === 'RESULT' && (Object.keys(state.currentReceiverPos).length > 0 || state.currentDefenderPos.length > 0)) {
        // RESULT: show players at their final positions from the play that just ended
        const resultPlay = state.selectedPlayId ? PLAYS.find(p => p.id === state.selectedPlayId) : null;
        const resultFormation = resultPlay ? resultPlay.formation : FI;

        // OL at formation spots
        for (let i = 0; i < resultFormation.OL.length; i++) {
          const olPos = resultFormation.OL[i];
          const pixel = posToPixel(olPos.x, olPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'OL' + i,
              id: 'OL' + (i + 1),
              role: 'OL',
              x: pixel.left,
              y: pixel.top,
              isBallCarrier: false,
              isOffense: true,
              integrityColor: 'good',
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // QB at last known position or formation
        const qbFinalPos = state.quarterbackXY || (resultFormation.QB || { x: 50, y: -3 });
        const qbFinalPx = posToPixel(qbFinalPos.x, qbFinalPos.y);
        playerTokens.push(
          React.createElement(PlayerToken, {
            key: 'QB',
            id: 'QB',
            role: 'QB',
            x: qbFinalPx.left,
            y: qbFinalPx.top,
            isBallCarrier: false,
            isOffense: true,
            label: 'QB',
            instant: true,
            scale: tokenScale,
          })
        );

        // Receivers at their final positions
        const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
        for (const rk of receiverKeys) {
          let recPos = state.currentReceiverPos[rk];
          // If this receiver was the carrier, use carrierXY
          if (state.carrier === rk && state.carrierXY) {
            recPos = state.carrierXY;
          }
          if (!recPos && resultFormation[rk]) {
            recPos = { x: resultFormation[rk].x, y: resultFormation[rk].y };
          }
          if (!recPos) continue;
          const px = posToPixel(recPos.x, recPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: rk,
              id: rk,
              role: rk,
              x: px.left,
              y: px.top,
              isBallCarrier: false,
              isOffense: true,
              label: rk,
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // Defenders at their final positions
        for (let i = 0; i < state.currentDefenderPos.length; i++) {
          const def = state.currentDefenderPos[i];
          const defPx = posToPixel(def.x, def.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'def-' + def.id,
              id: def.id,
              role: def.role,
              x: defPx.left,
              y: defPx.top,
              isBallCarrier: false,
              isOffense: false,
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

      } else {
        // MENU, PLAY_SELECT, FOURTH_DOWN, CPU_RESULT: show default I-Formation offense
        // During PLAY_SELECT with an expanded play, use that play's formation
        let fallbackFormation = FI;
        if (state.phase === 'PLAY_SELECT' && state.expandedPlayId) {
          const previewPlay = PLAYS.find(p => p.id === state.expandedPlayId);
          if (previewPlay) fallbackFormation = previewPlay.formation;
        }

        // OL
        for (let i = 0; i < fallbackFormation.OL.length; i++) {
          const olPos = fallbackFormation.OL[i];
          const pixel = posToPixel(olPos.x, olPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: 'OL' + i,
              id: 'OL' + (i + 1),
              role: 'OL',
              x: pixel.left,
              y: pixel.top,
              isBallCarrier: false,
              isOffense: true,
              integrityColor: 'good',
              label: '',
              instant: true,
              scale: tokenScale,
            })
          );
        }

        // QB
        const qbPos = fallbackFormation.QB || { x: 50, y: -3 };
        const qbPx = posToPixel(qbPos.x, qbPos.y);
        playerTokens.push(
          React.createElement(PlayerToken, {
            key: 'QB',
            id: 'QB',
            role: 'QB',
            x: qbPx.left,
            y: qbPx.top,
            isBallCarrier: false,
            isOffense: true,
            label: 'QB',
            instant: true,
            scale: tokenScale,
          })
        );

        // Receivers
        const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
        for (const rk of receiverKeys) {
          if (!fallbackFormation[rk]) continue;
          const rPos = fallbackFormation[rk];
          const px = posToPixel(rPos.x, rPos.y);
          playerTokens.push(
            React.createElement(PlayerToken, {
              key: rk,
              id: rk,
              role: rk,
              x: px.left,
              y: px.top,
              isBallCarrier: false,
              isOffense: true,
              label: rk,
              instant: true,
              scale: tokenScale,
            })
          );
        }
      }
    }
  }

  // ---- BALL ----
  const ballScaleStr = tokenScale !== 1 ? ' scale(' + tokenScale + ')' : '';
  let ballElement = null;
  if (isActivePlay) {
    if (state.ballInFlight && state.ballFlightTarget) {
      const targetPx = posToPixel(state.ballFlightTarget.x, state.ballFlightTarget.y);
      ballElement = React.createElement('div', {
        className: 'ball flying',
        style: { left: targetPx.left + 'px', top: targetPx.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    } else if (state.carrier && (state.phase === 'RUNNER' || state.phase === 'CONTACT')) {
      const carrierPx = posToPixel(state.carrierXY.x, state.carrierXY.y);
      ballElement = React.createElement('div', {
        className: 'ball',
        style: { left: carrierPx.left + 'px', top: carrierPx.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    } else if (state.phase === 'DECISION' || state.phase === 'SNAPPING') {
      const qbXY = state.quarterbackXY;
      const qbPx2 = posToPixel(qbXY.x, qbXY.y);
      ballElement = React.createElement('div', {
        className: 'ball',
        style: { left: qbPx2.left + 'px', top: qbPx2.top + 'px', transform: 'translate(-50%, -50%)' + ballScaleStr }
      });
    }
  }

  // ---- GHOST ROUTES (SVG overlay) ----
  let ghostRouteSVG = null;
  const params = state.difficulty ? DIFFICULTY_PARAMS[state.difficulty] : null;
  if (params && play && formation) {
    const ghostPhases = params.ghostRoutePhases || [];
    let showGhost = false;
    if (state.phase === 'PLAY_SELECT' && ghostPhases.includes('select')) showGhost = true;
    if (state.phase === 'PRESNAP' && ghostPhases.includes('presnap')) showGhost = true;
    if ((state.phase === 'DECISION' || state.phase === 'RUNNER' || state.phase === 'CONTACT') && ghostPhases.includes('play')) showGhost = true;

    if (showGhost && state.receiverWaypoints) {
      const routeLines = [];
      const recKeys = ['W1', 'W2', 'TE', 'RB'];
      for (const rk of recKeys) {
        const wps = state.receiverWaypoints[rk];
        if (!wps || wps.length === 0) continue;

        const startPos = formation[rk];
        if (!startPos) continue;
        const startPx = posToPixel(startPos.x, startPos.y);

        let pathData = 'M ' + startPx.left + ' ' + startPx.top;
        for (let w = 0; w < wps.length; w++) {
          const wp = wps[w];
          // Waypoints are already absolute (startPos was added in SELECT_PLAY)
          const wpPx = posToPixel(wp.x, wp.y);
          pathData += ' L ' + wpPx.left + ' ' + wpPx.top;
        }

        const isDecoy = play.routes[rk] === 'block' || play.routes[rk] === 'check';
        const routeColor = isDecoy ? 'rgba(120,130,255,0.6)' : 'rgba(0,220,255,0.9)';

        routeLines.push(
          React.createElement('path', {
            key: 'route-' + rk,
            d: pathData,
            className: 'ghost-route' + (isDecoy ? ' decoy' : ''),
            stroke: routeColor,
            strokeWidth: 3,
            fill: 'none',
          })
        );
      }

      if (routeLines.length > 0) {
        ghostRouteSVG = React.createElement('svg', {
          className: 'route-overlay',
          style: { width: '100%', height: totalFieldHeight + 'px' },
        }, routeLines);
      }
    }
  }

  // Preview ghost routes during PLAY_SELECT when a play card is expanded
  // (before SELECT_PLAY fires, so receiverWaypoints don't exist yet)
  if (canRenderTokens && !ghostRouteSVG && state.phase === 'PLAY_SELECT' && state.expandedPlayId) {
    const previewPlay = PLAYS.find(p => p.id === state.expandedPlayId);
    if (previewPlay) {
      const previewFormation = previewPlay.formation;
      const previewRouteLines = [];
      const recKeys = ['W1', 'W2', 'TE', 'RB'];

      for (const rk of recKeys) {
        const route = previewPlay.routes[rk];
        const startPos = previewFormation[rk];
        if (!startPos || !route) continue;

        // Generate waypoints on-the-fly (same logic as SELECT_PLAY)
        const routeWP = buildRoute(route, startPos.x, startPos.y);
        const absoluteWP = routeWP.map(wp => ({
          x: startPos.x + wp.x,
          y: startPos.y + wp.y
        }));

        const startPx = posToPixel(startPos.x, startPos.y);
        let pathData = 'M ' + startPx.left + ' ' + startPx.top;
        for (let w = 0; w < absoluteWP.length; w++) {
          const wpPx = posToPixel(absoluteWP[w].x, absoluteWP[w].y);
          pathData += ' L ' + wpPx.left + ' ' + wpPx.top;
        }

        const isDecoy = route === 'block' || route === 'check';
        const routeColor = isDecoy ? 'rgba(120,130,255,0.6)' : 'rgba(0,220,255,0.9)';

        previewRouteLines.push(
          React.createElement('path', {
            key: 'preview-route-' + rk,
            d: pathData,
            className: 'ghost-route' + (isDecoy ? ' decoy' : ''),
            stroke: routeColor,
            strokeWidth: 3,
            fill: 'none',
          })
        );
      }

      if (previewRouteLines.length > 0) {
        ghostRouteSVG = React.createElement('svg', {
          className: 'route-overlay',
          style: { width: '100%', height: totalFieldHeight + 'px' },
        }, previewRouteLines);
      }
    }
  }

  // ---- OPENNESS LABELS (during DECISION) ----
  const opennessLabels = [];
  if (state.phase === 'DECISION') {
    const recKeys = ['W1', 'W2', 'TE', 'RB'];
    for (const rk of recKeys) {
      const rp = state.currentReceiverPos[rk];
      if (!rp) continue;
      // Skip blockers
      if (play && (play.routes[rk] === 'block')) continue;

      const openness = calculateReceiverOpenness(rp, state.currentDefenderPos);
      const px = posToPixel(rp.x, rp.y);

      opennessLabels.push(
        React.createElement('div', {
          key: 'open-' + rk,
          style: {
            position: 'absolute',
            left: px.left + 'px',
            top: (px.top - 22) + 'px',
            transform: 'translateX(-50%)',
            background: 'rgba(0,0,0,0.7)',
            color: openness.color,
            fontSize: '10px',
            fontWeight: 'bold',
            padding: '2px 6px',
            borderRadius: '4px',
            whiteSpace: 'nowrap',
            zIndex: 12,
            pointerEvents: 'none',
          }
        }, rk + ': ' + openness.label)
      );
    }
  }

  // ---- RUN ARROWS (during RUNNER) ----
  let runArrowElements = null;
  if (state.phase === 'RUNNER' && state.carrierXY) {
    const arrows = generateRunArrows(state.carrierXY, state.currentDefenderPos);
    const arrowEls = [];
    const carrierPx = posToPixel(state.carrierXY.x, state.carrierXY.y);

    for (let i = 0; i < arrows.length; i += 3) {
      const arrow = arrows[i];
      const arrowColor = arrow.quality === 'good' ? '#22c55e' :
                          arrow.quality === 'ok' ? '#eab308' : '#ef4444';
      const length = 20;
      const endX = carrierPx.left + Math.sin(arrow.angle * Math.PI / 180) * length;
      const endY = carrierPx.top - Math.cos(arrow.angle * Math.PI / 180) * length;

      arrowEls.push(
        React.createElement('line', {
          key: 'arrow-' + i,
          x1: carrierPx.left,
          y1: carrierPx.top,
          x2: endX,
          y2: endY,
          stroke: arrowColor,
          strokeWidth: 2,
          opacity: 0.6,
        })
      );
    }

    if (arrowEls.length > 0) {
      runArrowElements = React.createElement('svg', {
        className: 'route-overlay',
        style: { width: '100%', height: totalFieldHeight + 'px', pointerEvents: 'none' },
      }, arrowEls);
    }
  }

  // ---- FIELD ALERT ----
  let alertElement = null;
  if (state.fieldAlert) {
    alertElement = React.createElement('div', {
      className: 'alert-toast',
    }, state.fieldAlert);
  }

  // ---- OL MATCHUP INTEGRITY DOTS ----
  const olDots = [];
  if ((state.phase === 'DECISION' || state.phase === 'SNAPPING') && state.holdTimeData.length > 0) {
    for (let i = 0; i < Math.min(5, state.holdTimeData.length); i++) {
      const m = state.holdTimeData[i];
      const dotColor = m.integrity > 60 ? '#22c55e' : (m.integrity > 25 ? '#eab308' : '#ef4444');

      // Position dots below each OL player
      if (formation && formation.OL[i]) {
        const olPx = posToPixel(formation.OL[i].x, formation.OL[i].y);
        olDots.push(
          React.createElement('div', {
            key: 'oldot-' + i,
            style: {
              position: 'absolute',
              left: olPx.left + 'px',
              top: (olPx.top + 16) + 'px',
              width: '6px',
              height: '6px',
              borderRadius: '50%',
              background: dotColor,
              transform: 'translateX(-50%)',
              zIndex: 11,
              pointerEvents: 'none',
            }
          })
        );
      }
    }
  }

  // ---- POCKET COLLAPSE WARNING ----
  let pocketWarningText = null;
  if (state.phase === 'DECISION' && state.holdTimeData.length > 0) {
    const currentPocket = getPocketPercent(state.holdTimeData, state.currentPhase);
    const warning = getPocketWarning(currentPocket, state.holdTimeData);
    if (warning.text) {
      const qbPxW = posToPixel(state.quarterbackXY.x, state.quarterbackXY.y);
      const warnColor = warning.level === 'critical' ? '#ef4444' :
                        warning.level === 'red' ? '#f97316' : '#eab308';
      pocketWarningText = React.createElement('div', {
        style: {
          position: 'absolute',
          left: qbPxW.left + 'px',
          top: (qbPxW.top + 24) + 'px',
          transform: 'translateX(-50%)',
          color: warnColor,
          fontSize: '11px',
          fontWeight: 'bold',
          whiteSpace: 'nowrap',
          zIndex: 12,
          pointerEvents: 'none',
          textShadow: '0 0 4px rgba(0,0,0,0.8)',
          animation: 'pulse 1s ease-in-out infinite',
        }
      }, warning.text);
    }
  }

  // ---- DOWN & DISTANCE HUD ----
  const downDistHud = React.createElement('div', {
    className: 'hud-compact',
    style: {
      position: 'absolute',
      bottom: 0,
      left: 0,
      right: 0,
      background: 'rgba(0,0,0,0.85)',
      padding: '6px 10px',
      fontSize: '13px',
      zIndex: 15,
    }
  },
    React.createElement('span', { style: { color: '#f5a623', fontWeight: 'bold' } },
      formatDown(state.down, state.dist, state.ballPos)
    ),
    React.createElement('span', { style: { color: '#aaa' } },
      ' at ' + formatFieldPosition(state.ballPos)
    ),
    (state.phase === 'RUNNER' && state.carrier) ?
      React.createElement('span', { style: { color: '#84cc16', marginLeft: '10px' } },
        state.carrier + ' | Moves: ' + state.runMoves + (state.isYAC ? ' (YAC ' + state.yacMoves + '/' + state.maxYacMoves + ')' : '')
      ) : null,
    state.phase === 'DECISION' ?
      React.createElement('span', { style: { color: '#84cc16', marginLeft: '10px' } },
        'Phase: ' + state.currentPhase
      ) : null
  );

  // ---- DEFENSE LABEL BADGE ----
  let defBadge = null;
  if (isActivePlay && state.chosenDefense) {
    const defObj = DEFENSES.find(d => d.id === state.chosenDefense);
    defBadge = React.createElement('div', {
      style: {
        position: 'absolute',
        top: '4px',
        left: '50%',
        transform: 'translateX(-50%)',
        background: 'rgba(180,30,30,0.85)',
        color: '#fff',
        fontSize: '11px',
        fontWeight: 'bold',
        padding: '2px 8px',
        borderRadius: '4px',
        zIndex: 16,
      }
    }, 'DEF: ' + (defObj ? defObj.name : state.chosenDefense));
  }

  // ---- CONTACT SCREEN FLASH ----
  const isContact = state.phase === 'CONTACT';

  // ---- ASSEMBLE FIELD ----
  const fieldChildren = [
    ...turfBands,
    oppEndzone,
    ownEndzone,
    ...yardLines,
    ...hashMarks,
    ...yardNumbers,
    midfieldLogo,
    ...goalPosts,
    losLine,
    firstDownMarker,
    ghostRouteSVG,
    ...playerTokens,
    ballElement,
    ...opennessLabels,
    runArrowElements,
    ...olDots,
    pocketWarningText,
  ];

  const fieldContainer = React.createElement('div', {
    ref: fieldScrollRef,
    className: 'field-container' + (instantCam ? ' instant-cam' : ''),
    style: {
      width: '100%',
      height: totalFieldHeight + 'px',
      position: 'relative',
    }
  }, ...fieldChildren);

  return React.createElement('div', {
    ref: viewportRef,
    className: 'field-viewport' + (isContact ? ' contact-screen' : ''),
  },
    fieldContainer,
    downDistHud,
    defBadge,
    alertElement
  );
}

// ============================================================
// SECTION 4: SCREEN COMPONENTS + APP + RENDER
// ============================================================

// ============================================================
// 1. SCOREBOARD COMPONENT
// ============================================================
function Scoreboard({ state, dispatch }) {
  const isTwoPlayer = state.twoPlayerMode;
  const leftLabel = isTwoPlayer ? 'P1' : 'YOU';
  const rightLabel = isTwoPlayer ? 'P2' : 'CPU';
  const leftScore = isTwoPlayer ? state.p1Score : state.playerScore;

// 6. DECISION SCREEN
// ============================================================
function DecisionScreen({ state, dispatch }) {
  const play = PLAYS.find(function(p) { return p.id === state.selectedPlayId; });
  const params = DIFFICULTY_PARAMS[state.difficulty];
  const holdData = state.holdTimeData || [];
  const pocketPct = getPocketPercent(holdData, state.currentPhase);
  const pocketOverall = pocketPct.overall !== undefined ? pocketPct.overall : (pocketPct >= 0 ? pocketPct : 100);
  const pocketNum = typeof pocketOverall === 'number' ? pocketOverall : 100;
  const pocketWarn = getPocketWarning(pocketPct, holdData);
  const survivalMode = pocketNum < 15;

  // Build pocket bar color
  const pocketColor = pocketNum > 60 ? '#22c55e' : (pocketNum > 30 ? '#eab308' : '#ef4444');

  // Calculate receiver openness for each target
  const receiverKeys = ['W1', 'W2', 'TE', 'RB'];
  const targets = [];
  let bestKey = null;
  let bestOpenness = -1;

  for (let ri = 0; ri < receiverKeys.length; ri++) {
    const rk = receiverKeys[ri];
    const recPos = state.currentReceiverPos[rk];
    if (!recPos) continue;
    // Skip blockers
    if (play && play.routes[rk] === 'block') continue;

    const openness = calculateReceiverOpenness(recPos, state.currentDefenderPos);
    const throwResult = calculateThrowResult(rk, openness.level, pocketNum, state.currentPhase, state.difficulty);
    const hitPct = Math.round(((throwResult.details ? throwResult.details.completionPct : 0) || 0) * 100);
    const intPct = Math.round(((throwResult.details ? throwResult.details.intChance : 0) || 0) * 100);
    const primaryReceiver = rk === bestKey;

    if (openness.level > bestOpenness) {
      bestOpenness = openness.level;
      bestKey = rk;
    }

    targets.push({
      key: rk,
      openness: openness,
      hitPct: hitPct,
      intPct: intPct,
      primaryReceiver: primaryReceiver,
      throwResult: throwResult
    });
  }

  const showBestGlow = params.highlightBestThrow;

  // Target cards
  const targetElements = [];
  for (let ti = 0; ti < targets.length; ti++) {
    const t = targets[ti];
    // In survival mode, hide if pocket < 15% and openness level is 0
    if (survivalMode && t.openness.level === 0) continue;

    const isBest = showBestGlow && t.key === bestKey;
    const isPrimary = t.primaryReceiver;
    const openClass = t.openness.level >= 3 ? 'open-wide' :
                      t.openness.level >= 2 ? 'open-moderate' : 'open-tight';

    targetElements.push(
      React.createElement('div', {
        key: 'tgt-' + t.key,
        className: 'throw-target ' + openClass + (isBest ? ' best-throw' : ''),
        onClick: function() { dispatch({ type: 'THROW', targetKey: t.key }); },
        style: isPrimary ? { boxShadow: '0 0 0 2px gold, ' + (isBest ? '0 0 12px rgba(59,130,246,0.5)' : 'none') } : undefined
      },
        React.createElement('div', { className: 'tgt-name' },
          t.key,
          isPrimary ? React.createElement('span', {
            style: { background: 'gold', color: '#000', fontSize: '9px', padding: '1px 4px', borderRadius: '3px', marginLeft: '4px' }
          }, 'INTENDED') : null
        ),
        React.createElement('div', {
          style: { color: t.openness.color, fontWeight: 'bold', fontSize: '12px', margin: '4px 0' }
        }, t.openness.label),
        React.createElement('div', { className: 'tgt-detail', style: { fontFamily: 'monospace' } },
          'HIT ' + t.hitPct + '%  INT ' + t.intPct + '%'
        )
      )
    );
  }

  // Action buttons
  const actionRow1 = [];
  const actionRow2 = [];
  const actionRow3 = [];

  if (!survivalMode) {
    const moveButtons1 = [
      { label: 'Drop Back', move: 'dropBack', color: '#3b82f6' },
      { label: 'Roll Left', move: 'rollLeft', color: '#6366f1' },
      { label: 'Roll Right', move: 'rollRight', color: '#6366f1' },
      { label: 'Step Up', move: 'stepUp', color: '#3b82f6' }
    ];
    for (let mi = 0; mi < moveButtons1.length; mi++) {
      var mb = moveButtons1[mi];
      (function(moveData) {
        actionRow1.push(
          React.createElement('button', {
            key: moveData.move,
            className: 'btn',
            onClick: function() { dispatch({ type: 'QB_ACTION', move: moveData.move }); },
            style: { background: moveData.color, flex: 1, padding: '8px 4px', fontSize: '12px' }
          }, moveData.label)
        );
      })(mb);
    }

    var lookButtons = [
      { label: 'Look Left', move: 'lookLeft', color: '#8b5cf6' },
      { label: 'Look Right', move: 'lookRight', color: '#8b5cf6' }
    ];
    for (var li = 0; li < lookButtons.length; li++) {
      (function(moveData) {
        actionRow2.push(
          React.createElement('button', {
            key: moveData.move,
            className: 'btn',
            onClick: function() { dispatch({ type: 'QB_ACTION', move: moveData.move }); },
            style: { background: moveData.color, flex: 1, padding: '8px 4px', fontSize: '12px' }
          }, moveData.label)
        );
      })(lookButtons[li]);
    }
  }

  // Row 3: Scramble, Throw Away, Tuck (always available, sole options in survival)
  var escapeButtons = [
    { label: '\u{1F3C3} Scramble', move: 'scramble', color: '#16a34a' },
    { label: '\u274C Throw Away', move: 'throwAway', color: '#ca8a04' },
    { label: '\u{1F91C} Tuck the Ball', move: 'tuck', color: '#dc2626' }
  ];
  for (var ei = 0; ei < escapeButtons.length; ei++) {
    (function(moveData) {
      actionRow3.push(
        React.createElement('button', {
          key: moveData.move,
          className: 'btn',
          onClick: function() { dispatch({ type: 'QB_ACTION', move: moveData.move }); },
          style: { background: moveData.color, flex: 1, padding: '8px 6px', fontSize: '12px' }
        }, moveData.label)
      );
    })(escapeButtons[ei]);
  }

  return React.createElement('div', { className: 'decision-panel', style: { position: 'relative', zIndex: 20 } },
    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' } },
      React.createElement('span', { style: { fontWeight: 'bold', fontSize: '15px' } }, 'QB DECISION'),
      React.createElement('span', { style: { color: '#aaa', fontSize: '12px' } }, 'Phase ' + state.currentPhase)
    ),
    // Pocket bar
    React.createElement('div', { className: 'pocket-bar-container' },
      React.createElement('span', { className: 'pocket-label' }, 'Pocket'),
      React.createElement('div', { className: 'pocket-bar-bg' },
        React.createElement('div', {
          className: 'pocket-bar-fill',
          style: { width: Math.max(0, Math.min(100, pocketNum)) + '%', background: pocketColor }
        })
      ),
      React.createElement('span', { style: { fontSize: '11px', color: pocketColor, minWidth: '32px', textAlign: 'right' } },
        Math.round(pocketNum) + '%'
      )
    ),
    pocketWarn.text ? React.createElement('div', {
      style: { color: '#ef4444', fontSize: '12px', fontWeight: 'bold', textAlign: 'center', margin: '4px 0' }
    }, pocketWarn.text) : null,
    survivalMode ? React.createElement('div', {
      style: { color: '#ef4444', fontSize: '13px', fontWeight: 'bold', textAlign: 'center', margin: '6px 0', animation: 'pulse 0.8s ease-in-out infinite' }

    // Action buttons
    actionRow1.length > 0 ? React.createElement('div', { className: 'action-buttons', style: { marginBottom: '6px' } }, actionRow1) : null,

    React.createElement('div', { className: 'action-buttons' }, actionRow3)
  );
}

// ============================================================
// 7. RPO READ SCREEN
// ============================================================
function RPOScreen({ state, dispatch }) {
  const play = PLAYS.find(function(p) { return p.id === state.selectedPlayId; });
  const defObj = DEFENSES.find(function(d) { return d.id === state.chosenDefense; });
  const params = DIFFICULTY_PARAMS[state.difficulty];

  // Calculate gap status
  const boxCount = defObj ? defObj.players.filter(function(p) {
    return p.y <= 8 && p.x >= 25 && p.x <= 75;
  }).length : 5;
  const gapOpen = boxCount <= 6;

  // Calculate success chances based on gap status
  const handoffBase = gapOpen ? 70 : 35;
  let keepBase = gapOpen ? 50 : 60;
  if (state.chosenDefense === 'blitz') keepBase = 25;
  const passBase = gapOpen ? 60 : 75;

  let scenario;

// 8. RUNNER MODE SCREEN

function RunnerScreen({ state, dispatch }) {
  const carrierLabel = state.carrier || 'RB';
  const carrierRole = state.carrierRole || 'RB';
  const moveLabels = getRunnerMoveLabels(carrierRole);
  const moveColors = ['#f97316', '#3b82f6', '#a855f7', '#22c55e'];

  const isYAC = state.isYAC;
  const moveCounter = isYAC
    ? 'YAC ' + state.yacMoves + '/' + state.maxYacMoves
    : 'Run #' + (state.runMoves + 1);

  // Nearest defender info
  const nearestDef = findNearestDefender(state.carrierXY, state.currentDefenderPos);
  let defWarning = null;
  if (nearestDef) {
    const dist = nearestDef.distance;
    const defColor = dist < 2 ? '#ef4444' : (dist < 4 ? '#eab308' : '#22c55e');
    defWarning = React.createElement('div', {
      style: { textAlign: 'center', fontSize: '12px', color: defColor, marginBottom: '6px' }
    }, 'Nearest defender: ' + (nearestDef.id || 'DEF') + ' (' + dist.toFixed(1) + ' yds)');
  }

  // Calculate success rates
  const runButtons = [];
  for (let mi = 0; mi < moveLabels.length; mi++) {
    const ml = moveLabels[mi];
    const runResult = calculateRunSuccess(ml.type, state.carrierXY, state.currentDefenderPos, state.runMoves);
    const successPct = Math.round((runResult.rate || 0.5) * 100);

    (function(moveData, idx, pct) {
      runButtons.push(
        React.createElement('button', {
          key: 'rm-' + idx,
          className: 'btn',
          onClick: function() { dispatch({ type: 'RUNNER_MOVE', moveType: moveData.type }); },
          style: { background: moveColors[idx % 4], flex: 1, padding: '12px 8px', textAlign: 'center', minWidth: '45%' }
        },
          React.createElement('div', { style: { fontWeight: 'bold', fontSize: '14px' } }, moveData.label),
          React.createElement('div', { style: { fontSize: '10px', opacity: 0.8 } }, pct + '% | ' + moveData.description)
        )
      );
    })(ml, mi, successPct);
  }

  return React.createElement('div', { style: { padding: '8px', position: 'relative', zIndex: 20 } },
    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' } },
      React.createElement('span', { style: { fontWeight: 'bold', fontSize: '15px' } },
        carrierLabel + ' \u2014 MAKE A MOVE'
      ),
      React.createElement('span', { style: { color: '#aaa', fontSize: '12px' } }, moveCounter),
      isYAC ? React.createElement('span', {

      }, 'YAC') : null

    defWarning,

      style: { display: 'flex', flexWrap: 'wrap', gap: '8px' }
